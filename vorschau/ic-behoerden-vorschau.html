      a = { id: 'A-' + nextNo('app'), caseNo: null, kind: d.kind, status: 'entwurf', applicant: { charId: s.me.charId, name: s.me.name }, createdAt: now(), events: [], fees: null, founders: [] };
      s.applications.push(a);
    }
    if (a.status !== 'entwurf' && a.status !== 'nachbesserung') return fail('Dieser Antrag kann nicht mehr bearbeitet werden.');
    Object.assign(a, IC.clone(d), { id: a.id, status: a.status, applicant: a.applicant, createdAt: a.createdAt, events: a.events, caseNo: a.caseNo, fees: a.fees });
    return ok({ id: a.id });
  };

  H.appSubmit = (p) => {
    const d = p.draft;
    const f = form(d.legalForm);
    const errors = [];
    if (!f) return fail('Rechtsform fehlt.');
    const prev = d.id ? appById(d.id) : null;
    const resubmit = !!(prev && prev.status === 'nachbesserung');
    const el = eligibility(s.me, d.kind, true, resubmit ? prev.id : null);
    if (!el.ok) errors.push({ field: 'elig', text: 'Voraussetzungen nicht erfüllt: ' + el.checks.filter((c) => !c.ok).map((c) => c.text).join('; ') });
    const nc = nameCheck(d.name, d.legalForm, d.id);
    if (!nc.ok) errors.push({ field: 'name', text: nc.issues.filter((i) => i.level === 'error').map((i) => i.text)[0] });
    const b = d.branch ? branchOf(d.branch) : null;
    if (d.kind === 'unternehmen') {
      if (!b) errors.push({ field: 'branch', text: 'Bitte eine Branche wählen.' });
      else if (!resubmit && branchUsed(b.key) >= branchCap(b)) errors.push({ field: 'branch', text: 'In der Branche „' + b.label + '“ sind alle Plätze vergeben.' });
      const sum = d.founders.reduce((n, x) => n + (Number(x.share) || 0), 0);
      if (sum !== 100) errors.push({ field: 'founders', text: 'Die Anteile müssen zusammen 100 % ergeben (aktuell ' + sum + ' %).' });
      if (!d.concept || String(d.concept.idea || '').trim().length < 80) errors.push({ field: 'concept', text: 'Bitte die Geschäftsidee ausführlicher beschreiben (mindestens 80 Zeichen).' });
    } else if (!d.statute || String(d.statute.purpose || '').trim().length < 80) {
      errors.push({ field: 'concept', text: 'Bitte den Zweck der Organisation ausführlicher beschreiben (mindestens 80 Zeichen).' });
    }
    if (d.founders.length < f.minFounders) errors.push({ field: 'founders', text: 'Mindestens ' + f.minFounders + ' ' + IC.plural(f.minFounders, 'Gründer', 'Gründer') + ' erforderlich.' });
    if (d.founders.some((x) => x.consent !== 'ok' && x.consent !== 'self')) errors.push({ field: 'founders', text: 'Nicht alle Mitgründer haben zugestimmt.' });
    if (b && b.needsProperty && !(d.property && d.property.mode === 'immobilie' && d.property.id)) errors.push({ field: 'property', text: 'Diese Branche verlangt einen festen Standort.' });
    if (d.property && d.property.mode === 'immobilie' && d.property.id && propertyTaken(d.property.id) && !(prev && prev.property && prev.property.id === d.property.id)) errors.push({ field: 'property', text: 'Die gewählte Immobilie ist nicht mehr frei.' });
    if (d.kind === 'fraktion' && !d.ooc) errors.push({ field: 'ooc', text: 'Bitte die OOC-Angaben ausfüllen.' });
    const fees = feesOf(d.legalForm, d.branch);
    const payNow = resubmit ? 0 : fees.payNow;
    if (payNow > s.me.bank) errors.push({ field: 'bank', text: 'Der Kontostand reicht nicht aus. Benötigt: ' + IC.money(payNow) + '.' });
    if (errors.length) return fail('Der Antrag ist noch nicht vollständig.', { errors });

    let a = prev;
    if (!a) {
      a = { id: 'A-' + nextNo('app'), kind: d.kind, applicant: { charId: s.me.charId, name: s.me.name }, createdAt: now(), events: [] };
      s.applications.push(a);
    }
    Object.assign(a, IC.clone(d), { id: a.id, applicant: a.applicant, createdAt: a.createdAt, events: a.events });
    a.name = nc.display;
    if (!a.caseNo) a.caseNo = 'GA-' + new Date(now()).getFullYear() + '-' + pad4(nextNo('caseNo'));
    s.me.bank -= payNow;
    if (!resubmit) {
      a.fees = { apply: fees.apply, register: fees.register, capital: fees.capital, paid: true };
      s.treasury += fees.apply;
    }
    a.status = 'eingereicht';
    a.submittedAt = a.submittedAt || now();
    a.reservedUntil = now() + R.nameReserveDays * DAY;
    a.remark = null;
    pushEvent(a, 'eingereicht', s.me.name, 'bürger', resubmit ? 'Antrag nach Nachbesserung erneut eingereicht' : 'Antrag eingereicht, Antragsgebühr bezahlt');
    audit(s.me.name, 'bürger', resubmit ? 'Antrag erneut eingereicht' : 'Antrag eingereicht', a.caseNo, a.name);
    return ok({ id: a.id, caseNo: a.caseNo, paid: payNow, name: a.name });
  };

  H.appWithdraw = (p) => {
    const a = appById(p.id);
    if (!a || !mine(a)) return fail('Antrag nicht gefunden.');
    if (a.status === 'entwurf') { s.applications.splice(s.applications.indexOf(a), 1); return ok({ deleted: true }); }
    if (!isOpenApp(a)) return fail('Dieser Antrag lässt sich nicht mehr zurückziehen.');
    s.appointments.forEach((ap) => { if (ap.applicationId === a.id && OPEN_APPT.indexOf(ap.status) !== -1) ap.status = 'abgesagt'; });
    const back = refund(a);
    a.status = 'zurueckgezogen';
    pushEvent(a, 'zurueckgezogen', s.me.name, 'bürger', 'Antrag zurückgezogen', back ? IC.money(back) + ' wurden erstattet. Die Antragsgebühr ist nicht erstattbar.' : null);
    audit(s.me.name, 'bürger', 'Antrag zurückgezogen', a.caseNo, a.name);
    return ok({ refunded: back });
  };

  H.appObjection = (p) => {
    const a = appById(p.id);
    if (!a || !mine(a) || a.status !== 'abgelehnt') return fail('Gegen diesen Antrag ist kein Einspruch möglich.');
    if (now() > a.objectionUntil) return fail('Die Einspruchsfrist von ' + R.objectionHours + ' Stunden ist abgelaufen.');
    if (String(p.text || '').trim().length < 20) return fail('Bitte den Einspruch mit mindestens 20 Zeichen begründen.');
    a.status = 'einspruch';
    pushEvent(a, 'einspruch', s.me.name, 'bürger', 'Einspruch eingelegt', p.text.trim());
    audit(s.me.name, 'bürger', 'Einspruch', a.caseNo, p.text.trim().slice(0, 80));
    return ok();
  };

  H.entityChange = (p) => {
    const e = entById(p.id);
    if (!e || !e.myOwn) return fail('Eintrag nicht gefunden.');
    if (e.status === 'aufgeloest' || e.status === 'gesperrt') return fail('Dieser Eintrag lässt sich nicht ändern.');
    if (s.me.bank < R.feeChange) return fail('Der Kontostand reicht nicht aus. Benötigt: ' + IC.money(R.feeChange) + '.');
    if (p.type === 'name') {
      const nc = nameCheck(p.value, e.legalForm);
      if (!nc.ok) return fail(nc.issues.filter((i) => i.level === 'error')[0].text);
      e.pendingChange = { type: 'name', value: nc.display, at: now() };
    } else {
      if (String(p.value || '').trim().length < 3) return fail('Bitte einen gültigen neuen Sitz angeben.');
      e.pendingChange = { type: 'sitz', value: p.value.trim(), at: now() };
    }
    s.me.bank -= R.feeChange;
    s.treasury += R.feeChange;
    audit(s.me.name, 'bürger', 'Änderungsantrag', e.regNo, e.pendingChange.type + ': ' + e.pendingChange.value);
    return ok({ fee: R.feeChange });
  };

  H.entityDissolve = (p) => {
    const e = entById(p.id);
    if (!e || !e.myOwn) return fail('Eintrag nicht gefunden.');
    e.status = 'aufgeloest';
    e.dissolvedAt = now();
    audit(s.me.name, 'bürger', 'Auflösung', e.regNo, e.name);
    return ok();
  };

  H.entityDuplicate = (p) => {
    const e = entById(p.id);
    if (!e || !e.myOwn) return fail('Eintrag nicht gefunden.');
    if (s.me.bank < R.feeDuplicate) return fail('Der Kontostand reicht nicht aus. Benötigt: ' + IC.money(R.feeDuplicate) + '.');
    s.me.bank -= R.feeDuplicate;
    s.treasury += R.feeDuplicate;
    audit(s.me.name, 'bürger', 'Duplikat Gewerbeschein', e.regNo, e.name);
    return ok({ fee: R.feeDuplicate });
  };

  H.legacyConfirm = (p) => {
    const e = entById(p.id);
    if (!e || !e.myOwn || !e.legacy) return fail('Kein Bestandsschutz-Eintrag.');
    e.legacyConfirmed = true;
    audit(s.me.name, 'bürger', 'Bestandsbestätigung', e.regNo, e.name);
    return ok();
  };

  H.registerSearch = (p) => {
    const q = IC.normName(p.q || '');
    const rows = s.entities.filter((e) => {
      if (p.kind && e.kind !== p.kind) return false;
      if (p.branch && e.branch !== p.branch) return false;
      if (p.status && e.status !== p.status) return false;
      if (!q) return true;
      return IC.normName(e.name).indexOf(q) !== -1 || e.regNo.toLowerCase().replace(/\s/g, '').indexOf(String(p.q).toLowerCase().replace(/\s/g, '')) !== -1 || IC.normName(e.owner).indexOf(q) !== -1;
    }).map(publicEntity).sort((a, b) => a.name.localeCompare(b.name, 'de'));
    return ok({ rows });
  };

  /* ----- Mitgründer einladen (im Spiel antwortet der eingeladene Spieler, hier nach kurzer Zeit automatisch) ----- */
  H.founderInvite = (p) => {
    const person = s.nearby.find((x) => x.charId === p.charId);
    if (!person) return fail('Diese Person ist nicht in Ihrer Nähe.');
    const el = eligibility(person, 'unternehmen', false);
    if (!el.ok) return fail(person.name + ' erfüllt die Voraussetzungen nicht: ' + el.checks.filter((c) => !c.ok).map((c) => c.text).join('; ') + '.');
    s.invites = s.invites || {};
    s.invites[p.charId] = { at: Date.now() };
    return ok();
  };
  H.founderStatus = () => {
    const statuses = {};
    Object.keys(s.invites || {}).forEach((id) => { statuses[id] = Date.now() - s.invites[id].at >= 1200 ? 'ok' : 'pending'; });
    return ok({ statuses });
  };
  H.founderCancel = (p) => { if (s.invites) delete s.invites[p.charId]; return ok(); };

  /* ----- Bürgeramt ----- */
  H.slotsList = (p) => {
    const type = typeOf(p.typeId);
    if (!type) return fail('Unbekannte Terminart.');
    const days = [];
    for (let d = 0; d <= R.bookAheadDays; d++) {
      const sl = slotsFor(type, d, p.excludeApptId);
      const dayTs = IC.startOfDay(now() + d * DAY);
      days.push({ offset: d, ts: dayTs, free: sl.filter((x) => x.free > 0).length, total: sl.length });
    }
    const off = Math.max(0, Math.min(R.bookAheadDays, p.dayOffset || 0));
    return ok({ days, slots: slotsFor(type, off, p.excludeApptId), dayOffset: off, eligible: eligibleCount(type), onDuty: dutyList().length });
  };

  H.apptBook = (p) => {
    const type = typeOf(p.typeId);
    if (!type) return fail('Unbekannte Terminart.');
    const b = banUntil();
    if (b) return fail('Sie sind für Termine gesperrt bis ' + IC.fdt(b) + '.');
    const openAppts = s.appointments.filter((a) => OPEN_APPT.indexOf(a.status) !== -1 && a.booker === s.me.charId && a.id !== p.rescheduleId).length;
    if (openAppts >= R.maxOpenAppointments) return fail('Sie haben bereits ' + R.maxOpenAppointments + ' offene Termine.');
    let app = null, ent = null;
    if (type.needs === 'application') {
      app = appById(p.applicationId);
      if (!app || !mine(app)) return fail('Bitte einen Antrag auswählen.');
      if (type.forStatus.indexOf(app.status) === -1 && !(app.id === (p.rescheduleAppId) && app.status === 'termin_gebucht')) return fail('Für diesen Antrag ist der Termin noch nicht möglich (Status: ' + L.APP[app.status].label + ').');
      if (type.appKind && app.kind !== type.appKind) return fail('Diese Terminart passt nicht zum Antrag.');
    } else if (type.needs === 'entity') {
      ent = entById(p.entityId);
      if (!ent || !ent.myOwn) return fail('Bitte einen Eintrag auswählen.');
      if (type.entityNeeds === 'conditions' && !ent.conditions.some((c) => !c.done)) return fail('Für diesen Eintrag sind keine Auflagen offen.');
    }
    const dayOffset = Math.round((IC.startOfDay(p.start) - IC.startOfDay(now())) / DAY);
    if (dayOffset < 0 || dayOffset > R.bookAheadDays) return fail('Dieser Tag liegt außerhalb des Buchungszeitraums.');
    const slot = slotsFor(type, dayOffset, p.rescheduleId).find((x) => x.start === p.start);
    if (!slot) return fail('Zu diesem Zeitpunkt ist kein Beamter verfügbar.');
    if (slot.free < 1) return fail('Dieser Termin ist leider schon vergeben.');
    const att = (p.attendees || []).map((id) => {
      const person = id === s.me.charId ? s.me : (s.nearby.find((x) => x.charId === id) || Object.keys(s.people).map((k) => s.people[k]).find((x) => x.charId === id));
      return person ? { charId: person.charId, name: person.name, checkedIn: false, mandatory: false } : null;
    }).filter(Boolean);
    if (!att.some((x) => x.charId === s.me.charId)) att.unshift({ charId: s.me.charId, name: s.me.name, checkedIn: false, mandatory: true });
    if (app && type.needs === 'application') {
      const must = app.founders.filter((f) => f.role === 'geschaeftsfuehrer' || f.role === 'inhaber' || f.role === 'vorsitz' || (f.share || 0) >= 25 || app.kind === 'fraktion');
      const missing = must.filter((f) => !att.some((x) => x.charId === f.charId));
      if (missing.length) return fail('Es fehlen Pflichtteilnehmer: ' + missing.map((m) => m.name).join(', ') + '.');
      att.forEach((x) => { x.mandatory = must.some((f) => f.charId === x.charId); });
    } else att.forEach((x) => { x.mandatory = x.charId === s.me.charId; });
    if (p.rescheduleId) {
      const old = apptById(p.rescheduleId);
      if (old) old.status = 'abgesagt';
    }
    const ap = {
      id: 'T-' + nextNo('appt'), typeId: type.key, applicationId: app ? app.id : null, entityId: ent ? ent.id : null, start: p.start, minutes: type.minutes,
      status: 'gebucht', booker: s.me.charId, bookerName: s.me.name, attendees: att, official: null, note: String(p.note || '').slice(0, 200), source: slot.source, createdAt: now(),
    };
    s.appointments.push(ap);
    if (app) { if (app.status !== 'termin_gebucht') app.restoreStatus = app.status; app.status = 'termin_gebucht'; app.apptId = ap.id; app.priority = false; pushEvent(app, 'termin_gebucht', s.me.name, 'bürger', 'Vorstellungstermin gebucht', IC.fdt(ap.start) + ' Uhr'); }
    audit(s.me.name, 'bürger', 'Termin gebucht', ap.id, type.label + ', ' + IC.fdt(ap.start));
    return ok({ id: ap.id });
  };

  H.apptCancel = (p) => {
    const ap = apptById(p.id);
    if (!ap || ap.booker !== s.me.charId) return fail('Termin nicht gefunden.');
    if (['gebucht', 'eingecheckt'].indexOf(ap.status) === -1) return fail('Dieser Termin lässt sich nicht mehr absagen.');
    const late = ap.start - now() < R.cancelFreeMinutes * MIN;
    if (late) s.me.strikes.push(now());
    ap.status = 'abgesagt';
    const a = ap.applicationId ? appById(ap.applicationId) : null;
    if (a && a.status === 'termin_gebucht') { a.status = a.restoreStatus || 'vorpruefung_ok'; pushEvent(a, a.status, s.me.name, 'bürger', 'Termin abgesagt'); }
    audit(s.me.name, 'bürger', 'Termin abgesagt', ap.id, late ? 'Kurzfristig, 1 Strike' : 'Rechtzeitig');
    return ok({ strike: late });
  };

  H.apptCheckin = (p) => {
    const ap = apptById(p.id);
    if (!ap) return fail('Termin nicht gefunden.');
    const me = ap.attendees.find((x) => x.charId === s.me.charId);
    if (!me) return fail('Sie sind für diesen Termin nicht eingetragen.');
    if (['gebucht', 'eingecheckt'].indexOf(ap.status) === -1) return fail('Einchecken ist für diesen Termin nicht mehr möglich.');
    if (now() < ap.start - R.checkinBefore * MIN) return fail('Einchecken ist ab ' + R.checkinBefore + ' Minuten vor Terminbeginn möglich (ab ' + IC.ftime(ap.start - R.checkinBefore * MIN) + ' Uhr).');
    if (now() > ap.start + R.checkinAfter * MIN) return fail('Das Check-in-Fenster ist geschlossen.');
    me.checkedIn = true;
    /* Vorschau: Mitgründer sind echte Spieler. Hier treffen sie gemeinsam mit Ihnen ein. */
    const others = ap.attendees.filter((x) => x.charId !== s.me.charId && !x.checkedIn);
    others.forEach((x) => { x.checkedIn = true; });
    if (ap.attendees.filter((x) => x.mandatory).every((x) => x.checkedIn)) ap.status = 'eingecheckt';
    return ok({ allIn: ap.status === 'eingecheckt', othersIn: others.length });
  };

  H.queueTake = (p) => {
    const type = typeOf(p.typeId || 'beratung');
    if (s.myTicket) return fail('Sie haben bereits die Wartenummer ' + s.myTicket.no + '.');
    if (eligibleCount(type) < 1) return fail('Zurzeit ist kein Beamter im Dienst. Eine Wartenummer ist nicht möglich.');
    s.queueSeq++;
    const no = 'A-' + String(s.queueSeq).padStart(3, '0');
    s.queue.push({ no, who: s.me.name, typeId: type.key, at: now(), mine: true });
    s.myTicket = { no, typeId: type.key, at: now() };
    const pos = s.queue.length;
    return ok({ no, position: pos, etaMin: Math.max(3, Math.round((pos * 8) / Math.max(1, dutyList().length))) });
  };
  H.queueLeave = () => {
    if (!s.myTicket) return ok();
    s.queue = s.queue.filter((q) => q.no !== s.myTicket.no);
    s.myTicket = null;
    return ok();
  };
  H.notifyOnDuty = (p) => { s.me.notifyOnDuty = !!p.enabled; return ok({ enabled: s.me.notifyOnDuty }); };

  /* ----- Beamte ----- */
  const needOnDuty = () => (s.meOfficial.state !== 'on' ? fail('Sie müssen im Dienst sein, um diese Aktion auszuführen.') : null);
  const needRank = (r) => (lvl(s.meOfficial.rank) < lvl(r) ? fail('Dafür ist mindestens der Rang „' + L.RANK[r].label + '“ erforderlich.') : null);

  H.dutySet = (p) => {
    const o = s.meOfficial;
    const was = o.state;
    o.state = p.state;
    if (p.desk) o.desk = p.desk;
    audit(o.name, 'beamter', 'Dienststatus', o.dienstnr, was + ' → ' + p.state);
    if (p.state === 'on' && was !== 'on' && s.me.notifyOnDuty) {
      s.me.notifyOnDuty = false;
      notice('Ein Beamter ist jetzt im Dienst. Termine sind buchbar.', 'ok');
    }
    return ok({ state: o.state });
  };

  H.appReview = (p) => {
    const e = needOnDuty() || needRank('sachbearbeiter');
    if (e) return e;
    const a = appById(p.id);
    if (!a || a.status !== 'eingereicht') return fail('Dieser Antrag wartet nicht auf die Vorprüfung.');
    const msg = String(p.message || '').trim();
    const o = s.meOfficial;
    if (p.result === 'ok') {
      a.status = 'vorpruefung_ok';
      a.vorpruefungAt = now();
      pushEvent(a, 'vorpruefung_ok', o.name, 'beamter', 'Vorprüfung bestanden', msg || null);
      if (mine(a)) notice('Die Vorprüfung für „' + a.name + '“ ist bestanden. Sie können jetzt einen Termin im Bürgeramt buchen.', 'ok');
    } else if (p.result === 'nachbesserung') {
      if (msg.length < 10) return fail('Bitte beschreiben, was nachgebessert werden muss (mindestens 10 Zeichen).');
      a.status = 'nachbesserung';
      a.remark = msg;
      pushEvent(a, 'nachbesserung', o.name, 'beamter', 'Nachbesserung erforderlich', msg);
      if (mine(a)) notice('Für „' + a.name + '“ ist eine Nachbesserung erforderlich.', 'warn');
    } else if (p.result === 'abgelehnt') {
      if (msg.length < 10) return fail('Eine Ablehnung braucht eine Begründung (mindestens 10 Zeichen).');
      a.status = 'abgelehnt';
      a.objectionUntil = now() + R.objectionHours * HOUR;
      a.decision = { decision: 'abgelehnt', reason: msg, by: o.name, at: now(), conditions: [] };
      refund(a);
      pushEvent(a, 'abgelehnt', o.name, 'beamter', 'Antrag abgelehnt', msg);
      if (mine(a)) notice('Der Antrag „' + a.name + '“ wurde abgelehnt. Einspruch ist ' + R.objectionHours + ' Stunden lang möglich.', 'bad');
    } else return fail('Unbekanntes Ergebnis.');
    audit(o.name, 'beamter', 'Vorprüfung', a.caseNo, p.result + (msg ? ': ' + msg.slice(0, 60) : ''));
    return ok();
  };

  H.conflictReport = (p) => {
    const a = appById(p.id);
    if (!a) return fail('Antrag nicht gefunden.');
    a.conflicts = (a.conflicts || []).concat(s.meOfficial.id);
    audit(s.meOfficial.name, 'beamter', 'Befangenheit gemeldet', a.caseNo, 'Antrag wird an einen anderen Beamten übergeben');
    return ok();
  };

  H.apptCall = (p) => {
    const e = needOnDuty();
    if (e) return e;
    const ap = apptById(p.id);
    if (!ap || ['gebucht', 'eingecheckt'].indexOf(ap.status) === -1) return fail('Dieser Termin lässt sich nicht aufrufen.');
    ap.status = 'aufgerufen';
    s.calling = { no: ap.id, desk: s.meOfficial.desk, at: now() };
    if (ap.booker === s.me.charId) notice('Sie werden aufgerufen: Schalter ' + s.meOfficial.desk + '.', 'warn');
    return ok();
  };

  H.apptStart = (p) => {
    const e = needOnDuty();
    if (e) return e;
    const ap = apptById(p.id);
    if (!ap || ['gebucht', 'eingecheckt', 'aufgerufen'].indexOf(ap.status) === -1) return fail('Dieser Termin lässt sich nicht starten.');
    const type = typeOf(ap.typeId);
    const r = needRank(type.minRank);
    if (r) return r;
    const missing = ap.attendees.filter((x) => x.mandatory && !x.checkedIn);
    if (missing.length) return fail('Pflichtteilnehmer fehlen noch: ' + missing.map((m) => m.name).join(', ') + '.');
    ap.status = 'laeuft';
    ap.official = { id: s.meOfficial.id, name: s.meOfficial.name };
    ap.startedAt = now();
    const a = ap.applicationId ? appById(ap.applicationId) : null;
    if (a && a.status === 'termin_gebucht') { a.status = 'termin_laeuft'; pushEvent(a, 'termin_laeuft', s.meOfficial.name, 'beamter', 'Vorstellungstermin begonnen'); }
    return ok();
  };

  H.apptNoShow = (p) => {
    const e = needOnDuty();
    if (e) return e;
    const ap = apptById(p.id);
    if (!ap || OPEN_APPT.indexOf(ap.status) === -1 || ap.status === 'laeuft') return fail('Dieser Termin lässt sich nicht als „nicht erschienen“ markieren.');
    if (now() < ap.start + R.checkinAfter * MIN && !p.force) return fail('Erst ' + R.checkinAfter + ' Minuten nach Terminbeginn möglich (ab ' + IC.ftime(ap.start + R.checkinAfter * MIN) + ' Uhr).');
    ap.status = p.excused ? 'abgesagt' : 'nicht_erschienen';
    if (!p.excused && ap.booker === s.me.charId) s.me.strikes.push(now());
    const a = ap.applicationId ? appById(ap.applicationId) : null;
    if (a && a.status === 'termin_gebucht') { a.status = a.restoreStatus || 'vorpruefung_ok'; pushEvent(a, a.status, s.meOfficial.name, 'beamter', p.excused ? 'Termin entschuldigt' : 'Gründer nicht erschienen'); }
    audit(s.meOfficial.name, 'beamter', p.excused ? 'Entschuldigt' : 'Nicht erschienen', ap.id, ap.bookerName);
    return ok();
  };

  H.queueNext = () => {
    const e = needOnDuty();
    if (e) return e;
    const q = s.queue.shift();
    if (!q) return fail('Die Warteschlange ist leer.');
    s.calling = { no: q.no, desk: s.meOfficial.desk, at: now() };
    if (s.myTicket && s.myTicket.no === q.no) notice('Ihre Wartenummer ' + q.no + ' wird aufgerufen: Schalter ' + s.meOfficial.desk + '.', 'warn');
    return ok({ no: q.no });
  };

  H.apptDecide = (p) => {
    const e = needOnDuty();
    if (e) return e;
    const ap = apptById(p.id);
    if (!ap || ap.status !== 'laeuft') return fail('Der Termin muss laufen, bevor entschieden werden kann.');
    const type = typeOf(ap.typeId);
    const r = needRank('sachbearbeiter') || needRank(type.minRank);
    if (r) return r;
    const reason = String(p.reason || '').trim();
    const conds = (p.conditions || []).map((c) => String(c).trim()).filter(Boolean);
    const list = cfg.checklists[type.key] || [];
    const checked = p.checklist || {};
    const a = ap.applicationId ? appById(ap.applicationId) : null;
    const ent = ap.entityId ? entById(ap.entityId) : null;
    const dec = p.decision;
    if (['genehmigt', 'auflagen', 'vertagt', 'abgelehnt'].indexOf(dec) === -1) return fail('Bitte eine Entscheidung wählen.');
    if (dec === 'genehmigt' || dec === 'auflagen') {
      const open = list.filter((i) => !i.optional && !checked[i.key]);
      if (dec === 'genehmigt' && open.length) return fail('Für eine Genehmigung müssen alle Pflichtpunkte der Checkliste erfüllt sein (offen: ' + open.length + ').');
    }
    if (dec === 'auflagen' && !conds.length) return fail('Bitte mindestens eine Auflage angeben.');
    if (dec !== 'genehmigt' && reason.length < 10) return fail('Bitte eine Begründung angeben (mindestens 10 Zeichen).');
    const o = s.meOfficial;
    ap.status = 'abgeschlossen';
    ap.result = { decision: dec, reason, conditions: conds, by: o.name, at: now() };
    s.treasury -= R.officialPay;
    let outcome = null;
    if (type.key === 'beratung') {
      outcome = 'beratung';
    } else if (type.key === 'aenderung' && ent) {
      if (dec === 'genehmigt' && ent.pendingChange) {
        if (ent.pendingChange.type === 'name') ent.name = ent.pendingChange.value; else ent.hq = ent.pendingChange.value;
        ent.pendingChange = null; outcome = 'geaendert';
      } else if (dec !== 'genehmigt') { ent.pendingChange = null; outcome = 'abgelehnt'; }
    } else if (type.key === 'nachkontrolle' && ent) {
      if (dec === 'genehmigt') { ent.conditions.forEach((c) => { c.done = true; }); if (ent.status === 'probezeit') ent.status = 'aktiv'; outcome = 'erfuellt'; }
      else outcome = 'offen';
    } else if (a) {
      a.decision = { decision: dec, reason, by: o.name, at: now(), conditions: conds };
      if (type.key === 'einspruch') {
        if (dec === 'genehmigt' || dec === 'auflagen') {
          pushEvent(a, 'einspruch', o.name, 'beamter', 'Einspruch stattgegeben', reason || null);
          if (staffGateNeeded(a)) { a.status = 'staff_pruefung'; outcome = 'staff'; } else { registerEntity(a); outcome = 'eingetragen'; }
        } else { a.status = 'abgelehnt'; a.objectionUntil = 0; pushEvent(a, 'abgelehnt', o.name, 'beamter', 'Einspruch zurückgewiesen', reason); outcome = 'abgelehnt'; }
      } else if (dec === 'genehmigt' || dec === 'auflagen') {
        pushEvent(a, 'termin_laeuft', o.name, 'beamter', dec === 'auflagen' ? 'Genehmigt mit Auflagen' : 'Genehmigt', reason || null);
        if (staffGateNeeded(a)) {
          a.status = 'staff_pruefung';
          pushEvent(a, 'staff_pruefung', 'Registerführung', 'system', 'Schlussprüfung durch die Registerführung', 'Die Eintragung wird nach der Schlussprüfung vollzogen.');
          outcome = 'staff';
        } else { registerEntity(a); outcome = 'eingetragen'; }
      } else if (dec === 'vertagt') {
        a.status = 'nachbesserung'; a.remark = reason; a.priority = true;
        pushEvent(a, 'nachbesserung', o.name, 'beamter', 'Vertagt, Nachbesserung erforderlich', reason);
        outcome = 'vertagt';
      } else {
        a.status = 'abgelehnt'; a.objectionUntil = now() + R.objectionHours * HOUR; refund(a);
        pushEvent(a, 'abgelehnt', o.name, 'beamter', 'Antrag abgelehnt', reason);
        outcome = 'abgelehnt';
      }
      if (mine(a)) notice('Entscheidung zu „' + a.name + '“: ' + L.DECISION[dec].label + '.', dec === 'abgelehnt' ? 'bad' : dec === 'vertagt' ? 'warn' : 'ok');
    }
    audit(o.name, 'beamter', 'Entscheidung', a ? a.caseNo : ap.id, L.DECISION[dec].label + (reason ? ': ' + reason.slice(0, 60) : ''));
    return ok({ outcome, decision: dec, caseNo: a ? a.caseNo : null, regNo: a && a.entityId ? entById(a.entityId).regNo : null });
  };

  H.hoursCreate = (p) => {
    const e = needRank('sachbearbeiter');
    if (e) return e;
    const start = Number(p.start), end = Number(p.end);
    if (!(end > start)) return fail('Das Ende muss nach dem Beginn liegen.');
    if (end - start < 30 * MIN) return fail('Eine Sprechzeit dauert mindestens 30 Minuten.');
    if (start < now()) return fail('Sprechzeiten müssen in der Zukunft liegen.');
    if (start > now() + R.bookAheadDays * DAY) return fail('Sprechzeiten sind höchstens ' + R.bookAheadDays + ' Tage im Voraus möglich.');
    if (s.officeHours.some((h) => h.officialId === s.meOfficial.id && h.start < end && h.end > start)) return fail('Sie haben in diesem Zeitraum bereits eine Sprechzeit.');
    const h = { id: 'H-' + nextNo('hours'), officialId: s.meOfficial.id, start, end, types: null };
    s.officeHours.push(h);
    audit(s.meOfficial.name, 'beamter', 'Sprechzeit veröffentlicht', h.id, IC.fdt(start) + ' bis ' + IC.ftime(end));
    return ok({ id: h.id });
  };
  H.hoursDelete = (p) => {
    const h = s.officeHours.find((x) => x.id === p.id);
    if (!h) return fail('Sprechzeit nicht gefunden.');
    if (h.officialId !== s.meOfficial.id && lvl(s.meOfficial.rank) < lvl('amtsleiter')) return fail('Fremde Sprechzeiten kann nur ein Amtsleiter löschen.');
    s.officeHours.splice(s.officeHours.indexOf(h), 1);
    audit(s.meOfficial.name, 'beamter', 'Sprechzeit gelöscht', h.id, IC.fdt(h.start));
    return ok();
  };

  H.sanctionIssue = (p) => {
    const e = needOnDuty() || needRank('amtsleiter');
    if (e) return e;
    const ent = entById(p.entityId);
    if (!ent) return fail('Eintrag nicht gefunden.');
    const reason = String(p.reason || '').trim();
    if (reason.length < 10) return fail('Bitte eine Begründung angeben (mindestens 10 Zeichen).');
    ent.history = ent.history || [];
    ent.history.push({ ts: now(), level: p.level, reason, by: s.meOfficial.name });
    if (p.level === 'auflage') ent.conditions.push({ id: 'C-' + nextNo('cond'), text: reason, due: now() + 14 * DAY, done: false });
    if (p.level === 'untersagung') ent.status = 'gesperrt';
    if (p.level === 'entzug') { ent.status = 'aufgeloest'; ent.dissolvedAt = now(); }
    if (p.level === 'bussgeld') { s.treasury += 500; }
    audit(s.meOfficial.name, 'beamter', 'Sanktion: ' + L.SANCTION[p.level], ent.regNo, reason.slice(0, 60));
    return ok();
  };

  /* ----- Staff ----- */
  H.staffGate = (p) => {
    const a = appById(p.id);
    if (!a || a.status !== 'staff_pruefung') return fail('Dieser Antrag wartet nicht auf die Schlussprüfung.');
    if (p.decision === 'freigeben') {
      if (a.ooc && a.ooc.category === 'untergrund' && s.staff.undergroundCap.used >= s.staff.undergroundCap.max) return fail('Alle Untergrund-Plätze sind belegt. Erhöhen Sie die Kapazität oder weisen Sie den Antrag zurück.');
      registerEntity(a, 'Registerführung');
      audit('Staff', 'staff', 'Freigabe', a.caseNo, a.name);
      return ok();
    }
    const note = String(p.note || '').trim();
    if (note.length < 10) return fail('Bitte einen Grund angeben (mindestens 10 Zeichen).');
    a.status = 'nachbesserung';
    a.remark = 'Hinweis der Registerführung: ' + note;
    pushEvent(a, 'nachbesserung', 'Registerführung', 'staff', 'Schlussprüfung nicht bestanden', note);
    audit('Staff', 'staff', 'Zurückgewiesen', a.caseNo, note.slice(0, 60));
    return ok();
  };
  H.staffWritten = (p) => {
    if (!s.staff.settings.writtenProcedure) return fail('Das schriftliche Verfahren ist abgeschaltet.');
    const a = appById(p.id);
    if (!a || a.status !== 'vorpruefung_ok') return fail('Dieser Antrag ist nicht für das schriftliche Verfahren geeignet.');
    const reason = String(p.reason || '').trim();
    if (reason.length < 10) return fail('Bitte eine Begründung angeben (mindestens 10 Zeichen).');
    a.decision = { decision: p.decision, reason, by: 'Behörde (nach Aktenlage)', at: now(), conditions: [] };
    if (p.decision === 'genehmigt') {
      pushEvent(a, 'termin_laeuft', 'Behörde', 'staff', 'Entscheidung nach Aktenlage: genehmigt', reason);
      if (staffGateNeeded(a)) { a.status = 'staff_pruefung'; pushEvent(a, 'staff_pruefung', 'Registerführung', 'system', 'Schlussprüfung durch die Registerführung'); } else registerEntity(a, 'Behörde');
    } else {
      a.status = 'abgelehnt'; a.objectionUntil = now() + R.objectionHours * HOUR; refund(a);
      pushEvent(a, 'abgelehnt', 'Behörde', 'staff', 'Entscheidung nach Aktenlage: abgelehnt', reason);
    }
    audit('Staff', 'staff', 'Entscheidung nach Aktenlage', a.caseNo, p.decision + ': ' + reason.slice(0, 50));
    if (mine(a)) notice('Entscheidung nach Aktenlage zu „' + a.name + '“: ' + L.DECISION[p.decision].label + '.', p.decision === 'genehmigt' ? 'ok' : 'bad');
    return ok();
  };
  H.staffCap = (p) => {
    const b = branchOf(p.key);
    if (!b) return fail('Branche nicht gefunden.');
    s.staff.capOverrides[p.key] = IC.clamp(Math.round(Number(p.value) || 0), 0, 99);
    audit('Staff', 'staff', 'Kapazität', b.label, String(s.staff.capOverrides[p.key]));
    return ok();
  };
  H.staffBlacklistAdd = (p) => {
    const term = String(p.term || '').trim();
    if (term.length < 3) return fail('Der Begriff braucht mindestens 3 Zeichen.');
    if (s.staff.blacklist.some((b) => IC.normName(b.term) === IC.normName(term))) return fail('Dieser Begriff ist bereits gesperrt.');
    s.staff.blacklist.push({ id: 'B-' + nextNo('black'), term, reason: String(p.reason || 'Staff').trim() || 'Staff' });
    audit('Staff', 'staff', 'Sperrliste', term, 'hinzugefügt');
    return ok();
  };
  H.staffBlacklistRemove = (p) => {
    const i = s.staff.blacklist.findIndex((b) => b.id === p.id);
    if (i < 0) return fail('Eintrag nicht gefunden.');
    audit('Staff', 'staff', 'Sperrliste', s.staff.blacklist[i].term, 'entfernt');
    s.staff.blacklist.splice(i, 1);
    return ok();
  };
  const SETTING_LABEL = {
    requireOfficials: 'Beamtenpflicht für Termine', writtenProcedure: 'Schriftliches Verfahren (Notfallregel)',
    undergroundViaPortal: 'Untergrund-Fraktionen über das Portal', fourEyes: 'Vier-Augen-Prinzip für Organisationen',
  };
  H.staffSetting = (p) => {
    if (!(p.key in s.staff.settings)) return fail('Unbekannte Einstellung.');
    s.staff.settings[p.key] = !!p.value;
    audit('Staff', 'staff', 'Einstellung', SETTING_LABEL[p.key] || p.key, p.value ? 'eingeschaltet' : 'ausgeschaltet');
    return ok();
  };

  /* ----- Nur Vorschau ----- */
  H.pvSetOfficials = (p) => { s.officialsOthers = IC.clamp(Math.round(p.n), 0, cfg.officials.length); return ok(); };
  H.pvSetRank = (p) => { s.meOfficial.rank = p.rank; return ok(); };
  H.pvAdvance = (p) => { IC.clock.offset += p.minutes * MIN; tick(); return ok(); };
  H.pvReset = () => { IC.clock.offset = 0; s = IC.mockSeed(); return ok(); };

  async function handle(name, data) {
    await delay();
    const fn = H[name];
    if (!fn) return fail('Unbekannte Aktion: ' + name);
    try { return fn(data || {}); } catch (err) { console.error(err); return fail('Interner Fehler: ' + err.message); }
  }

  IC.mock = { handle, state: () => s };
})();

/* js/app.js */
/* IC-Behördenportal · App-Hülle: Zustand, Rendering, Ereignisse, Vorschauleiste */
(function () {
  'use strict';
  const IC = window.IC;
  const { html, raw, ico } = IC;
  const L = IC.L;

  const S = (IC.S = {
    env: { nui: typeof window.GetParentResourceName === 'function' },
    app: 'gewerbeamt',
    nav: {},
    d: null,
    ui: {},
    busy: false,
    theme: null,
    open: true,
    guideOpen: IC.lsGet('ic.guide', '1') === '1',
    seenNotice: null,
    err: null,
  });
  IC.apps = {};
  IC.act = {};
  IC.partials = {};
  IC.registerApp = (key, def) => { IC.apps[key] = def; S.nav[key] = def.def; };

  const ORDER = [
    ['gewerbeamt', 'Gewerbeamt', 'building'],
    ['buergeramt', 'Bürgeramt', 'calendar'],
    ['beamte', 'Beamten-Tablet', 'stamp'],
    ['staff', 'Staff-Panel', 'shield'],
    ['konzept', 'Konzept', 'book'],
  ];

  /* ---------- Server-Aufrufe ---------- */
  IC.api = async function (name, data) {
    if (S.env.nui) {
      try {
        const res = await fetch('https://' + window.GetParentResourceName() + '/' + name, {
          method: 'POST', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body: JSON.stringify(data || {}),
        });
        return await res.json();
      } catch (err) { return { ok: false, error: 'Keine Verbindung zum Server.' }; }
    }
    return IC.mock.handle(name, data);
  };

  /* Aufruf mit Rückmeldung und anschließendem Neuladen */
  IC.run = async function (name, data, o) {
    o = o || {};
    S.busy = true;
    let r;
    try { r = await IC.api(name, data); } finally { S.busy = false; }
    if (!r || !r.ok) {
      IC.toast((r && r.error) || 'Das hat nicht geklappt.', 'bad');
      if (o.render) render();
      return r || { ok: false };
    }
    if (o.ok) IC.toast(typeof o.ok === 'function' ? o.ok(r) : o.ok, 'ok');
    if (!o.noReload) await IC.reload();
    return r;
  };

  IC.reload = async function () {
    const d = await IC.api('bootstrap', { app: S.app });
    if (d && d.ok) {
      S.d = d; S.err = null;
      /* Im Spiel gilt die Uhr des Servers, nicht die des Rechners: Fristen und "in 5 Minuten" stimmen dann überein. */
      if (S.env.nui && d.now) IC.clock.offset = d.now - Date.now();
      const ids = d.notices.map((n) => n.id);
      if (S.seenNotice == null) S.seenNotice = ids.length ? Math.max.apply(null, ids) : 0;
      d.notices.filter((n) => n.id > S.seenNotice).forEach((n) => {
        const away = S.app === 'beamte' || S.app === 'staff';
        IC.toast((away ? 'Benachrichtigung an ' + d.me.name + ': ' : '') + n.text, n.kind === 'ok' ? 'ok' : n.kind === 'bad' ? 'bad' : n.kind === 'warn' ? 'warn' : '');
        S.seenNotice = Math.max(S.seenNotice, n.id);
      });
    } else S.err = (d && d.error) || 'Keine Verbindung zum Server.';
    render();
  };

  /* Abgeschlossene Abläufe (Buchung, Gründung) zeigen beim erneuten Öffnen ein frisches Formular */
  function resetFinished(view) {
    if (view === 'book' && S.ui.book && S.ui.book.done) S.ui.book = null;
    if (view === 'wizard' && S.ui.wiz && S.ui.wiz.done) S.ui.wiz = null;
  }

  IC.go = async function (app, view) {
    IC.modal.close(true);
    const changed = app && app !== S.app;
    if (app) S.app = app;
    if (view) S.nav[S.app] = view;
    resetFinished(S.nav[S.app]);
    try { history.replaceState(null, '', '#' + S.app); } catch (e) { /* in Sandbox nicht möglich */ }
    if (changed) { S.d = null; render(); }
    await IC.reload();
  };
  IC.view = (view) => { resetFinished(view); S.nav[S.app] = view; render(); };

  IC.refresh = function () {
    Array.prototype.forEach.call(arguments, (name) => {
      const fn = IC.partials[name];
      if (!fn) return;
      document.querySelectorAll('[data-partial="' + name + '"]').forEach((el) => { el.innerHTML = String(fn()); });
    });
  };

  /* ---------- Theme ---------- */
  function effectiveTheme() {
    return document.documentElement.getAttribute('data-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  function applyTheme() { if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); }

  /* ---------- Vorschauleiste und Rundgang ---------- */
  function previewBar() {
    const d = S.d;
    const others = d ? d.duty.othersSetting : 1;
    const eff = effectiveTheme();
    const off = IC.clock.offset;
    return html`<header class="pv-bar"><div class="pv-in">
      <div class="pv-brand">${ico('building')}<span>IC-Behördenportal</span><span class="pv-tag">VORSCHAU</span></div>
      <nav class="pv-tabs" aria-label="Perspektive wählen">${ORDER.map((o) => html`<button class="pv-tab" data-act="go" data-app="${o[0]}" ${S.app === o[0] ? raw('aria-current="page"') : ''}>${ico(o[2])}${o[1]}</button>`)}</nav>
      <div class="pv-ctl">
        <label id="pv-others-l">Kollegen im Dienst</label>
        <div class="pv-step" role="group" aria-labelledby="pv-others-l">
          <button data-act="pv-others" data-n="-1" aria-label="Einen Beamten weniger" ${others <= 0 ? raw('disabled') : ''}>−</button>
          <output>${others}</output>
          <button data-act="pv-others" data-n="1" aria-label="Einen Beamten mehr" ${others >= 3 ? raw('disabled') : ''}>+</button>
        </div>
        <button class="pv-ico-btn" data-act="pv-advance" data-m="30" title="Simulierte Uhr um 30 Minuten vorstellen">${ico('clock')}+30 Min${off ? html` <span class="mono">(+${Math.round(off / IC.MIN)})</span>` : ''}</button>
        ${S.guideOpen ? '' : html`<button class="pv-ico-btn" data-act="pv-guide" title="Rundgang einblenden">${ico('list')}Rundgang</button>`}
        <button class="pv-ico-btn" data-act="pv-theme" title="Hell oder dunkel">${ico(eff === 'dark' ? 'sun' : 'moon')}${eff === 'dark' ? 'Hell' : 'Dunkel'}</button>
        <button class="pv-ico-btn" data-act="pv-reset" title="Demo-Daten zurücksetzen">${ico('refresh')}Zurücksetzen</button>
      </div>
    </div></header>`;
  }

  const GUIDE = [
    ['gewerbeamt', 'wizard', 'Antrag stellen', 'Als Gründerin Lena im Gewerbeamt einen Antrag in 6 Schritten ausfüllen und einreichen.'],
    ['beamte', 'reviews', 'Vorprüfung', 'Als Beamter in den Dienst gehen und den neuen Antrag in der Vorprüfung freigeben.'],
    ['buergeramt', 'book', 'Termin buchen', 'Im Bürgeramt einen Vorstellungstermin buchen. Mit 0 Kollegen im Dienst gibt es nur Sprechzeiten.'],
    ['buergeramt', 'appts', 'Einchecken', 'Zum Termin einchecken. Mit „+30 Min“ lässt sich die Uhr vorstellen, falls der Termin noch nicht begonnen hat.'],
    ['beamte', 'today', 'Vorstellen und entscheiden', 'Als Beamter aufrufen, Termin starten, Checkliste abarbeiten, entscheiden und stempeln.'],
    ['gewerbeamt', 'entities', 'Eintragung ansehen', 'Das neue Unternehmen erscheint mit Gewerbeschein unter „Meine Eintragungen“.'],
    ['staff', 'gate', 'Staff-Sicht', 'Schlussprüfung, Kapazitäten, Sperrliste und Eskalationen. Hier wartet bereits ein Antrag auf Freigabe.'],
  ];
  function guide() {
    if (!S.guideOpen) return '';
    const cur = GUIDE.findIndex((g) => g[0] === S.app && g[1] === S.nav[S.app]);
    const hint = cur >= 0 ? GUIDE[cur][3] : 'Die Schritte führen durch den kompletten Ablauf. Jeder Schritt springt in die passende Ansicht.';
    return html`<div class="pv-guide"><section class="guide" aria-label="Rundgang durch den Ablauf">
      <div class="guide-steps"><span class="guide-lab">Rundgang</span>${GUIDE.map((g, i) => html`<button class="gstep" data-act="go" data-app="${g[0]}" data-view="${g[1]}" ${cur === i ? raw('aria-current="step"') : ''}><span class="gn">${i + 1}</span>${g[2]}</button>`)}<button class="btn ghost sm" style="margin-left:auto" data-act="pv-guide" aria-label="Rundgang ausblenden">${ico('x')}</button></div>
      <p class="guide-hint">${ico('info')}<span>${hint}</span></p>
    </section></div>`;
  }

  /* ---------- Hülle ---------- */
  function whoChip() {
    const d = S.d;
    if (!d) return '';
    if (S.app === 'gewerbeamt' || S.app === 'buergeramt') return html`<span class="who">${ico('user')}${d.me.name}${S.app === 'gewerbeamt' ? html` · ${IC.money(d.me.bank)}` : ''}</span>`;
    if (S.app === 'beamte' && d.official) return html`<span class="who">${ico('badge')}${d.official.name} · ${L.RANK[d.official.rank].label}</span>`;
    if (S.app === 'staff') return html`<span class="who">${ico('shield')}Staff · OOC</span>`;
    return '';
  }

  function shell() {
    const A = IC.apps[S.app];
    const nui = S.env.nui;
    const view = S.nav[S.app];
    let nav = [], body;
    if (S.err) body = IC.c.callout('bad', 'Verbindung gestört', S.err);
    else if (S.app === 'konzept') { nav = A.nav(); body = A.views[view](); }
    else if (!S.d) body = html`<div class="empty">${ico('clock')}<h3>Verbindung zum Amtsserver …</h3></div>`;
    else { nav = A.nav(); body = A.views[view] ? A.views[view]() : ''; }
    return html`
      ${nui ? '' : previewBar()}
      ${nui ? '' : guide()}
      <main class="stage">
        <div class="win" role="application" aria-label="${A.title}">
          <div class="win-title">${ico(A.icon)}<span>${A.title}</span><span class="where">${S.d ? A.where() : ''}</span><span class="sp"></span>${whoChip()}<span class="clock">${IC.ftime(IC.now())}</span>${nui ? html`<button class="x" data-act="nui-close" aria-label="Schließen">${ico('x')}</button>` : ''}</div>
          <div class="win-body">
            <nav class="rail" aria-label="Bereiche">
              ${nav.map((n) => n.head ? html`<h4>${n.head}</h4>` : html`<button class="rail-item" data-act="view" data-view="${n.id}" ${view === n.id ? raw('aria-current="page"') : ''}>${ico(n.icon)}<span>${n.label}</span>${n.badge ? IC.c.badge(n.badge, n.badgeKind) : ''}</button>`)}
              ${A.railFoot && S.d ? html`<div class="rail-foot">${A.railFoot()}</div>` : ''}
            </nav>
            <div class="main" id="main">${body}</div>
          </div>
        </div>
      </main>`;
  }

  let lastKey = '';
  function render() {
    const root = document.getElementById('root');
    if (S.env.nui && !S.open) { root.innerHTML = ''; return; }
    const main = document.getElementById('main');
    const mt = main ? main.scrollTop : 0;
    const wy = window.scrollY;
    const key = S.app + ':' + S.nav[S.app];
    const active = document.activeElement;
    const focusId = active && active.id && root.contains(active) ? active.id : null;
    const sel = focusId && active.selectionStart != null ? [active.selectionStart, active.selectionEnd] : null;
    root.innerHTML = String(shell());
    if (key === lastKey) {
      const m = document.getElementById('main');
      if (m) m.scrollTop = mt;
      window.scrollTo(0, wy);
    } else {
      const st = document.querySelector('.stage');
      if (st && window.scrollY > st.offsetTop - 70) window.scrollTo(0, Math.max(0, st.offsetTop - 70));
    }
    lastKey = key;
    const cb = IC.afterQueue; IC.afterQueue = [];
    cb.forEach((fn) => { try { fn(); } catch (err) { console.error(err); } });
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* Typ ohne Auswahl */ } }
    }
  }
  IC.render = render;
  IC.afterQueue = [];
  IC.after = (fn) => { IC.afterQueue.push(fn); };

  /* ---------- Gemeinsame Aktionen ---------- */
  Object.assign(IC.act, {
    go: (el) => IC.go(el.dataset.app, el.dataset.view),
    view: (el) => IC.view(el.dataset.view),
    'modal-close': () => IC.modal.close(),
    'modal-yes': () => IC.modal.yes(),
    'nui-close': () => IC.api('close', {}),
    'pv-others': async (el) => {
      const cur = S.d ? S.d.duty.othersSetting : 1;
      await IC.api('pvSetOfficials', { n: cur + Number(el.dataset.n) });
      await IC.reload();
    },
    'pv-advance': async (el) => {
      await IC.api('pvAdvance', { minutes: Number(el.dataset.m) });
      IC.toast('Uhr um ' + el.dataset.m + ' Minuten vorgestellt: ' + IC.ftime(IC.now()) + ' Uhr.', '');
      await IC.reload();
    },
    'pv-guide': () => { S.guideOpen = !S.guideOpen; IC.lsSet('ic.guide', S.guideOpen ? '1' : '0'); render(); },
    'pv-theme': () => {
      S.theme = effectiveTheme() === 'dark' ? 'light' : 'dark';
      IC.lsSet('ic.theme', S.theme);
      applyTheme();
      render();
    },
    'pv-reset': async () => {
      await IC.api('pvReset', {});
      S.ui = {}; S.seenNotice = null;
      IC.toast('Demo-Daten zurückgesetzt.', 'ok');
      await IC.reload();
    },
  });

  /* ---------- Ereignisse ---------- */
  document.addEventListener('click', (e) => {
    if (e.target && e.target.id === 'modal-ov') { IC.modal.close(); return; }
    const el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
    const fn = IC.act[el.dataset.act];
    if (!fn || S.busy) return;
    if (el.tagName !== 'INPUT') e.preventDefault();
    Promise.resolve(fn(el, e)).catch((err) => { console.error(err); IC.toast('Unerwarteter Fehler: ' + err.message, 'bad'); S.busy = false; });
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    const path = el.dataset && el.dataset.bind;
    if (!path) return;
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'number') v = el.value === '' ? '' : Number(el.value);
    else v = el.value;
    IC.setPath(S, path, v);
    const after = el.dataset.after;
    if (after && IC.act[after]) IC.act[after](el, e);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (IC.modal.cur) { e.preventDefault(); IC.modal.close(); }
      else if (S.env.nui && S.open) IC.api('close', {});
    }
  });
  window.addEventListener('hashchange', () => {
    const h = location.hash.replace('#', '');
    if (IC.apps[h] && h !== S.app) IC.go(h);
  });
  window.addEventListener('message', (e) => {
    const m = e.data || {};
    if (m.action === 'open') {
      S.open = true; S.app = IC.apps[m.app] ? m.app : 'gewerbeamt';
      if (m.view) S.nav[S.app] = m.view;
      S.d = null; render(); IC.reload();
    } else if (m.action === 'close') { S.open = false; IC.modal.close(true); render(); }
    else if (m.action === 'notify') IC.toast(m.text, m.kind);
    else if (m.action === 'refresh' && S.open) IC.reload();
  });

  /* ---------- Start ---------- */
  IC.boot = async function () {
    document.documentElement.classList.toggle('nui', S.env.nui);
    const saved = IC.lsGet('ic.theme', null);
    if (saved === 'light' || saved === 'dark') { S.theme = saved; applyTheme(); }
    if (S.env.nui) { S.open = false; render(); return; }
    const h = location.hash.replace('#', '');
    if (IC.apps[h]) S.app = h;
    render();
    await IC.reload();
  };
})();

/* js/view-gewerbe.js */
/* IC-Behördenportal · Gewerbeamt (Sicht der Bürger) */
(function () {
  'use strict';
  const IC = window.IC;
  const { html, raw, ico, money } = IC;
  const c = IC.c, L = IC.L, S = IC.S;
  const cfg = () => S.d.config;
  const formOf = (k) => cfg().legalForms.find((f) => f.key === k);
  const branchOf = (k) => cfg().branches.find((b) => b.key === k);
  const sel = (cond) => (cond ? raw('selected') : '');
  const pressed = (cond) => raw('aria-pressed="' + (cond ? 'true' : 'false') + '"');

  /* ====================================================================
     Start
     ==================================================================== */
  function tile(icon, title, desc, attrs, badge) {
    return html`<button class="tile" ${raw(attrs)}>${badge ? IC.c.badge(badge, 'warn') : ''}<span class="tile-ico">${ico(icon, 'lg')}</span><h3>${title}</h3><p>${desc}</p></button>`;
  }

  function nextStep(a) {
    const st = a.status;
    if (st === 'entwurf') return { text: 'Der Entwurf ist noch nicht eingereicht.', act: html`<button class="btn sm primary" data-act="wiz-edit" data-id="${a.id}">Fortsetzen</button>` };
    if (st === 'eingereicht') return { text: 'Wartet auf die Vorprüfung durch die Beamten (Ziel: 48 Stunden).', act: '' };
    if (st === 'nachbesserung') return { text: a.remark || 'Bitte den Antrag überarbeiten.', act: html`<button class="btn sm primary" data-act="wiz-edit" data-id="${a.id}">Antrag bearbeiten</button>` };
    if (st === 'vorpruefung_ok') return { text: 'Buchen Sie jetzt Ihren Vorstellungstermin im Bürgeramt.', act: html`<button class="btn sm primary" data-act="app-book" data-id="${a.id}">Termin buchen</button>` };
    if (st === 'termin_gebucht') {
      const ap = S.d.myAppointments.find((x) => x.applicationId === a.id && ['gebucht', 'eingecheckt', 'aufgerufen'].indexOf(x.status) !== -1);
      return { text: ap ? 'Vorstellungstermin am ' + IC.fday(ap.start) + ' um ' + IC.ftime(ap.start) + ' Uhr.' : 'Termin gebucht.', act: html`<button class="btn sm" data-act="go" data-app="buergeramt" data-view="appts">Meine Termine</button>` };
    }
    if (st === 'termin_laeuft') return { text: 'Die Vorstellung läuft gerade.', act: '' };
    if (st === 'staff_pruefung') return { text: 'Genehmigt. Die Registerführung führt die Schlussprüfung durch.', act: '' };
    if (st === 'einspruch') return { text: 'Der Einspruch wird geprüft. Eine Einspruchsverhandlung kann gebucht werden.', act: html`<button class="btn sm primary" data-act="app-book" data-id="${a.id}">Verhandlung buchen</button>` };
    if (st === 'abgelehnt') return { text: a.decision ? a.decision.reason : 'Abgelehnt.', act: a.objectionUntil > IC.now() ? html`<button class="btn sm" data-act="app-open" data-id="${a.id}">Einspruch möglich</button>` : '' };
    return { text: '', act: '' };
  }

  function home() {
    const d = S.d;
    const open = d.myApplications.filter((a) => L.OPEN_APP.indexOf(a.status) !== -1 || a.status === 'entwurf');
    const legacy = d.myEntities.filter((e) => e.legacy && !e.legacyConfirmed && e.status !== 'aufgeloest');
    const needs = d.myApplications.filter((a) => a.status === 'nachbesserung' || a.status === 'vorpruefung_ok').length;
    const el = d.eligibility.unternehmen;
    return html`
      <div class="page-head">
        <div><div class="crumbs">Gewerbeamt · Start</div><h1>Willkommen, ${d.me.name}</h1>
          <p class="sub">Gründung, Änderung und Auflösung von Unternehmen und Organisationen. Alles an einem Ort. Die Entscheidung treffen die Beamten im persönlichen Termin.</p></div>
        <div class="duty ${d.duty.count ? 'on' : 'off'}"><span class="big">${String(d.duty.count).padStart(2, '0')}</span><div><div class="strong">Beamte im Dienst</div><div class="small muted">${d.duty.count ? 'Live-Termine sind buchbar' : 'Termine nur in Sprechzeiten'}</div></div></div>
      </div>
      ${legacy.map((e) => c.callout('warn', 'Bestandsbestätigung offen: ' + e.name,
        'Ihr Eintrag wurde aus dem alten System übernommen. Bitte bestätigen Sie Ihre Daten kostenlos bis zum ' + IC.fdate(e.legacyDue) + '. Der Eintrag ist bis dahin nicht gefährdet.', 'shield',
        html`<button class="btn sm primary" data-act="legacy-confirm" data-id="${e.id}">Jetzt bestätigen</button><button class="btn sm" data-act="ent-cert" data-id="${e.id}">Gewerbeschein ansehen</button>`))}
      <div class="grid g3">
        ${tile('building', 'Unternehmen gründen', 'Gewerbe anmelden: Einzelunternehmen, GbR oder GmbH.', 'data-act="wiz-start" data-kind="unternehmen"')}
        ${tile('flag', 'Fraktion oder Organisation gründen', 'Verein, Interessengemeinschaft, Partei, Verband oder Stiftung.', 'data-act="wiz-start" data-kind="fraktion"')}
        ${tile('doc', 'Meine Anträge', 'Status, Hinweise der Beamten, Einspruch.', 'data-act="view" data-view="apps"', needs || null)}
        ${tile('folder', 'Meine Eintragungen', 'Gewerbeschein, Änderungen, Auflagen, Auflösung.', 'data-act="view" data-view="entities"')}
        ${tile('calendar', 'Termin im Bürgeramt', 'Vorstellungstermin buchen, einchecken, Wartenummer ziehen.', 'data-act="go" data-app="buergeramt" data-view="book"')}
        ${tile('search', 'Handelsregister', 'Unternehmen und Organisationen öffentlich nachschlagen.', 'data-act="view" data-view="register"')}
      </div>
      <div class="split">
        <div class="stack">
          ${c.sheet('Ihre laufenden Vorgänge', open.length ? html`<div class="stack sm">${open.map((a) => {
            const n = nextStep(a);
            return html`<div class="person" style="grid-template-columns:minmax(0,1fr) auto">
              <div class="grow"><div class="row sm"><span class="pn">${a.name || 'Entwurf ohne Namen'}</span>${a.caseNo ? c.tag(a.caseNo) : ''}${c.appChip(a.status)}</div>
              <div class="pm" style="margin-top:4px">${n.text}</div></div><div class="btn-row">${n.act}<button class="btn sm ghost" data-act="app-open" data-id="${a.id}">Details</button></div></div>`;
          })}</div>` : c.empty('doc', 'Keine laufenden Vorgänge', 'Starten Sie eine Gründung, um hier den Fortschritt zu verfolgen.'), { icon: 'doc', flush: false })}
        </div>
        <aside class="stack">
          ${c.sheet('Ihre Voraussetzungen', html`<ul class="checklist">${el.checks.map((k) => html`<li><label style="cursor:default"><span class="chip ${k.ok ? 'ok' : 'bad'}" style="margin-top:1px">${ico(k.ok ? 'check' : 'x')}</span><span>${k.text}</span></label></li>`)}</ul>`, { icon: 'shield' })}
        </aside>
      </div>`;
  }

  /* ====================================================================
     Gründungs-Wizard
     ==================================================================== */
  const STEPS = {
    unternehmen: ['Art und Branche', 'Rechtsform und Name', 'Gründer und Anteile', 'Standort', 'Konzept', 'Prüfen und bezahlen'],
    fraktion: ['Art der Organisation', 'Name', 'Gründungsmitglieder', 'Sitz', 'Zweck und Satzung', 'Prüfen und bezahlen'],
  };

  function newWiz(kind) {
    const me = S.d.me;
    return {
      step: 0, maxStep: 0, kind: kind || null, legalForm: null, branch: null, name: '', nameResult: null, nameFor: null,
      founders: [{ charId: me.charId, name: me.name, role: kind === 'fraktion' ? 'vorsitz' : 'inhaber', share: kind === 'fraktion' ? null : 100, consent: 'self' }],
      property: { mode: null, id: null, label: '' },
      concept: { idea: '', audience: '', offer: '', staff: '', hours: '' },
      statute: { purpose: '', goals: '', admission: '' },
      ooc: { category: 'legal', note: '', members: '' },
      confirm: false, id: null, done: null, errors: [], resubmit: false,
    };
  }
  const W = () => S.ui.wiz || (S.ui.wiz = newWiz(null));

  function fees(w) {
    const f = formOf(w.legalForm);
    if (!f) return null;
    const b = w.branch ? branchOf(w.branch) : null;
    const k = b ? b.factor : 1;
    const apply = Math.round(f.feeApply * k), register = Math.round(f.feeRegister * k);
    return { apply, register, capital: f.capital, payNow: apply + register + f.capital, refundable: register + f.capital };
  }

  function rawName(name, form) {
    const suf = form && form.suffix;
    if (suf && name.toLowerCase().endsWith(' ' + suf.toLowerCase())) return name.slice(0, name.length - suf.length - 1);
    return name;
  }

  function issues(w, step) {
    const out = [];
    const f = formOf(w.legalForm);
    const b = w.branch ? branchOf(w.branch) : null;
    if (step === 0) {
      if (!w.kind) out.push('Bitte wählen, was Sie gründen möchten.');
      else if (w.kind === 'unternehmen') {
        if (!b) out.push('Bitte eine Branche wählen.');
        else if (b.used >= b.cap && !w.resubmit) out.push('In der Branche „' + b.label + '“ sind alle Plätze vergeben.');
      } else if (!f) out.push('Bitte die Art der Organisation wählen.');
    }
    if (step === 1) {
      if (w.kind === 'unternehmen' && !f) out.push('Bitte eine Rechtsform wählen.');
      const key = w.name.trim() + '|' + w.legalForm;
      if (w.name.trim().length < 3) out.push('Bitte einen Namen eingeben (mindestens 3 Zeichen).');
      else if (w.nameFor !== key || !w.nameResult) out.push('Der Name wird geprüft …');
      else if (!w.nameResult.ok) out.push(w.nameResult.issues.filter((i) => i.level === 'error')[0].text);
    }
    if (step === 2 && f) {
      if (w.founders.length < f.minFounders) out.push('Mindestens ' + f.minFounders + ' ' + (w.kind === 'fraktion' ? 'Gründungsmitglieder' : 'Gründer') + ' erforderlich (aktuell ' + w.founders.length + ').');
      if (w.kind === 'unternehmen') {
        const sum = w.founders.reduce((n, x) => n + (Number(x.share) || 0), 0);
        if (sum !== 100) out.push('Die Anteile müssen zusammen 100 % ergeben (aktuell ' + sum + ' %).');
        if (w.founders.some((x) => !(Number(x.share) > 0))) out.push('Jeder Gesellschafter braucht einen Anteil über 0 %.');
      } else if (w.founders.filter((x) => x.role === 'vorsitz').length !== 1) out.push('Es muss genau einen Vorsitz geben.');
      if (w.founders.some((x) => x.consent === 'pending')) out.push('Es fehlt noch die Zustimmung von Mitgründern.');
    }
    if (step === 3) {
      const need = b && b.needsProperty;
      if (need && !(w.property.mode === 'immobilie' && w.property.id)) out.push('Diese Branche verlangt einen festen Standort.');
      else if (!w.property.mode) out.push('Bitte einen Standort wählen oder „ohne festen Standort“ angeben.');
      else if (w.property.mode === 'immobilie' && !w.property.id) out.push('Bitte eine Immobilie auswählen.');
    }
    if (step === 4) {
      if (w.kind === 'unternehmen' && w.concept.idea.trim().length < 80) out.push('Bitte die Geschäftsidee beschreiben (mindestens 80 Zeichen, aktuell ' + w.concept.idea.trim().length + ').');
      if (w.kind === 'fraktion' && w.statute.purpose.trim().length < 80) out.push('Bitte den Zweck beschreiben (mindestens 80 Zeichen, aktuell ' + w.statute.purpose.trim().length + ').');
    }
    if (step === 5) {
      const el = S.d.eligibility[w.kind || 'unternehmen'];
      el.checks.filter((k) => !k.ok).forEach((k) => out.push('Voraussetzung nicht erfüllt: ' + k.text));
      const fe = fees(w);
      if (fe && !w.resubmit && fe.payNow > S.d.me.bank) out.push('Der Kontostand reicht nicht aus (benötigt ' + money(fe.payNow) + ').');
      if (!w.confirm) out.push('Bitte die Richtigkeit der Angaben bestätigen.');
    }
    return out;
  }
  const allIssues = (w) => [0, 1, 2, 3, 4].reduce((n, i) => n.concat(issues(w, i)), []);

  function draftOf(w) {
    return {
      id: w.id, kind: w.kind, legalForm: w.legalForm, branch: w.kind === 'unternehmen' ? w.branch : null, name: w.name.trim(),
      founders: IC.clone(w.founders), property: IC.clone(w.property), concept: IC.clone(w.concept), statute: IC.clone(w.statute), ooc: w.kind === 'fraktion' ? IC.clone(w.ooc) : null,
    };
  }

  /* ----- Teilansichten (werden ohne Neuaufbau der Seite aktualisiert) ----- */
  IC.partials['wiz-name'] = function () {
    const w = W();
    const key = w.name.trim() + '|' + w.legalForm;
    if (w.name.trim().length < 3) return html`<div class="hint">Mindestens 3, höchstens 40 Zeichen. Der Rechtsformzusatz wird automatisch ergänzt.</div>`;
    if (w.nameFor !== key || !w.nameResult) return html`<div class="hint">${ico('clock')} Name wird geprüft …</div>`;
    const r = w.nameResult;
    return html`${r.ok ? c.msg('ok', 'Der Name ist frei. Eintrag im Register als: ' + r.display) : ''}${r.issues.map((i) => c.msg(i.level === 'error' ? 'bad' : 'warn', i.text))}`;
  };

  IC.partials['wiz-c1'] = function () {
    const w = W();
    return c.counter((w.kind === 'fraktion' ? w.statute.purpose : w.concept.idea).trim().length, 80);
  };

  IC.partials['wiz-side'] = function () {
    const w = W();
    const f = formOf(w.legalForm), b = w.branch ? branchOf(w.branch) : null, fe = fees(w);
    const labels = STEPS[w.kind || 'unternehmen'];
    return html`<div class="stack">
      ${c.sheet('Ihr Antrag', html`${c.kv([
        ['Art', w.kind === 'unternehmen' ? 'Unternehmen' : w.kind === 'fraktion' ? 'Organisation' : '–'],
        w.kind === 'unternehmen' ? ['Branche', b ? b.label : '–'] : null,
        [w.kind === 'fraktion' ? 'Organisationsart' : 'Rechtsform', f ? f.label : '–'],
        ['Name', w.nameResult && w.nameResult.ok && w.nameFor === w.name.trim() + '|' + w.legalForm ? w.nameResult.display : (w.name.trim() || '–')],
        ['Gründer', w.founders.length],
        ['Standort', w.property.mode === 'immobilie' ? w.property.label : w.property.mode === 'mobil' ? 'Ohne festen Standort' : '–'],
      ])}`, { icon: 'doc' })}
      ${c.sheet('Gebühren', fe ? html`
        <div class="sum-row"><span>Antragsgebühr <span class="xs muted">(nicht erstattbar)</span></span><span class="v">${money(w.resubmit ? 0 : fe.apply)}</span></div>
        <div class="sum-row"><span>Eintragungsgebühr <span class="xs muted">(erstattbar)</span></span><span class="v">${money(w.resubmit ? 0 : fe.register)}</span></div>
        ${fe.capital ? html`<div class="sum-row"><span>Kapital in Verwahrung <span class="xs muted">(erstattbar)</span></span><span class="v">${money(w.resubmit ? 0 : fe.capital)}</span></div>` : ''}
        <div class="sum-row total"><span>Jetzt fällig</span><span class="v">${money(w.resubmit ? 0 : fe.payNow)}</span></div>
        <div class="xs muted" style="margin-top:6px">Kontostand: ${money(S.d.me.bank)}${w.resubmit ? '. Gebühren wurden bereits gezahlt.' : ''}</div>` : html`<p class="small muted">Wählen Sie eine Rechtsform, um die Gebühren zu sehen.</p>`, { icon: 'coin' })}
      ${c.sheet('Fortschritt', html`<ul class="checklist">${labels.map((l, i) => {
        const bad = i < 5 ? issues(w, i).length : 0;
        const ok = i < 5 ? !bad && i <= w.maxStep : false;
        return html`<li><label style="cursor:default;padding:7px 4px"><span class="chip ${ok ? 'ok' : i === w.step ? 'info' : ''}">${i === 5 ? ico('check') : ok ? ico('check') : i + 1}</span><span class="${i === w.step ? 'strong' : ''}">${l}</span></label></li>`;
      })}</ul>`, { icon: 'list' })}
    </div>`;
  };

  IC.partials['wiz-nav'] = function () {
    const w = W();
    const iss = issues(w, w.step);
    const last = w.step === 5;
    return html`${iss.length ? html`<div class="callout warn" role="alert">${ico('alert')}<div><div class="t">Das fehlt noch</div><ul>${iss.map((i) => html`<li>${i}</li>`)}</ul></div></div>` : ''}
      ${w.errors.length ? html`<div class="callout bad" role="alert">${ico('alert')}<div><div class="t">Der Antrag wurde vom Amt abgelehnt, bitte prüfen</div><ul>${w.errors.map((e) => html`<li>${e.text}</li>`)}</ul></div></div>` : ''}
      <div class="spread">
        <div class="btn-row">${w.step > 0 ? html`<button class="btn" data-act="wiz-prev">${ico('back')}Zurück</button>` : ''}<button class="btn ghost" data-act="wiz-save">Entwurf speichern</button></div>
        <div class="btn-row">${last
          ? html`<button class="btn primary lg" data-act="wiz-submit" ${iss.length ? raw('disabled') : ''}>${ico('stamp')}Verbindlich einreichen</button>`
          : html`<button class="btn primary" data-act="wiz-next" ${iss.length ? raw('disabled') : ''}>Weiter${ico('arrow')}</button>`}</div>
      </div>`;
  };

  IC.partials['wiz-share'] = function () {
    const w = W();
    const sum = w.founders.reduce((n, x) => n + (Number(x.share) || 0), 0);
    return html`<span class="chip ${sum === 100 ? 'ok' : 'warn'}">Summe ${sum} %</span>`;
  };

  IC.partials['wiz-founders'] = function () {
    const w = W();
    const org = w.kind === 'fraktion';
    const roles = org ? cfg().orgRoles : cfg().companyRoles;
    const f = formOf(w.legalForm);
    const single = f && f.key === 'einzel';
    return html`<div class="stack sm">${w.founders.map((fd, i) => {
      const isMe = fd.consent === 'self';
      const cons = isMe ? c.chip('Sie', 'info') : fd.consent === 'ok' ? c.chip('Zugestimmt', 'ok', 'check') : c.chip('Zustimmung ausstehend', 'warn', 'clock');
      return html`<div class="person" style="grid-template-columns:36px minmax(0,1fr) auto">
        ${c.avatar(fd.name)}
        <div class="grow"><div class="pn">${fd.name}</div><div class="pm">${cons}</div></div>
        <div class="row sm">
          <select id="wf-role-${i}" style="width:auto;min-width:160px" data-bind="ui.wiz.founders.${i}.role" data-after="wiz-light" aria-label="Rolle von ${fd.name}">${(single ? ['inhaber'] : roles).map((r) => html`<option value="${r}" ${sel(fd.role === r)}>${L.MEMBER_ROLE[r]}</option>`)}</select>
          ${org ? '' : html`<div class="input-suffix share"><input id="wf-share-${i}" type="number" min="1" max="100" value="${fd.share}" data-bind="ui.wiz.founders.${i}.share" data-after="wiz-light" aria-label="Anteil von ${fd.name} in Prozent"><span>%</span></div>`}
          ${isMe ? '' : html`<button class="btn sm danger" data-act="wiz-remove-founder" data-idx="${i}" aria-label="${fd.name} entfernen">${ico('x')}</button>`}
        </div></div>`;
    })}</div>`;
  };

  /* ----- Schritte ----- */
  function stepArt(w) {
    const d = S.d;
    return html`
      <div class="grid g2">
        <button class="pick pick-big" data-act="wiz-kind" data-kind="unternehmen" ${pressed(w.kind === 'unternehmen')}><span class="pk-t">${ico('building', 'lg')}Unternehmen</span><span class="pk-d">Ein Gewerbe mit Gewinnabsicht: Laden, Gastronomie, Werkstatt, Dienstleistung.</span></button>
        <button class="pick pick-big" data-act="wiz-kind" data-kind="fraktion" ${pressed(w.kind === 'fraktion')}><span class="pk-t">${ico('flag', 'lg')}Fraktion oder Organisation</span><span class="pk-d">Verein, Interessengemeinschaft, Partei, Verband oder Stiftung.</span></button>
      </div>
      ${w.kind === 'unternehmen' ? html`<div class="stack sm"><h4>Branche</h4>
        <div class="grid g-auto">${d.config.branches.map((b) => {
          const full = b.used >= b.cap && !w.resubmit;
          return html`<button class="pick" data-act="wiz-branch" data-key="${b.key}" ${pressed(w.branch === b.key)} ${full ? raw('disabled') : ''}>
            <span class="pk-t">${b.label}</span><span class="pk-d">${b.desc}</span>
            <span class="pk-m">${b.needsProperty ? c.chip('Standort nötig', '', 'pin') : ''}${b.authority ? c.chip('Zulassung: ' + b.authority, 'warn', 'badge') : ''}${b.staffGate ? c.chip('Schlussprüfung', 'info', 'shield') : ''}${b.factor > 1 ? c.chip('Gebühr ×' + String(b.factor).replace('.', ','), '') : ''}</span>
            ${c.meter(b.used, b.cap)}<span class="xs muted">${full ? 'Keine Plätze frei' : (b.cap - b.used) + ' von ' + b.cap + ' Plätzen frei'}</span></button>`;
        })}</div></div>` : ''}
      ${w.kind === 'fraktion' ? html`<div class="stack sm"><h4>Art der Organisation</h4>
        <div class="grid g-auto">${d.config.legalForms.filter((f) => f.kind === 'fraktion').map((f) => html`<button class="pick" data-act="wiz-form" data-key="${f.key}" ${pressed(w.legalForm === f.key)}>
          <span class="pk-t">${f.label}</span><span class="pk-d">${f.desc}</span>
          <span class="pk-m">${c.chip('mind. ' + f.minFounders + ' Gründer', '', 'users')}${c.chip(money(f.feeApply + f.feeRegister), '', 'coin')}${f.capital ? c.chip(money(f.capital) + ' Kapital', 'warn') : ''}</span></button>`)}</div></div>` : ''}`;
  }

  function stepName(w) {
    const d = S.d;
    const f = formOf(w.legalForm);
    return html`
      ${w.kind === 'unternehmen' ? html`<div class="stack sm"><h4>Rechtsform</h4><div class="grid g3">${d.config.legalForms.filter((x) => x.kind === 'unternehmen').map((x) => html`<button class="pick" data-act="wiz-form" data-key="${x.key}" ${pressed(w.legalForm === x.key)}>
        <span class="pk-t">${x.label}</span><span class="pk-d">${x.desc}</span>
        <span class="pk-m">${c.chip('mind. ' + x.minFounders + ' Gründer', '', 'users')}${c.chip(money(x.feeApply + x.feeRegister) + ' Gebühren', '', 'coin')}${x.capital ? c.chip(money(x.capital) + ' Kapital', 'warn') : ''}</span></button>`)}</div></div>` : ''}
      <div class="stack sm">
        ${c.field('wiz-name', 'Name' + (f && f.suffix ? ' (ohne „' + f.suffix + '“)' : ''), html`<input id="wiz-name" type="text" maxlength="40" autocomplete="off" placeholder="${w.kind === 'fraktion' ? 'z. B. Motorradfreunde Sandy Shores' : 'z. B. Hafenbar Santa Maria'}" value="${w.name}" data-bind="ui.wiz.name" data-after="wiz-name-input">`, { req: true })}
        <div data-partial="wiz-name">${IC.partials['wiz-name']()}</div>
      </div>
      ${c.callout('info', 'Namensrecht', html`Namen müssen eindeutig sein. Ähnliche Namen, reservierte Begriffe (zum Beispiel Behörden) und Beleidigendes sind nicht zulässig. Während Ihres Antrags ist der Name ${IC.S.d.config.rules.nameReserveDays} Tage für Sie reserviert.`)}`;
  }

  function stepFounders(w) {
    const d = S.d;
    const f = formOf(w.legalForm);
    const org = w.kind === 'fraktion';
    const canAdd = f && f.key !== 'einzel';
    const avail = d.nearby.filter((p) => !w.founders.some((x) => x.charId === p.charId));
    return html`
      <div class="stack sm">
        <div class="spread"><h4>${org ? 'Gründungsmitglieder' : 'Gründer und Gesellschafter'}</h4>${org ? '' : html`<div class="row sm"><span data-partial="wiz-share">${IC.partials['wiz-share']()}</span><button class="btn sm" data-act="wiz-even">Anteile gleichmäßig</button></div>`}</div>
        <div data-partial="wiz-founders">${IC.partials['wiz-founders']()}</div>
      </div>
      ${canAdd ? html`<div class="stack sm"><h4>Personen in Ihrer Nähe</h4>
        <p class="small muted">Mitgründer erhalten eine Einladung und müssen zustimmen. Erst dann lässt sich der Antrag einreichen.</p>
        ${avail.length ? html`<div class="stack sm">${avail.map((p) => html`<div class="person">${c.avatar(p.name)}<div class="grow"><div class="pn">${p.name}</div>
          <div class="pm">${p.elig.ok ? html`${p.age} Jahre · ${p.playHours} Std. Spielzeit` : html`<span style="color:var(--bad)">${p.elig.checks.filter((k) => !k.ok).map((k) => k.text).join('; ')}</span>`}</div></div>
          <button class="btn sm" data-act="wiz-add-founder" data-id="${p.charId}" ${p.elig.ok ? '' : raw('disabled')}>${ico('plus')}Einladen</button></div>`)}</div>` : html`<p class="small muted">Niemand mehr in der Nähe.</p>`}</div>`
        : html`<div class="callout info">${ico('info')}<div>Ein Einzelunternehmen hat genau einen Inhaber. Wählen Sie eine GbR oder GmbH, um Mitgründer aufzunehmen.</div></div>`}`;
  }

  function stepSite(w) {
    const d = S.d;
    const b = w.branch ? branchOf(w.branch) : null;
    const need = b && b.needsProperty;
    const org = w.kind === 'fraktion';
    return html`
      <div class="grid g2">
        <button class="pick" data-act="wiz-site-mode" data-mode="immobilie" ${pressed(w.property.mode === 'immobilie')}><span class="pk-t">${ico('pin')}Feste Immobilie</span><span class="pk-d">Ein Standort aus dem Gewerbeverzeichnis.</span></button>
        <button class="pick" data-act="wiz-site-mode" data-mode="mobil" ${pressed(w.property.mode === 'mobil')} ${need ? raw('disabled') : ''}><span class="pk-t">${ico('tool')}${org ? 'Ohne festen Sitz' : 'Mobil, ohne festen Standort'}</span><span class="pk-d">${need ? 'Für diese Branche nicht zulässig.' : 'Zum Beispiel Lieferdienst, Handwerk oder Taxi.'}</span></button>
      </div>
      ${w.property.mode === 'immobilie' ? html`<div class="stack sm"><h4>Gewerbeverzeichnis</h4><div class="grid g-auto">${d.properties.map((p) => {
        const mine = w.property.id === p.id;
        return html`<button class="pick" data-act="wiz-prop" data-id="${p.id}" ${pressed(mine)} ${p.taken && !mine ? raw('disabled') : ''}>
          <span class="pk-t">${p.label}</span><span class="pk-d">${p.district}${p.note ? ' · ' + p.note : ''}</span>
          <span class="pk-m">${c.chip('Größe ' + p.size, '')}${c.chip(money(p.rent) + ' Miete', '', 'coin')}${p.taken && !mine ? c.chip(p.status === 'frei' ? 'Reserviert' : 'Vermietet', 'bad') : c.chip('Frei', 'ok')}</span></button>`;
      })}</div><p class="small muted">Den Mietvertrag schließen Sie nach der Eintragung beim Immobilienmakler. Die Beamten fragen im Termin danach.</p></div>` : ''}`;
  }

  function stepConcept(w) {
    if (w.kind === 'fraktion') {
      const s = w.statute;
      return html`<div class="stack">
        ${c.field('wiz-purpose', 'Zweck der Organisation', html`<textarea id="wiz-purpose" data-bind="ui.wiz.statute.purpose" data-after="wiz-light" placeholder="Wofür gibt es die Organisation? Was tun die Mitglieder gemeinsam?">${s.purpose}</textarea>`, { req: true, hint: html`<span data-partial="wiz-c1">${c.counter(s.purpose.trim().length, 80)}</span>` })}
        ${c.field('wiz-goals', 'Ziele und Aktivitäten', html`<textarea id="wiz-goals" data-bind="ui.wiz.statute.goals" placeholder="Treffen, Veranstaltungen, Projekte …">${s.goals}</textarea>`)}
        ${c.field('wiz-adm', 'Aufnahme von Mitgliedern', html`<input id="wiz-adm" type="text" data-bind="ui.wiz.statute.admission" value="${s.admission}" placeholder="Wie wird man Mitglied?">`)}
        ${c.callout('info', 'Vorbereitung auf den Vorstellungstermin', 'Der Vorstand trägt Zweck und Satzung den Beamten persönlich vor. Alle Gründungsmitglieder müssen anwesend sein.')}
      </div>`;
    }
    const s = w.concept;
    return html`<div class="stack">
      ${c.field('wiz-idea', 'Geschäftsidee', html`<textarea id="wiz-idea" data-bind="ui.wiz.concept.idea" data-after="wiz-light" placeholder="Was bieten Sie an, und warum wird es gebraucht?">${s.idea}</textarea>`, { req: true, hint: html`<span data-partial="wiz-c1">${c.counter(s.idea.trim().length, 80)}</span>` })}
      <div class="grid g2">
        ${c.field('wiz-aud', 'Zielgruppe', html`<input id="wiz-aud" type="text" data-bind="ui.wiz.concept.audience" value="${s.audience}" placeholder="Wer sind Ihre Kunden?">`)}
        ${c.field('wiz-offer', 'Angebot', html`<input id="wiz-offer" type="text" data-bind="ui.wiz.concept.offer" value="${s.offer}" placeholder="Produkte und Leistungen">`)}
        ${c.field('wiz-staff', 'Geplantes Personal', html`<input id="wiz-staff" type="text" data-bind="ui.wiz.concept.staff" value="${s.staff}" placeholder="Wie viele Mitarbeiter?">`)}
        ${c.field('wiz-hours', 'Öffnungszeiten', html`<input id="wiz-hours" type="text" data-bind="ui.wiz.concept.hours" value="${s.hours}" placeholder="Wann sind Sie erreichbar?">`)}
      </div>
      ${c.callout('info', 'Vorbereitung auf den Vorstellungstermin', 'Sie stellen Ihr Unternehmen den Beamten persönlich vor. Rechnen Sie mit Fragen zu Geschäftsmodell, Standort, Personal und Gesellschaftsvertrag.')}
    </div>`;
  }

  function stepReview(w) {
    const d = S.d;
    const fe = fees(w);
    const el = d.eligibility[w.kind];
    const f = formOf(w.legalForm), b = w.branch ? branchOf(w.branch) : null;
    return html`<div class="stack lg">
      <div class="grid g2">
        ${c.sheet('Angaben', c.kv([
          ['Name', w.nameResult ? w.nameResult.display : w.name],
          [w.kind === 'fraktion' ? 'Art' : 'Rechtsform', f.label],
          b ? ['Branche', b.label] : null,
          ['Gründer', w.founders.map((x) => x.name + ' (' + L.MEMBER_ROLE[x.role] + (x.share != null ? ', ' + x.share + ' %' : '') + ')').join(', ')],
          ['Standort', w.property.mode === 'immobilie' ? w.property.label : 'Ohne festen Standort'],
        ]), { icon: 'doc' })}
        ${c.sheet('Zahlung', html`
          <div class="sum-row"><span>Antragsgebühr <span class="xs muted">(nicht erstattbar)</span></span><span class="v">${money(w.resubmit ? 0 : fe.apply)}</span></div>
          <div class="sum-row"><span>Eintragungsgebühr <span class="xs muted">(Vorauszahlung, erstattbar)</span></span><span class="v">${money(w.resubmit ? 0 : fe.register)}</span></div>
          ${fe.capital ? html`<div class="sum-row"><span>Kapital in Verwahrung <span class="xs muted">(erstattbar)</span></span><span class="v">${money(w.resubmit ? 0 : fe.capital)}</span></div>` : ''}
          <div class="sum-row total"><span>Jetzt fällig</span><span class="v">${money(w.resubmit ? 0 : fe.payNow)}</span></div>
          <div class="xs muted" style="margin-top:6px">Kontostand ${money(d.me.bank)}, danach ${money(d.me.bank - (w.resubmit ? 0 : fe.payNow))}.</div>`, { icon: 'coin' })}
      </div>
      ${c.sheet('Voraussetzungen', html`<ul class="checklist">${el.checks.map((k) => html`<li><label style="cursor:default"><span class="chip ${k.ok ? 'ok' : 'bad'}">${ico(k.ok ? 'check' : 'x')}</span><span>${k.text}</span></label></li>`)}</ul>`, { icon: 'shield' })}
      ${w.kind === 'fraktion' ? html`<div class="ooc" role="group" aria-label="OOC-Angaben">
        <div class="ooc-label">${ico('lock')}OOC-Angaben · nur für den Staff sichtbar</div>
        <p class="small muted" style="margin-bottom:12px">Diese Angaben sehen Beamte nie. Sie helfen dem Staff bei Kapazitäten und Freischaltungen. Sie sind kein Teil Ihres Rollenspiels.</p>
        <div class="stack">
          ${c.field('wiz-oocc', 'Fraktionsart', html`<select id="wiz-oocc" data-bind="ui.wiz.ooc.category" data-after="wiz-ooc-cat"><option value="legal" ${sel(w.ooc.category === 'legal')}>Legale Organisation</option>${d.settings.undergroundViaPortal ? html`<option value="untergrund" ${sel(w.ooc.category === 'untergrund')}>Untergrund-Gruppierung (Gang, MC, Mafia, Kartell)</option>` : ''}</select>`)}
          <div data-partial="wiz-ooc-hint">${IC.partials['wiz-ooc-hint']()}</div>
          ${c.field('wiz-oocn', 'Konzept in Stichpunkten', html`<textarea id="wiz-oocn" data-bind="ui.wiz.ooc.note" placeholder="Geplante Aktivitäten, Ziele, Revierwunsch …">${w.ooc.note}</textarea>`)}
          ${c.field('wiz-oocm', 'Geplante Mitgliederzahl', html`<input id="wiz-oocm" type="text" data-bind="ui.wiz.ooc.members" value="${w.ooc.members}" placeholder="z. B. 12">`)}
        </div></div>` : ''}
      <label class="check"><input id="wiz-confirm" type="checkbox" data-bind="ui.wiz.confirm" data-after="wiz-light" ${w.confirm ? raw('checked') : ''}><span>Ich versichere, dass meine Angaben wahrheitsgemäß sind. Mir ist bekannt, dass falsche Angaben zur Ablehnung oder zum Entzug der Eintragung führen können.</span></label>
    </div>`;
  }
  IC.partials['wiz-ooc-hint'] = function () {
