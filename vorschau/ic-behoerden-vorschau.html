      title: 'Vorprüfung ' + a.caseNo, icon: 'doc', wide: true,
      body: html`<div class="stack">
        ${c.kv([['Name', a.name], ['Antragsteller', who(a)], [a.kind === 'fraktion' ? 'Art' : 'Rechtsform', f.label], b ? ['Branche', html`${b.label} ${b.authority ? c.chip('Zulassung: ' + b.authority, 'warn', 'badge') : ''}`] : null, ['Standort', IC.siteLabel(a.property)], ['Gründer', a.founders.map((x) => x.name + ' (' + L.MEMBER_ROLE[x.role] + (x.share != null ? ', ' + x.share + ' %' : '') + ')').join(', ')]])}
        ${a.kind === 'unternehmen' && a.concept ? c.kv([['Geschäftsidee', a.concept.idea], ['Zielgruppe', a.concept.audience || '–'], ['Personal', a.concept.staff || '–']]) : a.statute ? c.kv([['Zweck', a.statute.purpose], ['Ziele', a.statute.goals || '–'], ['Aufnahme', a.statute.admission || '–']]) : ''}
        ${c.field('rev-msg', 'Hinweis an den Gründer', html`<textarea id="rev-msg" data-bind="ui.rev.msg" placeholder="Bei Nachbesserung oder Ablehnung Pflicht: Was fehlt, oder warum ist der Antrag unzulässig?"></textarea>`)}
      </div>`,
      footer: html`<button class="btn ghost" data-act="rev-conflict" style="margin-right:auto">Befangenheit melden</button><button class="btn danger" data-act="rev-do" data-result="abgelehnt">Ablehnen</button><button class="btn" data-act="rev-do" data-result="nachbesserung">Nachbesserung anfordern</button><button class="btn ok" data-act="rev-do" data-result="ok">${ico('check')}Vorprüfung bestanden</button>`,
    });
  }

  /* ====================================================================
     Sprechzeiten
     ==================================================================== */
  function hours() {
    const d = S.d, o = O();
    const h = S.ui.hrs || (S.ui.hrs = { day: 1, start: 18 * 60, dur: 120 });
    const mine = d.hours.filter((x) => x.mine);
    const dayTs = (n) => IC.startOfDay(IC.now() + n * IC.DAY);
    return html`
      <div class="page-head"><div><div class="crumbs">Beamten-Tablet · Sprechzeiten</div><h1>Sprechzeiten</h1><p class="sub">Veröffentlichte Sprechzeiten machen Termine auch dann buchbar, wenn Sie gerade nicht im Dienst sind. Bei Beginn müssen Sie im Dienst sein, sonst fällt der Termin aus.</p></div></div>
      <div class="split" style="grid-template-columns:minmax(0,1fr) 340px">
        <div class="stack">
          ${c.sheet('Alle Sprechzeiten', d.hours.length ? html`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Beamter</th><th>Tag</th><th>Zeit</th><th></th></tr></thead><tbody>${d.hours.map((x) => html`<tr><td class="strong">${x.official}${x.mine ? html` ${c.chip('Sie', 'info')}` : ''}</td><td>${IC.fday(x.start)}</td><td class="num">${IC.ftime(x.start)}–${IC.ftime(x.end)} Uhr</td><td class="act">${x.mine || lvl(o.rank) >= lvl('amtsleiter') ? html`<button class="btn sm ghost" data-act="hours-del" data-id="${x.id}" aria-label="Sprechzeit löschen">${ico('trash')}</button>` : ''}</td></tr>`)}</tbody></table></div>` : c.empty('calendar', 'Keine Sprechzeiten', 'Ohne Sprechzeiten und ohne Beamte im Dienst kann niemand einen Termin buchen.'), { icon: 'calendar', flush: !!d.hours.length })}
        </div>
        <aside class="stack">
          ${c.sheet('Sprechzeit veröffentlichen', html`<div class="stack">
            ${c.field('hrs-day', 'Tag', html`<select id="hrs-day" data-bind="ui.hrs.day">${Array.from({ length: cfg().rules.bookAheadDays + 1 }, (_, n) => html`<option value="${n}" ${Number(h.day) === n ? raw('selected') : ''}>${IC.fdaylong(dayTs(n))}</option>`)}</select>`)}
            ${c.field('hrs-start', 'Beginn', html`<select id="hrs-start" data-bind="ui.hrs.start">${Array.from({ length: 72 }, (_, i) => 6 * 60 + i * 15).map((m) => html`<option value="${m}" ${Number(h.start) === m ? raw('selected') : ''}>${IC.pad(Math.floor(m / 60))}:${IC.pad(m % 60)} Uhr</option>`)}</select>`)}
            ${c.field('hrs-dur', 'Dauer', html`<select id="hrs-dur" data-bind="ui.hrs.dur">${[30, 60, 90, 120, 180, 240].map((m) => html`<option value="${m}" ${Number(h.dur) === m ? raw('selected') : ''}>${m >= 60 ? (m / 60) + ' Std.' : m + ' Min.'}</option>`)}</select>`)}
            <button class="btn primary" data-act="hours-add">Veröffentlichen</button>
          </div>`, { icon: 'plus' })}
          ${mine.length ? c.callout('info', 'Ihre Sprechzeiten', mine.length + ' ' + IC.plural(mine.length, 'Zeitfenster', 'Zeitfenster') + ' veröffentlicht.', 'calendar') : ''}
        </aside>
      </div>`;
  }

  /* ====================================================================
     Register mit Sanktionen
     ==================================================================== */
  function breg() {
    const d = S.d, o = O();
    const q = S.ui.bq || '';
    const n = IC.normName(q);
    const rows = d.register.filter((e) => !n || IC.normName(e.name).indexOf(n) !== -1 || e.regNo.toLowerCase().replace(/\s/g, '').indexOf(q.toLowerCase().replace(/\s/g, '')) !== -1);
    const can = lvl(o.rank) >= lvl('amtsleiter');
    return html`
      <div class="page-head"><div><div class="crumbs">Beamten-Tablet · Register</div><h1>Register und Aufsicht</h1><p class="sub">Auflagen und Sanktionen dürfen Amtsleiter verhängen. Jede Maßnahme braucht eine Begründung und lässt sich per Einspruch anfechten.</p></div></div>
      <div class="sheet"><div class="sheet-b"><div class="field" style="max-width:420px"><label for="breg-q">Suche</label><input id="breg-q" type="search" data-bind="ui.bq" data-after="breg-search" value="${q}" placeholder="Name oder Registernummer"></div></div></div>
      <div class="sheet"><div class="sheet-b flush tbl-wrap" data-partial="breg-rows">${IC.partials['breg-rows']()}</div></div>
      ${can ? '' : c.callout('info', 'Eingeschränkte Rechte', 'Sanktionen sind dem Rang Amtsleiter vorbehalten. In der Vorschau können Sie den Rang unten links wechseln.', 'lock')}`;
  }
  IC.partials['breg-rows'] = function () {
    const d = S.d, o = O();
    const q = S.ui.bq || '';
    const n = IC.normName(q);
    const can = lvl(o.rank) >= lvl('amtsleiter');
    const rows = d.register.filter((e) => !n || IC.normName(e.name).indexOf(n) !== -1 || e.regNo.toLowerCase().replace(/\s/g, '').indexOf(q.toLowerCase().replace(/\s/g, '')) !== -1);
    if (!rows.length) return c.empty('search', 'Keine Treffer', 'Zu Ihrer Suche gibt es keinen Eintrag.');
    return html`<table class="tbl"><thead><tr><th>Name</th><th>Nr.</th><th>Status</th><th>Auflagen</th><th></th></tr></thead><tbody>${rows.map((e) => {
      const open = e.conditions.filter((x) => !x.done).length;
      return html`<tr><td><div class="strong">${e.name}</div><div class="sub">${e.owner} · ${e.hq}</div></td><td>${c.tag(e.regNo)}</td><td>${c.orgChip(e.status)}</td><td>${open ? c.chip(open + ' offen', 'warn') : '–'}${e.history && e.history.length ? html` ${c.chip(e.history.length + ' Maßnahmen', '')}` : ''}</td>
        <td class="act"><button class="btn sm" data-act="sanction-open" data-id="${e.id}" ${can && e.status !== 'aufgeloest' ? '' : raw('disabled')}>Maßnahme</button></td></tr>`;
    })}</tbody></table>`;
  };

  /* ====================================================================
     Handbuch
     ==================================================================== */
  function manual() {
    return html`
      <div class="page-head"><div><div class="crumbs">Beamten-Tablet · Handbuch</div><h1>Kurzhandbuch</h1><p class="sub">Das ausführliche Handbuch liegt im Repository unter docs/BEAMTEN-HANDBUCH.md.</p></div></div>
      <div class="grid g2">
        ${c.sheet('Entscheidungsgrundsätze', html`<div class="stack sm">
          <div class="row top"><span class="chip ok">Genehmigen</span><span class="grow">Wenn alle Pflichtpunkte der Checkliste erfüllt sind.</span></div>
          <div class="row top"><span class="chip warn">Auflagen</span><span class="grow">Bei behebbaren Mängeln, die sich binnen einer Frist nachweisen lassen.</span></div>
          <div class="row top"><span class="chip info">Vertagen</span><span class="grow">Bei fehlenden Unterlagen oder fehlenden Pflichtteilnehmern.</span></div>
          <div class="row top"><span class="chip bad">Ablehnen</span><span class="grow">Nur bei nicht heilbarem Namensverstoß, eindeutig unzulässigem Zweck, bewusst falschen Angaben, aktiver Sperre oder wiederholt fehlenden Pflichtteilnehmern.</span></div></div>`, { icon: 'stamp' })}
        ${c.sheet('Neutralität und Befangenheit', html`<ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px"><li>Nie ablehnen, weil das Konzept „nicht gefällt“.</li><li>Nie ablehnen, um Konkurrenz zu schützen oder aus OOC-Gründen.</li><li>Sind Sie selbst Gründer, Gesellschafter oder Mitglied, ist der Antrag für Sie gesperrt.</li><li>Bei Verwandtschaft oder Konkurrenz im Rollenspiel: „Befangenheit melden“.</li><li>Jede Entscheidung außer „Genehmigen“ braucht eine Begründung.</li></ul>`, { icon: 'scale' })}
        ${c.sheet('Ablauf eines Vorstellungstermins', html`<ol class="timeline"><li class="tl-item"><span class="tl-dot">${ico('bell')}</span><div><div class="tl-t">Aufrufen und begrüßen</div></div></li><li class="tl-item"><span class="tl-dot">${ico('badge')}</span><div><div class="tl-t">Ausweise prüfen, Termin starten</div></div></li><li class="tl-item"><span class="tl-dot">${ico('users')}</span><div><div class="tl-t">Vorstellung anhören, Fragen stellen</div></div></li><li class="tl-item"><span class="tl-dot">${ico('list')}</span><div><div class="tl-t">Checkliste abarbeiten</div></div></li><li class="tl-item"><span class="tl-dot">${ico('stamp')}</span><div><div class="tl-t">Entscheiden, begründen, Bescheid aushändigen</div></div></li></ol>`, { icon: 'list' })}
        ${c.sheet('Dienst und Sprechzeiten', html`<ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px"><li>Nur im Dienst sind Termine live buchbar und Entscheidungen möglich.</li><li>Sprechzeiten machen spätere Termine buchbar. Bei Beginn müssen Sie im Dienst sein.</li><li>Fällt ein Termin wegen fehlender Beamter aus, bekommt der Gründer Vorrang und keinen Strike.</li><li>Pro durchgeführtem Termin zahlt die Stadtkasse ${money(cfg().rules.officialPay)}, unabhängig vom Ergebnis.</li></ul>`, { icon: 'clock' })}
      </div>`;
  }

  /* ====================================================================
     Aktionen
     ==================================================================== */
  Object.assign(IC.act, {
    'duty-set': async (el) => {
      const r = await IC.run('dutySet', { state: el.dataset.state, desk: Number(S.ui.deskSel || O().desk) }, { ok: el.dataset.state === 'on' ? 'Sie sind im Dienst.' : el.dataset.state === 'pause' ? 'Sie sind in der Pause.' : 'Sie sind außer Dienst.' });
    },
    'duty-desk': async () => { await IC.api('dutySet', { state: O().state, desk: Number(S.ui.deskSel) }); await IC.reload(); },
    'pv-rank': async (el) => { await IC.api('pvSetRank', { rank: el.value }); await IC.reload(); },
    'appt-call': async (el) => { await IC.run('apptCall', { id: el.dataset.id }, { ok: 'Aufgerufen. Die Anzeigetafel zeigt den Aufruf.' }); },
    'appt-start': async (el) => {
      const r = await IC.run('apptStart', { id: el.dataset.id }, { ok: 'Termin gestartet.' });
      if (r.ok) IC.act['term-open'](el);
    },
    'appt-noshow': async (el) => {
      const ap = apptOf(el.dataset.id);
      const yes = await IC.confirm({ title: 'Nicht erschienen?', danger: true, yes: 'Als nicht erschienen werten', text: ap.bookerName + ' ist ' + IC.dur(IC.now() - ap.start) + ' nach Terminbeginn nicht vollständig eingecheckt. Das zählt als Strike.',
        extra: html`<label class="check"><input id="ns-exc" type="checkbox" data-bind="ui.nsExcused"><span>Entschuldigt (zum Beispiel Verbindungsabbruch), kein Strike</span></label>` });
      if (yes) await IC.run('apptNoShow', { id: ap.id, excused: !!S.ui.nsExcused }, { ok: 'Termin geschlossen.' });
      S.ui.nsExcused = false;
    },
    'queue-next': async () => { await IC.run('queueNext', {}, { ok: (r) => 'Nummer ' + r.no + ' aufgerufen.' }); },
    'term-open': (el) => {
      S.ui.term = { id: el.dataset.id, checklist: {}, notes: '', result: null, dec: null, reason: '', conds: [], condIn: '' };
      IC.view('term');
    },
    'term-close': () => { S.ui.term = null; IC.view('today'); },
    'chk-toggle': (el) => { T().checklist[el.dataset.key] = el.checked; IC.refresh('term-check'); },
    'dec-open': (el) => decisionModal(el.dataset.dec),
    'dec-preset': (el) => {
      const t = cfg().reasonPresets[el.dataset.dec][Number(el.dataset.i)];
      T().reason = t;
      const ta = document.getElementById('dec-reason');
      if (ta) { ta.value = t; ta.focus(); }
    },
    'dec-cond-preset': (el) => {
      const t = T(), i = t.conds.indexOf(el.dataset.text);
      if (i === -1) t.conds.push(el.dataset.text); else t.conds.splice(i, 1);
      IC.refresh('dec-conds');
    },
    'dec-cond-add': () => {
      const t = T(), v = String(t.condIn || '').trim();
      if (!v) return;
      if (t.conds.indexOf(v) === -1) t.conds.push(v);
      t.condIn = '';
      IC.refresh('dec-conds');
    },
    'dec-cond-del': (el) => { const t = T(); t.conds = t.conds.filter((x) => x !== el.dataset.text); IC.refresh('dec-conds'); },
    'dec-confirm': async () => {
      const t = T();
      const r = await IC.run('apptDecide', { id: t.id, decision: t.dec, reason: t.reason, conditions: t.conds, checklist: t.checklist }, { noReload: true });
      if (!r.ok) return;
      IC.modal.close(true);
      t.result = r;
      await IC.reload();
    },
    'rev-open': (el) => reviewModal(appOf(el.dataset.id)),
    'rev-do': async (el) => {
      const r = await IC.run('appReview', { id: S.ui.rev.id, result: el.dataset.result, message: S.ui.rev.msg }, { ok: { ok: 'Vorprüfung bestanden. Der Gründer wurde benachrichtigt.', nachbesserung: 'Nachbesserung angefordert.', abgelehnt: 'Antrag abgelehnt.' }[el.dataset.result] });
      if (r.ok) IC.modal.close(true);
    },
    'rev-conflict': async () => {
      const yes = await IC.confirm({ title: 'Befangenheit melden?', yes: 'Befangenheit melden', text: 'Der Antrag wird aus Ihrer Liste entfernt und an einen anderen Beamten übergeben. Die Meldung wird protokolliert.' });
      if (yes) { const r = await IC.run('conflictReport', { id: S.ui.rev.id }, { ok: 'Befangenheit gemeldet. Der Antrag liegt nicht mehr bei Ihnen.' }); }
    },
    'hours-add': async () => {
      const h = S.ui.hrs;
      const start = IC.startOfDay(IC.now() + Number(h.day) * IC.DAY) + Number(h.start) * IC.MIN;
      await IC.run('hoursCreate', { start, end: start + Number(h.dur) * IC.MIN }, { ok: 'Sprechzeit veröffentlicht. Bürger können jetzt Termine buchen.' });
    },
    'hours-del': async (el) => { await IC.run('hoursDelete', { id: el.dataset.id }, { ok: 'Sprechzeit gelöscht.' }); },
    'breg-search': () => IC.refresh('breg-rows'),
    'sanction-open': (el) => {
      const e = S.d.register.find((x) => x.id === el.dataset.id);
      S.ui.sanc = { id: e.id, level: 'verwarnung', reason: '' };
      IC.modal.open({
        title: 'Maßnahme gegen ' + e.name, icon: 'scale',
        body: html`<div class="stack">
          ${c.field('sc-level', 'Maßnahme', html`<select id="sc-level" data-bind="ui.sanc.level">${Object.keys(L.SANCTION).map((k) => html`<option value="${k}">${L.SANCTION[k]}</option>`)}</select>`)}
          ${c.field('sc-reason', 'Begründung', html`<textarea id="sc-reason" data-bind="ui.sanc.reason" placeholder="Was wird beanstandet? Die Begründung steht im Bescheid."></textarea>`, { req: true })}
          ${c.callout('warn', 'Einspruch möglich', 'Jede Maßnahme lässt sich binnen ' + cfg().rules.objectionHours + ' Stunden anfechten. Befristete Untersagung und Entzug sind schwere Eingriffe.')}</div>`,
        footer: html`<button class="btn" data-act="modal-close">Abbrechen</button><button class="btn danger solid" data-act="sanction-send">Maßnahme verhängen</button>`,
      });
    },
    'sanction-send': async () => { const s = S.ui.sanc; const r = await IC.run('sanctionIssue', { entityId: s.id, level: s.level, reason: s.reason }, { ok: 'Maßnahme verhängt und protokolliert.' }); if (r.ok) IC.modal.close(true); },
  });

  IC.registerApp('beamte', {
    title: 'Beamten-Tablet', icon: 'stamp', def: 'today',
    where: () => S.d.config.city + (S.env.nui ? '' : ' · Rathaus') + ' · Schalter ' + O().desk,
    nav: () => {
      const d = S.d;
      const wait = d.officialApps.filter((a) => a.status === 'eingereicht').length;
      const openToday = d.officialAppts.filter((a) => OPEN.indexOf(a.status) !== -1).length;
      const list = [
        { id: 'today', label: 'Heute', icon: 'calendar', badge: openToday || null },
        { id: 'reviews', label: 'Vorprüfung', icon: 'doc', badge: wait || null, badgeKind: wait ? 'warn' : '' },
        { id: 'hours', label: 'Sprechzeiten', icon: 'clock' },
        { id: 'breg', label: 'Register', icon: 'folder' },
        { id: 'manual', label: 'Handbuch', icon: 'book' },
      ];
      if (S.ui.term && !S.ui.term.result) list.splice(1, 0, { id: 'term', label: 'Laufender Termin', icon: 'play' });
      return list;
    },
    railFoot: () => S.env.nui
      ? html`<div class="stack sm"><span class="lbl">Dienstnummer</span><span class="mono">${O().dienstnr}</span><span class="xs">Ihr Rang bestimmt, welche Termine und Maßnahmen erlaubt sind.</span></div>`
      : html`<div class="stack sm"><span class="lbl">Nur Vorschau: Rang</span><select id="pv-rank" aria-label="Rang in der Vorschau wechseln" style="width:100%">${['anwaerter', 'sachbearbeiter', 'amtsleiter'].map((r) => html`<option value="${r}" ${O().rank === r ? raw('selected') : ''}>${L.RANK[r].label}</option>`)}</select><span class="xs">Der Rang bestimmt, welche Termine und Maßnahmen erlaubt sind.</span></div>`,
    views: { today, term, reviews, hours, breg, manual },
  });

  /* Rangwechsel per Auswahlfeld: change-Ereignis, da data-act nur Klicks auslöst */
  document.addEventListener('change', (e) => {
    if (e.target && e.target.id === 'pv-rank') IC.act['pv-rank'](e.target);
  });
})();

/* js/view-staff.js */
/* IC-Behördenportal · Staff-Panel (OOC): Schlussprüfung, Kapazitäten, Sperrliste, Audit */
(function () {
  'use strict';
  const IC = window.IC;
  const { html, raw, ico, money } = IC;
  const c = IC.c, L = IC.L, S = IC.S;
  const cfg = () => S.d.config;
  const ST = () => S.d.staff;
  const formOf = (k) => cfg().legalForms.find((f) => f.key === k);
  const branchOf = (k) => cfg().branches.find((b) => b.key === k);

  function kpi(label, value, sub, kind) {
    return html`<div class="kpi"><div class="kl">${label}</div><div class="kv2 ${kind || ''}" style="${kind === 'bad' ? 'color:var(--bad)' : kind === 'warn' ? 'color:var(--warn)' : ''}">${value}</div><div class="ks">${sub}</div></div>`;

  /* ---------- Übersicht ---------- */
  function overview() {
    const k = ST().kpi;
    const apps = ST().applicationsAll;
    const byStatus = {};
    apps.forEach((a) => { byStatus[a.status] = (byStatus[a.status] || 0) + 1; });
    const stat = L.OPEN_APP.map((s) => [s, byStatus[s] || 0]);
    return html`
      <div class="page-head"><div><div class="crumbs">Staff-Panel · Übersicht</div><h1>Übersicht</h1><p class="sub">Der Staff greift ein, wenn Regeln verletzt werden oder Kapazitäten ausgeschöpft sind, nicht weil ein Konzept nicht gefällt.</p></div>
        <div class="row sm">${oocBadge}<span class="chip">${ico('coin')}Stadtkasse ${money(k.treasury)}</span></div></div>
      <div class="grid g4">
        ${kpi('Offene Anträge', k.open, 'in allen Phasen')}
        ${kpi('Schlussprüfung', k.gate, k.gate ? 'warten auf Ihre Freigabe' : 'nichts offen', k.gate ? 'warn' : '')}
        ${kpi('Eskalationen', k.escalations, 'über ' + cfg().rules.escalateHours + ' Std. ohne Termin', k.escalations ? 'bad' : '')}
        ${kpi('Beamte im Dienst', k.onDuty, 'Ziel: mindestens 4 Std. pro Tag besetzt', k.onDuty ? '' : 'warn')}
        ${kpi('Durchlaufzeit', String(k.throughputDays).replace('.', ',') + ' Tg.', 'Einreichung bis Eintragung, Ziel ≤ 7 Tage')}
        ${kpi('Ablehnungsquote', k.rejectionRate + ' %', 'Ziel: 10 bis 25 %')}
        ${kpi('No-Show-Quote', k.noShowRate + ' %', 'Ziel: höchstens 10 %')}
        ${kpi('Beamten-Ausfälle', k.outageRate + ' %', 'Ziel: höchstens 5 %')}
      </div>
      <p class="small muted">${S.env.nui ? 'Quoten und Durchlaufzeit werden aus den abgeschlossenen Vorgängen berechnet. Mit wenigen Vorgängen schwanken sie stark.' : 'Quoten und Durchlaufzeit sind in der Vorschau Beispielwerte, bis genug abgeschlossene Vorgänge vorliegen.'}</p>
      <div class="grid g2">
        ${c.sheet('Offene Vorgänge nach Status', html`<div class="tbl-wrap"><table class="tbl"><tbody>${stat.map((x) => html`<tr><td>${c.appChip(x[0])}</td><td class="right num strong">${x[1]}</td></tr>`)}</tbody></table></div>`, { icon: 'chart', flush: true })}
        ${c.sheet('Zuletzt im Protokoll', html`<div class="tbl-wrap"><table class="tbl"><tbody>${ST().audit.slice(0, 6).map((a) => html`<tr><td class="nowrap muted small">${IC.ftime(a.ts)}</td><td><span class="strong">${a.action}</span> <span class="muted">${a.target}</span><div class="sub">${a.actor}</div></td></tr>`)}</tbody></table></div>`, { icon: 'list', flush: true })}
      </div>`;
  }

  /* ---------- Schlussprüfung ---------- */
  function gate() {
    const list = ST().gate;
    const uc = ST().undergroundCap;
    return html`
      <div class="page-head"><div><div class="crumbs">Staff-Panel · Schlussprüfung</div><h1>Freigaben</h1><p class="sub">Nach der IC-Genehmigung durch die Beamten prüfen Sie OOC-Kriterien: Konzept, Mitgliederzahl, Kapazität. Die Gründer sehen dies IC als „Schlussprüfung der Registerführung“.</p></div>${oocBadge}</div>
      ${list.length ? list.map((a) => {
        const f = formOf(a.legalForm), b = a.branch ? branchOf(a.branch) : null;
        const under = a.ooc && a.ooc.category === 'untergrund';
        return html`<article class="sheet"><div class="sheet-h">${ico('shield')}<h3>${a.caseNo}</h3><span class="sp"></span>${c.appChip(a.status)}</div>
          <div class="sheet-b stack">
            <div><h2>${a.name}</h2><p class="muted small">${f.label}${b ? ' · ' + b.label : ''} · Antragsteller ${a.applicant.name}</p></div>
            <div class="grid g2">
              <div class="stack sm"><h4>IC-Entscheidung</h4>${c.kv([['Beamter', a.decision ? a.decision.by : '–'], ['Begründung', a.decision ? a.decision.reason : '–'], ['Gründer', a.founders.map((x) => x.name).join(', ')], ['Sitz', IC.siteLabel(a.property)]])}</div>
              <div class="ooc"><div class="ooc-label">${ico('lock')}OOC-Angaben der Gründer</div>${a.ooc ? c.kv([['Fraktionsart', under ? c.chip('Untergrund', 'bad') : c.chip('Legal', 'ok')], ['Konzept', a.ooc.note || '–'], ['Mitglieder', a.ooc.members || '–']]) : html`<p class="small muted">Branche mit Staff-Gate: ${b ? b.label : ''}. Keine OOC-Angaben nötig.</p>`}</div>
            </div>
            <div class="grid g2">
              <div class="stack sm"><h4>Kapazität</h4>${under ? html`${c.meter(uc.used, uc.max)}<span class="small ${uc.used >= uc.max ? '' : 'muted'}">${uc.used} von ${uc.max} Untergrund-Plätzen belegt${uc.used >= uc.max ? '. Keine Plätze frei, Warteliste.' : '.'}</span>` : b ? html`${c.meter(b.used, b.cap)}<span class="small muted">${b.used} von ${b.cap} Plätzen in ${b.label} belegt.</span>` : html`<span class="small muted">Keine Kapazitätsgrenze.</span>`}</div>
              <div class="stack sm"><h4>Hinweise</h4><ul class="checklist">${['Spielzeit der Gründer erfüllt die Voraussetzung', 'Keine Mehrfach-Gründer-Verknüpfung gefunden', 'Name steht nicht auf der Sperrliste'].map((t) => html`<li><label style="cursor:default;padding:5px 4px"><span class="chip ok">${ico('check')}</span><span>${t}</span></label></li>`)}</ul></div>
            </div>
          </div>
          <div class="sheet-f"><button class="btn danger" data-act="gate-back" data-id="${a.id}">Zurückweisen</button><button class="btn ok" data-act="gate-ok" data-id="${a.id}">${ico('check')}Freigeben und eintragen</button></div>
        </article>`;
      }) : c.sheet('Freigaben', c.empty('check', 'Nichts zu prüfen', 'Genehmigte Anträge mit Staff-Gate erscheinen hier.'))}`;
  }

  /* ---------- Eskalationen ---------- */
  function esc() {
    const list = ST().escalations;
    const on = ST().settings.writtenProcedure;
    return html`
      <div class="page-head"><div><div class="crumbs">Staff-Panel · Notfallregel</div><h1>Eskalationen</h1><p class="sub">Anträge, die seit über ${cfg().rules.escalateHours} Stunden nach bestandener Vorprüfung auf einen Termin warten. Im schriftlichen Verfahren lässt sich nach Aktenlage entscheiden.</p></div>${oocBadge}</div>
      ${on ? '' : c.callout('warn', 'Schriftliches Verfahren abgeschaltet', 'Unter „Einstellungen“ lässt es sich einschalten.', 'lock')}
      ${c.sheet('Überfällige Anträge', list.length ? html`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Aktenzeichen</th><th>Name</th><th>Wartet seit</th><th></th></tr></thead><tbody>${list.map((a) => html`<tr><td>${c.tag(a.caseNo)}</td><td><div class="strong">${a.name}</div><div class="sub">${a.applicant.name}</div></td><td>${IC.dur(IC.now() - (a.vorpruefungAt || a.submittedAt))} ${c.chip('Eskalation', 'bad')}</td><td class="act"><button class="btn sm primary" data-act="esc-open" data-id="${a.id}" ${on ? '' : raw('disabled')}>Nach Aktenlage entscheiden</button></td></tr>`)}</tbody></table></div>` : c.empty('check', 'Keine Eskalationen', 'Alle Anträge mit bestandener Vorprüfung haben einen Termin oder sind noch in der Frist.'), { icon: 'clock', flush: !!list.length })}`;
  }

  /* ---------- Kapazitäten ---------- */
  function caps() {
    const uc = ST().undergroundCap;
    return html`
      <div class="page-head"><div><div class="crumbs">Staff-Panel · Kapazitäten</div><h1>Kapazitäten</h1><p class="sub">Höchstzahl gleichzeitig aktiver Unternehmen je Branche. Freie Plätze sind für Gründer im Terminal sichtbar.</p></div>${oocBadge}</div>
      ${c.sheet('Branchen', html`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Branche</th><th>Belegung</th><th class="right">Kapazität</th></tr></thead><tbody>${ST().caps.map((x) => html`<tr><td class="strong">${x.label}</td><td style="min-width:200px">${c.meter(x.used, x.cap)}<span class="xs muted">${x.used} von ${x.cap} belegt${x.used >= x.cap ? ', ausgelastet' : ''}</span></td>
        <td class="act"><div class="row sm" style="justify-content:flex-end"><button class="btn sm" data-act="cap-step" data-key="${x.key}" data-d="-1" aria-label="Kapazität von ${x.label} verringern">${ico('minus')}</button><output class="mono strong" style="min-width:30px;text-align:center">${x.cap}</output><button class="btn sm" data-act="cap-step" data-key="${x.key}" data-d="1" aria-label="Kapazität von ${x.label} erhöhen">${ico('plus')}</button></div></td></tr>`)}</tbody></table></div>`, { icon: 'layers', flush: true })}
      ${c.sheet('Untergrund-Fraktionen', html`<div class="stack sm">${c.meter(uc.used, uc.max)}<span class="small muted">${uc.used} von ${uc.max} Plätzen belegt. Sind alle Plätze belegt, bleiben neue Untergrund-Anträge in der Schlussprüfung und kommen auf die Warteliste.</span></div>`, { icon: 'flag' })}`;
  }

  /* ---------- Sperrliste und Namenstest ---------- */
  IC.partials['name-test'] = function () {
    const r = S.ui.nt;
    if (!r) return html`<div class="hint">Geben Sie einen Namen ein, um ihn gegen Sperrliste, Register und laufende Anträge zu prüfen.</div>`;
    return html`${r.ok ? c.msg('ok', 'Der Name wäre zulässig: ' + r.display) : ''}${r.issues.map((i) => c.msg(i.level === 'error' ? 'bad' : 'warn', i.text))}`;
  };
  function black() {
    const list = ST().blacklist;
    S.ui.bl = S.ui.bl || { term: '', reason: '' };
    return html`
      <div class="page-head"><div><div class="crumbs">Staff-Panel · Namensrecht</div><h1>Sperrliste</h1><p class="sub">Gesperrte Begriffe werden bei der Namensprüfung automatisch abgelehnt. Die Prüfung ignoriert Groß- und Kleinschreibung, Umlaute und Leetspeak.</p></div>${oocBadge}</div>
      <div class="split" style="grid-template-columns:minmax(0,1fr) 340px">
        ${c.sheet('Gesperrte Begriffe', html`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Begriff</th><th>Grund</th><th></th></tr></thead><tbody>${list.map((b) => html`<tr><td class="strong">${b.term}</td><td>${b.reason}</td><td class="act"><button class="btn sm ghost" data-act="bl-del" data-id="${b.id}" aria-label="${b.term} entfernen">${ico('trash')}</button></td></tr>`)}</tbody></table></div>`, { icon: 'lock', flush: true })}
        <aside class="stack">
          ${c.sheet('Begriff sperren', html`<div class="stack">${c.field('bl-term', 'Begriff', html`<input id="bl-term" type="text" data-bind="ui.bl.term" value="${S.ui.bl.term}" placeholder="z. B. Weißes Haus">`)}${c.field('bl-reason', 'Grund', html`<input id="bl-reason" type="text" data-bind="ui.bl.reason" value="${S.ui.bl.reason}" placeholder="z. B. Reale Marke">`)}<button class="btn primary" data-act="bl-add">Sperren</button></div>`, { icon: 'plus' })}
          ${c.sheet('Namenstest', html`<div class="stack">${c.field('nt-in', 'Name prüfen', html`<input id="nt-in" type="text" data-bind="ui.ntq" data-after="nt-run" placeholder="Name eingeben" value="${S.ui.ntq || ''}">`)}<div data-partial="name-test">${IC.partials['name-test']()}</div></div>`, { icon: 'search' })}
        </aside>
      </div>`;
  }

  /* ---------- Audit ---------- */
  function audit() {
    const q = (S.ui.aq || '').toLowerCase();
    const kind = S.ui.ak || '';
    const rows = ST().audit.filter((a) => (!kind || a.kind === kind) && (!q || (a.actor + ' ' + a.action + ' ' + a.target + ' ' + a.detail).toLowerCase().indexOf(q) !== -1));
    return html`
      <div class="page-head"><div><div class="crumbs">Staff-Panel · Protokoll</div><h1>Audit-Log</h1><p class="sub">Jede Statusänderung mit Akteur, Zeit und Grund. Die Einträge lassen sich nicht ändern.</p></div>${oocBadge}</div>
      <div class="sheet"><div class="sheet-b"><div class="row" style="align-items:flex-end">
        <div class="field grow" style="min-width:220px"><label for="au-q">Suche</label><input id="au-q" type="search" data-bind="ui.aq" data-after="au-run" value="${S.ui.aq || ''}" placeholder="Akteur, Aktion, Aktenzeichen"></div>
        <div class="seg" role="group" aria-label="Akteur">${[['', 'Alle'], ['bürger', 'Bürger'], ['beamter', 'Beamte'], ['staff', 'Staff'], ['system', 'System']].map((k) => html`<button data-act="au-kind" data-kind="${k[0]}" ${pressed(kind === k[0])}>${k[1]}</button>`)}</div></div></div></div>
      <div class="sheet"><div class="sheet-b flush tbl-wrap" data-partial="audit-rows">${IC.partials['audit-rows']()}</div></div>`;
  }
  IC.partials['audit-rows'] = function () {
    const q = (S.ui.aq || '').toLowerCase();
    const kind = S.ui.ak || '';
    const rows = ST().audit.filter((a) => (!kind || a.kind === kind) && (!q || (a.actor + ' ' + a.action + ' ' + a.target + ' ' + a.detail).toLowerCase().indexOf(q) !== -1));
    if (!rows.length) return c.empty('search', 'Keine Einträge', 'Zu diesem Filter gibt es keine Protokolleinträge.');
    const kc = { bürger: '', beamter: 'info', staff: 'warn', system: '' };
    return html`<table class="tbl"><thead><tr><th>Zeit</th><th>Akteur</th><th>Aktion</th><th>Bezug</th><th>Detail</th></tr></thead><tbody>${rows.map((a) => html`<tr><td class="nowrap num">${IC.fdt(a.ts)}</td><td>${a.actor} ${c.chip(a.kind, kc[a.kind] || '')}</td><td class="strong">${a.action}</td><td>${c.tag(a.target)}</td><td>${a.detail}</td></tr>`)}</tbody></table>`;
  };

  /* ---------- Einstellungen ---------- */
  function settings() {
    const st = ST().settings;
    const items = [
      ['requireOfficials', 'Beamtenpflicht für Termine', 'Termine sind nur buchbar, wenn Beamte im Dienst sind oder Sprechzeiten bestehen. Das ist die Kernregel des Systems.'],
      ['writtenProcedure', 'Schriftliches Verfahren (Notfallregel)', 'Überfällige Anträge lassen sich nach Aktenlage entscheiden, wenn ' + cfg().rules.escalateHours + ' Stunden kein Termin möglich war.'],
      ['undergroundViaPortal', 'Untergrund-Fraktionen über das Portal', 'Gruppen melden eine legale Hülle an und geben OOC-Angaben ab. Aus: Untergrund-Fraktionen werden komplett OOC vergeben.'],
      ['fourEyes', 'Vier-Augen-Prinzip für Organisationen', 'Entscheidungen brauchen die Gegenzeichnung eines zweiten Beamten ab Rang Amtsleiter. Sinnvoll ab etwa fünf aktiven Beamten.', true],
    ];
    return html`
      <div class="page-head"><div><div class="crumbs">Staff-Panel · Einstellungen</div><h1>Einstellungen</h1><p class="sub">Funktionen ein- und ausschalten. Änderungen wirken sofort und werden protokolliert.</p></div>${oocBadge}</div>
      ${c.sheet('Funktionen', html`<ul class="checklist">${items.map((i) => html`<li><label ${i[3] ? raw('style="cursor:default;opacity:.7"') : ''}><input type="checkbox" data-act="set-toggle" data-key="${i[0]}" ${st[i[0]] ? raw('checked') : ''} ${i[3] ? raw('disabled') : ''}><span><span class="strong">${i[1]}</span>${i[3] ? html` ${c.chip('Geplant für Phase 2', 'info')}` : ''}<span class="ci-note" style="display:block;font-size:13.5px">${i[2]}</span></span></label></li>`)}</ul>`, { icon: 'gear' })}`;
  }

  /* ---------- Aktionen ---------- */
  Object.assign(IC.act, {
    'gate-ok': async (el) => {
      const a = ST().gate.find((x) => x.id === el.dataset.id);
      const yes = await IC.confirm({ title: '„' + a.name + '“ freigeben?', icon: 'shield', yes: 'Freigeben und eintragen', text: 'Das Unternehmen beziehungsweise die Organisation wird eingetragen, die Registernummer vergeben und der Gewerbeschein ausgestellt. Danach laufen die Provisioning-Hooks.' });
      if (yes) await IC.run('staffGate', { id: a.id, decision: 'freigeben' }, { ok: 'Freigegeben und eingetragen.' });
    },
    'gate-back': (el) => {
      S.ui.gb = { id: el.dataset.id, note: '' };
      IC.modal.open({ title: 'Schlussprüfung nicht bestanden', icon: 'shield',
        body: html`<div class="stack">${c.callout('info', 'Hinweis an die Gründer', 'Der Grund wird den Gründern als „Hinweis der Registerführung“ angezeigt. Formulieren Sie ihn verständlich und ohne IC-Bezug.')}${c.field('gb-note', 'Grund', html`<textarea id="gb-note" data-bind="ui.gb.note" placeholder="Was fehlt, oder was muss angepasst werden?"></textarea>`, { req: true })}</div>`,
        footer: html`<button class="btn" data-act="modal-close">Abbrechen</button><button class="btn danger solid" data-act="gate-back-send">Zurückweisen</button>` });
    },
    'gate-back-send': async () => { const r = await IC.run('staffGate', { id: S.ui.gb.id, decision: 'zurueck', note: S.ui.gb.note }, { ok: 'Zurückgewiesen. Die Gründer erhalten den Hinweis.' }); if (r.ok) IC.modal.close(true); },
    'esc-open': (el) => {
      const a = ST().escalations.find((x) => x.id === el.dataset.id);
      S.ui.ew = { id: a.id, decision: 'genehmigt', reason: '' };
      IC.modal.open({ title: 'Entscheidung nach Aktenlage', icon: 'doc',
        body: html`<div class="stack">${c.callout('info', a.name, 'IC ist das ein Bescheid der Behörde ohne Termin. Die Gründer sehen „Entscheidung nach Aktenlage“.')}
          ${c.field('ew-dec', 'Entscheidung', html`<select id="ew-dec" data-bind="ui.ew.decision"><option value="genehmigt">Genehmigen</option><option value="abgelehnt">Ablehnen</option></select>`)}
          ${c.field('ew-reason', 'Begründung', html`<textarea id="ew-reason" data-bind="ui.ew.reason" placeholder="Pflicht. Der Text steht im Bescheid."></textarea>`, { req: true })}</div>`,
        footer: html`<button class="btn" data-act="modal-close">Abbrechen</button><button class="btn primary" data-act="esc-send">Entscheidung treffen</button>` });
    },
    'esc-send': async () => { const w = S.ui.ew; const r = await IC.run('staffWritten', { id: w.id, decision: w.decision, reason: w.reason }, { ok: 'Entscheidung nach Aktenlage erteilt.' }); if (r.ok) IC.modal.close(true); },
    'cap-step': async (el) => {
      const x = ST().caps.find((k) => k.key === el.dataset.key);
      await IC.run('staffCap', { key: x.key, value: x.cap + Number(el.dataset.d) }, { noReload: false });
    },
    'bl-add': async () => { const r = await IC.run('staffBlacklistAdd', { term: S.ui.bl.term, reason: S.ui.bl.reason }, { ok: 'Begriff gesperrt.' }); if (r.ok) S.ui.bl = { term: '', reason: '' }; },
    'bl-del': async (el) => { await IC.run('staffBlacklistRemove', { id: el.dataset.id }, { ok: 'Sperre aufgehoben.' }); },
    'nt-run': IC.debounce(async () => {
      const q = (S.ui.ntq || '').trim();
      if (q.length < 3) { S.ui.nt = null; IC.refresh('name-test'); return; }
      const r = await IC.api('nameCheck', { name: q, legalForm: 'einzel' });
      S.ui.nt = r; IC.refresh('name-test');
    }, 250),
    'au-run': () => IC.refresh('audit-rows'),
    'au-kind': (el) => { S.ui.ak = el.dataset.kind; IC.render(); },
    'set-toggle': async (el) => { await IC.run('staffSetting', { key: el.dataset.key, value: el.checked }, { ok: 'Einstellung gespeichert.' }); },
  });

  IC.registerApp('staff', {
    title: 'Staff-Panel', icon: 'shield', def: 'overview',
    where: () => 'OOC · Verwaltung der IC-Gründung',
    nav: () => {
      const k = ST().kpi;
      return [
        { id: 'overview', label: 'Übersicht', icon: 'chart' },
        { id: 'gate', label: 'Freigaben', icon: 'shield', badge: k.gate || null, badgeKind: 'warn' },
        { id: 'esc', label: 'Eskalationen', icon: 'alert', badge: k.escalations || null, badgeKind: 'bad' },
        { head: 'Regeln' },
        { id: 'caps', label: 'Kapazitäten', icon: 'layers' },
        { id: 'black', label: 'Sperrliste', icon: 'lock' },
        { id: 'audit', label: 'Audit-Log', icon: 'list' },
        { id: 'settings', label: 'Einstellungen', icon: 'gear' },
      ];
    },
    railFoot: () => html`Dieser Bereich ist OOC. Beamte und Bürger sehen ihn nie.`,
    views: { overview, gate, esc, caps, black, audit, settings },
  });
})();

/* js/view-konzept.js */
/* IC-Behördenportal · Konzept auf einen Blick (nur Vorschau, kein Teil des Spiels) */
(function () {
  'use strict';
  const IC = window.IC;
  const { html, raw, ico } = IC;
  const c = IC.c, L = IC.L, S = IC.S;

  /* ---------- Bahnendiagramm ---------- */
  function lanes() {
    const laneTop = [20, 128, 236, 344];
    const labels = [['Gründer', 'Spieler am Terminal'], ['Terminal', 'System, automatisch'], ['Bürgeramt', 'Beamte, Spieler'], ['Registerführung', 'Staff, OOC']];
    const node = (x, lane, t1, t2, cls) => {
      const y = laneTop[lane] + 25;
      return `<g class="nd-g ${cls || ''}"><rect class="nd" x="${x}" y="${y}" width="140" height="54" rx="3"/><text class="t1" x="${x + 70}" y="${y + 23}" text-anchor="middle">${t1}</text><text class="t2" x="${x + 70}" y="${y + 40}" text-anchor="middle">${t2}</text></g>`;
    };
    let svg = '<svg viewBox="0 0 1080 468" role="img" aria-labelledby="lane-t lane-d" xmlns="http://www.w3.org/2000/svg"><title id="lane-t">Gründungsablauf</title><desc id="lane-d">Vom Antrag am Terminal über Vorprüfung, Vorstellungstermin und Entscheidung bis zur Eintragung, mit optionaler Schlussprüfung durch den Staff.</desc>';
    svg += '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-2)"/></marker></defs>';
    laneTop.forEach((y, i) => {
      svg += `<rect x="0" y="${y}" width="1080" height="104" class="${i % 2 ? 'lane b' : 'lane a'}"/>`;
      svg += `<text class="lt" x="14" y="${y + 40}">${labels[i][0]}</text><text class="t2" x="14" y="${y + 58}">${labels[i][1]}</text>`;
    });
    // Verbindungen
    const P = (d, dash, arrow) => `<path class="ln${dash ? ' dash' : ''}" d="${d}" ${arrow === false ? '' : 'marker-end="url(#ah)"'}/>`;
    svg += P('M290,72 H375 V153');
    svg += P('M445,180 H530 V261');
    svg += P('M600,288 H685 V99');
    svg += P('M755,72 H840 V261');
    svg += P('M840,315 V369', true);
    svg += P('M910,288 H995 V207');
    svg += P('M910,396 H995 V288', true, false);
    svg += P('M460,288 H240 V99', true);
    svg += '<text class="t3" x="250" y="276">Nachbesserung, 7 Tage Frist</text>';
    svg += '<text class="t3" x="852" y="346">falls Staff-Gate</text>';
    // Knoten
    svg += node(150, 0, 'Antrag ausfüllen', '6 Schritte, Live-Prüfung');
    svg += node(305, 1, 'Prüfen und bezahlen', 'Name, Limits, Gebühren');
    svg += node(460, 2, 'Vorprüfung', 'Ziel: 48 Stunden', 'off');
    svg += node(615, 0, 'Termin buchen', 'nur mit Beamten da', 'key');
    svg += node(770, 2, 'Vorstellung', 'Checkliste, Entscheidung', 'off');
    svg += node(770, 3, 'Schlussprüfung', 'Untergrund, Branchen', 'ooc');
    svg += node(925, 1, 'Eintragung', 'Nummer, Gewerbeschein');
    svg += '</svg>';
    return raw(svg);
  }

  const RULES = [
    ['Kein Beamter, kein Termin', 'Termine gibt es nur, wenn Beamte im Dienst sind oder Sprechzeiten veröffentlicht haben. Gründer lassen sich benachrichtigen. Fällt ein Termin aus, gibt es Vorrang und keinen Strike.'],
    ['IC zuerst, Staff als Netz', 'Gründer und Beamte spielen den Prozess. Der Staff prüft nur OOC-Kriterien in der Schlussprüfung und pflegt Kapazitäten und Sperrliste.'],
    ['Begründung und Einspruch', 'Jede Ablehnung, Auflage und Vertagung braucht eine Begründung. Nach einer Ablehnung bleiben 48 Stunden für den Einspruch. Ein Amtsleiter entscheidet.'],
    ['Kapazitäten statt Einzelfälle', 'Branchen haben Höchstzahlen, freie Plätze sind im Terminal sichtbar. Untergrund-Fraktionen brauchen zusätzlich einen Slot.'],
    ['Schutz vor Missbrauch', 'Antragsgebühr, Namensreservierung, Strikes, Limits je Charakter, Befangenheitssperre und ein lückenloses Audit-Log.'],
    ['Bestandsschutz', 'Bestehende Fraktionen und Unternehmen werden eingetragen und bestätigen kostenlos innerhalb von 28 Tagen. Es gibt keine Sanktion.'],
  ];

  const DECISIONS = [
    ['Untergrund-Fraktionen: wie gründen?', 'Config.Organizations.undergroundViaPortal', 'Legale Hülle (IG oder Verein) plus OOC-Angaben und Staff-Gate'],
    ['Wer sind die Beamten?', 'Config.Officials', 'Eigene Fraktion mit vier Rängen, mindestens 3 aktive Beamte vor dem Start'],
    ['Terminmodus', 'Config.Appointments.mode', 'hybrid: Live-Termine plus Sprechzeiten'],
    ['Vier-Augen-Prinzip', 'Config.Decisions.fourEyes', 'Aus, bis es etwa fünf aktive Beamte gibt'],
    ['Schriftliches Verfahren', 'Config.Appointments.writtenProcedure', 'An, nur Amtsleiter und Staff, nach 72 Stunden'],
    ['Gebührenhöhe', 'Config.LegalForms', 'Mit den Standardwerten starten, nach zwei Wochen prüfen'],
    ['Strikes und Sperren', 'Config.Appointments.strikes', '3 Strikes in 14 Tagen, 3 Tage Sperre'],
    ['Härte beim Bestandsschutz', 'Config.Legacy', 'Nur Hinweis, keine Sanktion'],
    ['Framework und Zusatzressourcen', 'Config.Framework', 'ESX und QBCore werden erkannt, Telefon und Inventar sind Adapter'],
    ['Gewerbeschein-Verlängerung', 'Config.Certificate', 'In Phase 2 nachziehen'],
  ];

  function statusFlow() {
    const A = L.APP;
    const main = ['entwurf', 'eingereicht', 'vorpruefung_ok', 'termin_gebucht', 'termin_laeuft', 'staff_pruefung', 'genehmigt'];
    const side = ['nachbesserung', 'abgelehnt', 'einspruch', 'zurueckgezogen', 'abgelaufen'];
    return html`<div class="stack">
      <div class="row sm">${main.map((k, i) => html`${i ? html`<span class="muted">${ico('chev')}</span>` : ''}${c.chip(A[k].label, A[k].kind)}`)}</div>
      <div class="row sm"><span class="lbl">Seitenwege</span>${side.map((k) => c.chip(A[k].label, A[k].kind))}</div>
      <p class="small muted">Nachbesserung führt zurück in die Vorprüfung. Eine Ablehnung lässt sich 48 Stunden lang per Einspruch anfechten. „Schlussprüfung“ gibt es nur bei Untergrund-Fraktionen und sensiblen Branchen.</p>
    </div>`;
  }

  function overview() {
    return html`
      <div class="page-head"><div><div class="crumbs">Konzept · Auf einen Blick</div><h1>So läuft die IC-Gründung</h1>
        <p class="sub">Fraktionen und Unternehmen entstehen im Spiel: am Gewerbeamt-Terminal beantragen, im Bürgeramt den Beamten vorstellen, nach der Entscheidung eintragen. Der Staff bleibt das Sicherheitsnetz.</p></div></div>
      <section class="stack sm" aria-labelledby="k-flow"><h2 id="k-flow">Ablauf</h2><div class="lane-wrap">${lanes()}</div></section>
      <section class="stack sm" aria-labelledby="k-rules"><h2 id="k-rules">Kernregeln</h2>
        <div class="rules">${RULES.map((r, i) => html`<div class="rule"><h3>${r[0]}</h3><p>${r[1]}</p></div>`)}</div></section>
      <section class="stack sm" aria-labelledby="k-status"><h2 id="k-status">Status eines Antrags</h2>${c.sheet('Lebenszyklus', statusFlow(), { icon: 'list' })}</section>
      <section class="stack sm" aria-labelledby="k-dec"><h2 id="k-dec">Offene Entscheidungen</h2>
        <p class="small muted">Für jede Frage gibt es eine Empfehlung. Bis zu Ihrer Entscheidung gelten die Standardwerte.</p>
        <div class="sheet"><div class="decisions" role="table" aria-label="Offene Entscheidungen">
          <div class="dh" role="row"><span role="columnheader">#</span><span role="columnheader">Frage</span><span role="columnheader">Einstellung</span><span role="columnheader">Empfehlung</span></div>
          ${DECISIONS.map((d, i) => html`<div role="row"><span class="mono muted" role="cell">${i + 1}</span><span class="strong" role="cell">${d[0]}</span><span class="mono small" role="cell">${raw(IC.esc(d[1]).replace(/\./g, '.<wbr>'))}</span><span role="cell">${d[2]}</span></div>`)}
        </div></div></section>
      <section class="stack sm" aria-labelledby="k-pack"><h2 id="k-pack">Was im Paket ist</h2>
        <div class="grid g3">
          ${c.sheet('Dokumente', html`<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px"><li>Konzept</li><li>Technik und Datenmodell</li><li>Beamten-Handbuch</li><li>Gründer-Leitfaden</li><li>Umsetzung und Go-Live</li><li>Discord-Ankündigung</li></ul>`, { icon: 'book' })}
          ${c.sheet('Oberfläche', html`<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px"><li>Gewerbeamt-Terminal</li><li>Bürgeramt mit Aufrufanzeige</li><li>Beamten-Tablet</li><li>Staff-Panel</li></ul><p class="small muted" style="margin-top:8px">Diese Vorschau ist dieselbe Oberfläche, die im Spiel läuft.</p>`, { icon: 'layers' })}
          ${c.sheet('Server-Ressource', html`<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px"><li>FiveM-Ressource ic_behoerden</li><li>SQL-Schema</li><li>Framework-Bridge ESX, QBCore, Standalone</li><li>Getestete Kernlogik</li></ul>`, { icon: 'tool' })}
        </div></section>`;
  }

  IC.registerApp('konzept', {
    title: 'Konzept', icon: 'book', def: 'overview',
    where: () => 'Auf einen Blick',
    nav: () => [{ id: 'overview', label: 'Auf einen Blick', icon: 'book' }],
    railFoot: () => html`Das vollständige Konzept steht in docs/KONZEPT.md.`,
    views: { overview },
  });
})();

IC.boot();
</script>
</body>
