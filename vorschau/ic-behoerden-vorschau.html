<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IC-Behördenportal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700&display=swap">
<style>
/* ==========================================================================
   IC-Behördenportal · Design-System
   Layout-Idee: ein Amtsterminal. Formularbögen mit Kopfzeile, linke Navigation,
   eine LED-Aufrufanzeige als Wiedererkennungsmerkmal, Stempel für Entscheidungen.
   Kein color-mix(), :has() oder CSS-Nesting: läuft auch in älteren CEF-Versionen (FiveM NUI).
   ========================================================================== */

:root {
  /* Fläche */
  --bg: #E6EAEF;
  --surface: #FFFFFF;
  --surface-2: #F1F4F7;
  --surface-3: #E7ECF1;
  --line: #CFD6DE;
  --line-strong: #9BA7B5;
  /* Text */
  --ink: #101B2A;
  --ink-2: #3A485B;
  --ink-3: #566478;
  /* Akzent: Amtsblau */
  --accent: #0F4C81;
  --accent-hover: #0B3C68;
  --accent-ink: #FFFFFF;
  --accent-soft: #DFEAF6;
  /* Fenster-Chrome und Vorschauleiste */
  --chrome: #0D2740;
  --chrome-ink: #E8EFF7;
  --chrome-line: #24415F;
  /* Semantik */
  --ok: #17693F;
  --ok-soft: #DDF2E6;
  --warn: #8A5200;
  --warn-soft: #FBEBC8;
  --bad: #A8231B;
  --bad-soft: #F9DAD7;
  --info: #0F4C81;
  --info-soft: #DFEAF6;
  /* Aufrufanzeige (bleibt in beiden Themes dunkel, es ist ein Gerät) */
  --board-bg: #090C11;
  --board-line: #262C35;
  --led: #FFB000;
  --led-dim: #5A4210;
  /* Urkunde (Papier bleibt hell) */
  --paper: #FAFBFC;
  --paper-ink: #1B2430;
  --paper-line: #8A97A8;
  /* Form */
  --radius: 3px;
  --radius-lg: 6px;
  --shadow-win: 0 1px 0 rgba(255,255,255,.5) inset, 0 18px 40px -18px rgba(13,39,64,.45), 0 2px 6px rgba(13,39,64,.12);
  --shadow-pop: 0 20px 50px -12px rgba(8,14,22,.55);
  /* Schrift */
  --font-ui: "Barlow", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-head: "Barlow Semi Condensed", "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-led: "Doto", "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080E16;
    --surface: #111A26;
    --surface-2: #17222F;
    --surface-3: #1E2B3B;
    --line: #26354A;
    --line-strong: #46597A;
    --ink: #E8EEF6;
    --ink-2: #BAC6D6;
    --ink-3: #93A2B7;
    --accent: #72B2F4;
    --accent-hover: #9CC8F8;
    --accent-ink: #07131F;
    --accent-soft: #15293F;
    --chrome: #060B12;
    --chrome-ink: #DCE6F2;
    --chrome-line: #1C2B3E;
    --ok: #62D494;
    --ok-soft: #10281D;
    --warn: #F0B84D;
    --warn-soft: #2D2208;
    --bad: #FF8A80;
    --bad-soft: #35120F;
    --info: #72B2F4;
    --info-soft: #15293F;
    --shadow-win: 0 18px 40px -18px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #080E16;
  --surface: #111A26;
  --surface-2: #17222F;
  --surface-3: #1E2B3B;
  --line: #26354A;
  --line-strong: #46597A;
  --ink: #E8EEF6;
  --ink-2: #BAC6D6;
  --ink-3: #93A2B7;
  --accent: #72B2F4;
  --accent-hover: #9CC8F8;
  --accent-ink: #07131F;
  --accent-soft: #15293F;
  --chrome: #060B12;
  --chrome-ink: #DCE6F2;
  --chrome-line: #1C2B3E;
  --ok: #62D494;
  --ok-soft: #10281D;
  --warn: #F0B84D;
  --warn-soft: #2D2208;
  --bad: #FF8A80;
  --bad-soft: #35120F;
  --info: #72B2F4;
  --info-soft: #15293F;
  --shadow-win: 0 18px 40px -18px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.4);
  color-scheme: dark;
}

/* ---------- Basis ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3, h4 { margin: 0; font-family: var(--font-head); font-weight: 600; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 28px; letter-spacing: .005em; }
h2 { font-size: 20px; }
h3 { font-size: 16px; letter-spacing: .01em; }
h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: .92em; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.strong { font-weight: 600; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); border: 0; }
.ico { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; }
.ico.lg { width: 22px; height: 22px; }
[hidden] { display: none !important; }

/* ---------- Layout-Helfer ---------- */
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack.sm { gap: 8px; }
.stack.lg { gap: 24px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row.sm { gap: 6px; }
.row.top { align-items: flex-start; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grow { flex: 1 1 0; min-width: 0; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-auto { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; align-items: start; }
.sticky { position: sticky; top: 64px; }

/* ---------- Vorschauleiste (nur Preview) ---------- */
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: var(--chrome);
}
.pv-bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 41;
  background: var(--chrome);
  color: var(--chrome-ink);
  border-bottom: 1px solid var(--chrome-line);
}
.pv-in {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 14px 22px;
  flex-wrap: wrap;
  padding: 9px max(16px, env(safe-area-inset-right, 0px)) 9px max(16px, env(safe-area-inset-left, 0px));
}
.pv-brand { display: flex; align-items: center; gap: 10px; font: 600 15px var(--font-head); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.pv-tag { font: 600 11px var(--font-mono); letter-spacing: .08em; padding: 2px 7px; border: 1px solid var(--led); color: var(--led); border-radius: 2px; }
.pv-tabs { display: flex; gap: 2px; flex-wrap: wrap; flex: 1 1 auto; min-width: 0; }
.pv-tab {
  appearance: none; border: 0; background: transparent; color: var(--chrome-ink);
  padding: 7px 12px; border-radius: var(--radius); font: 500 14px var(--font-head); letter-spacing: .04em; text-transform: uppercase; opacity: .78;
  display: inline-flex; align-items: center; gap: 7px;
}
.pv-tab:hover { opacity: 1; background: rgba(255,255,255,.08); }
.pv-tab[aria-current="page"] { opacity: 1; background: rgba(255,255,255,.14); box-shadow: inset 0 -2px 0 var(--led); }
.pv-ctl { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.pv-ctl label { opacity: .8; font-family: var(--font-head); letter-spacing: .04em; text-transform: uppercase; font-size: 12px; }
.pv-step { display: inline-flex; align-items: center; border: 1px solid var(--chrome-line); border-radius: var(--radius); overflow: hidden; }
.pv-step button { appearance: none; border: 0; background: transparent; color: var(--chrome-ink); width: 28px; height: 28px; font-size: 16px; line-height: 1; }
.pv-step button:hover:not(:disabled) { background: rgba(255,255,255,.12); }
.pv-step button:disabled { opacity: .35; cursor: default; }
.pv-step output { min-width: 28px; text-align: center; font: 600 14px var(--font-mono); }
.pv-ico-btn { appearance: none; background: transparent; border: 1px solid var(--chrome-line); color: var(--chrome-ink); border-radius: var(--radius); height: 30px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--font-head); letter-spacing: .05em; text-transform: uppercase; }
.pv-ico-btn:hover { background: rgba(255,255,255,.1); }

.pv-guide { max-width: 1280px; margin: 16px auto 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.guide { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.guide-steps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.guide-lab { font: 600 12px var(--font-head); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-right: 4px; }
.gstep { appearance: none; display: inline-flex; align-items: center; gap: 8px; padding: 4px 11px 4px 5px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); font: 500 13.5px var(--font-ui); color: var(--ink); }
.gstep .gn { width: 20px; height: 20px; display: grid; place-items: center; background: var(--surface-3); color: var(--ink-2); font: 600 11.5px var(--font-mono); border-radius: 2px; }
.gstep:hover { border-color: var(--accent); }
.gstep[aria-current="step"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.gstep[aria-current="step"] .gn { background: var(--accent); color: var(--accent-ink); }
.guide-hint { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--ink-2); }
.guide-hint .ico { margin-top: 3px; color: var(--accent); }

/* ---------- Bühne und Fenster ---------- */
.stage { max-width: 1280px; margin: 16px auto 40px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.win { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow-win); overflow: hidden; display: flex; flex-direction: column; min-height: 680px; }
.win-title { display: flex; align-items: center; gap: 12px; padding: 9px 14px; background: var(--chrome); color: var(--chrome-ink); font: 600 13px var(--font-head); letter-spacing: .09em; text-transform: uppercase; }
.win-title .where { opacity: .7; font-weight: 500; }
.win-title .sp { flex: 1; }
.win-title .clock { font: 500 13px var(--font-mono); letter-spacing: .04em; opacity: .9; }
.win-title .who { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1px solid var(--chrome-line); border-radius: 2px; font-size: 12px; }
.win-title .x { appearance: none; border: 1px solid var(--chrome-line); background: transparent; color: var(--chrome-ink); width: 28px; height: 26px; border-radius: 2px; display: grid; place-items: center; }
.win-title .x:hover { background: rgba(255,255,255,.12); }
.win-body { display: grid; grid-template-columns: 224px minmax(0, 1fr); flex: 1; min-height: 0; }
.rail { background: var(--surface-2); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
.rail h4 { padding: 10px 10px 6px; font-size: 11.5px; }
.rail-item {
  appearance: none; border: 0; background: transparent; text-align: left; width: 100%;
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius); color: var(--ink-2);
  font: 500 15px var(--font-ui);
}
.rail-item:hover { background: var(--surface-3); color: var(--ink); }
.rail-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.rail-item .badge { margin-left: auto; }
.rail-foot { margin-top: auto; padding: 12px 10px 4px; font-size: 12.5px; color: var(--ink-3); }
.main { padding: 22px 26px 30px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head .sub { color: var(--ink-2); margin-top: 4px; max-width: 70ch; }
.crumbs { font: 500 12px var(--font-head); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }

/* ---------- Bögen (Formular-Abschnitte) ---------- */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.sheet-h { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); border-radius: var(--radius) var(--radius) 0 0; }
.sheet-h h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); font-weight: 600; }
.sheet-h .sp { flex: 1; }
.sheet-b { padding: 16px; }
.sheet-b.flush { padding: 0; }
.sheet-f { padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface-2); display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; border-radius: 0 0 var(--radius) var(--radius); }

/* ---------- Kacheln ---------- */
.tile {
  appearance: none; text-align: left; width: 100%;
  display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); position: relative;
  transition: border-color .12s, box-shadow .12s, transform .12s;
}
.tile:hover { border-color: var(--accent); box-shadow: 0 6px 16px -10px rgba(13,39,64,.5); transform: translateY(-1px); }
.tile .tile-ico { width: 38px; height: 38px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); border-radius: 3px; }
.tile h3 { font-size: 17px; }
.tile p { color: var(--ink-2); font-size: 14px; }
.tile .badge { position: absolute; top: 12px; right: 12px; }
.tile[disabled] { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }

/* ---------- Buttons ---------- */
.btn {
  appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 38px; padding: 7px 16px; border-radius: var(--radius); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); font: 600 14.5px var(--font-ui); letter-spacing: .01em; white-space: nowrap;
  transition: background .12s, border-color .12s;
}
.btn:hover:not(:disabled) { background: var(--surface-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.ok:hover:not(:disabled) { filter: brightness(1.08); background: var(--ok); }
.btn.danger { background: var(--surface); border-color: var(--bad); color: var(--bad); }
.btn.danger:hover:not(:disabled) { background: var(--bad-soft); }
.btn.danger.solid { background: var(--bad); color: #fff; }
.btn.danger.solid:hover:not(:disabled) { filter: brightness(1.08); background: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.ghost:hover:not(:disabled) { background: var(--accent-soft); }
.btn.sm { min-height: 30px; padding: 3px 11px; font-size: 13.5px; }
.btn.lg { min-height: 46px; padding: 9px 22px; font-size: 16px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- Chips, Badges, Tags ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 2px; font: 600 12px var(--font-head); letter-spacing: .05em; text-transform: uppercase; background: var(--surface-3); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.chip.solid { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.chip .ico { width: 13px; height: 13px; }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: 600 12px var(--font-mono); }
.badge.warn { background: var(--warn); color: #fff; }
.badge.bad { background: var(--bad); color: #fff; }
.tag { display: inline-block; font: 500 12.5px var(--font-mono); letter-spacing: .02em; padding: 1px 7px; background: var(--surface-3); border: 1px solid var(--line); border-radius: 2px; color: var(--ink-2); white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); display: inline-block; flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.dot.bad { background: var(--bad); }
.dot.warn { background: var(--warn); }

/* ---------- Hinweisboxen ---------- */
.callout { display: flex; gap: 12px; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface-2); }
.callout > .ico { margin-top: 2px; width: 20px; height: 20px; }
.callout .t { font-weight: 600; }
.callout p, .callout ul { color: var(--ink-2); font-size: 14px; }
.callout ul { margin: 4px 0 0; padding-left: 18px; }
.callout.info { background: var(--info-soft); border-color: transparent; }
.callout.info > .ico { color: var(--info); }
.callout.ok { background: var(--ok-soft); border-color: transparent; }
.callout.ok > .ico { color: var(--ok); }
.callout.warn { background: var(--warn-soft); border-color: transparent; }
.callout.warn > .ico { color: var(--warn); }
.callout.bad { background: var(--bad-soft); border-color: transparent; }
.callout.bad > .ico { color: var(--bad); }
.ooc { border: 1px dashed var(--warn); border-radius: var(--radius); background: repeating-linear-gradient(135deg, transparent 0 9px, rgba(232,161,0,.07) 9px 18px); padding: 14px; }
.ooc-label { display: inline-flex; align-items: center; gap: 6px; font: 700 11.5px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--warn); margin-bottom: 8px; }

/* ---------- Formularfelder ---------- */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .lbl { font: 600 12px var(--font-head); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.field .hint { font-size: 12.5px; color: var(--ink-3); }
.field .err { font-size: 13px; color: var(--bad); display: flex; gap: 6px; align-items: flex-start; }
.field .okmsg { font-size: 13px; color: var(--ok); display: flex; gap: 6px; align-items: flex-start; }
.field .warnmsg { font-size: 13px; color: var(--warn); display: flex; gap: 6px; align-items: flex-start; }
input[type="text"], input[type="number"], input[type="search"], input[type="date"], input[type="time"], select, textarea {
  width: 100%; min-height: 38px; padding: 7px 10px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); color: var(--ink);
}
textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
input::placeholder, textarea::placeholder { color: var(--ink-3); opacity: .85; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.invalid { border-color: var(--bad) !important; }
.valid { border-color: var(--ok) !important; }
.counter { font: 500 12px var(--font-mono); color: var(--ink-3); text-align: right; }
.counter.ok { color: var(--ok); }
.input-suffix { display: flex; align-items: stretch; }
.input-suffix input { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.input-suffix span { display: grid; place-items: center; padding: 0 12px; background: var(--surface-3); border: 1px solid var(--line-strong); border-left: 0; border-radius: 0 var(--radius) var(--radius) 0; font: 600 14px var(--font-head); color: var(--ink-2); white-space: nowrap; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.seg button { appearance: none; border: 0; background: transparent; padding: 7px 14px; font: 600 13.5px var(--font-ui); color: var(--ink-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:hover:not([aria-pressed="true"]) { background: var(--surface-3); }

/* Auswahlkarten */
.pick { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); text-align: left; width: 100%; appearance: none; position: relative; }
.pick:hover:not(:disabled) { border-color: var(--accent); }
.pick[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); background: var(--accent-soft); }
.pick:disabled { opacity: .55; cursor: not-allowed; background: var(--surface-2); }
.pick .pk-t { font: 600 16px var(--font-head); letter-spacing: .01em; display: flex; gap: 8px; align-items: center; }
.pick .pk-d { font-size: 13.5px; color: var(--ink-2); }
.pick .pk-m { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
.pick .pk-tick { position: absolute; top: 10px; right: 10px; color: var(--accent); }
.pick-big { padding: 18px; gap: 8px; }
.pick-big .pk-t { font-size: 20px; }

/* Stepper */
.stepper { display: flex; align-items: center; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; overflow-x: auto; }
.step { display: flex; align-items: center; gap: 8px; color: var(--ink-3); white-space: nowrap; font: 500 14px var(--font-ui); }
.step .sn { width: 24px; height: 24px; display: grid; place-items: center; border: 1.5px solid var(--line-strong); border-radius: 2px; font: 600 12.5px var(--font-mono); background: var(--surface); }
.step.done { color: var(--ok); }
.step.done .sn { background: var(--ok); border-color: var(--ok); color: #fff; }
.step.cur { color: var(--ink); font-weight: 600; }
.step.cur .sn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step-link { flex: 1 1 18px; min-width: 14px; height: 1.5px; background: var(--line-strong); margin: 0 10px; }
.step-link.done { background: var(--ok); }
button.step { appearance: none; background: transparent; border: 0; padding: 0; }
button.step:not(:disabled):hover .sn { border-color: var(--accent); }
button.step:disabled { cursor: default; }

/* ---------- Tabellen ---------- */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font: 600 11.5px var(--font-head); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); background: var(--surface-2); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl td.act { text-align: right; white-space: nowrap; }
.tbl .sub { color: var(--ink-3); font-size: 12.5px; }

/* ---------- Schlüssel/Wert ---------- */
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 18px; font-size: 14px; }
.kv dt { color: var(--ink-3); font: 600 12px var(--font-head); letter-spacing: .07em; text-transform: uppercase; padding-top: 2px; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.sum-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.sum-row:last-child { border-bottom: 0; }
.sum-row.total { font-weight: 700; font-size: 16px; border-top: 2px solid var(--ink); border-bottom: 0; margin-top: 4px; padding-top: 9px; }
.sum-row .v { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- Kapazitätsanzeige ---------- */
.meter { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.meter.full > i { background: var(--bad); }
.meter.warn > i { background: var(--warn); }

/* ---------- Zeitleiste ---------- */
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tl-item { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; position: relative; padding-bottom: 14px; }
.tl-item::before { content: ""; position: absolute; left: 10px; top: 20px; bottom: -2px; width: 2px; background: var(--line); }
.tl-item:last-child { padding-bottom: 0; }
.tl-item:last-child::before { display: none; }
.tl-dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--line-strong); color: var(--ink-3); z-index: 1; }
.tl-dot .ico { width: 12px; height: 12px; }
.tl-item.ok .tl-dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.tl-item.bad .tl-dot { background: var(--bad); border-color: var(--bad); color: #fff; }
.tl-item.warn .tl-dot { background: var(--warn); border-color: var(--warn); color: #fff; }
.tl-item.cur .tl-dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.tl-item.todo { color: var(--ink-3); }
.tl-t { font-weight: 600; }
.tl-m { font-size: 12.5px; color: var(--ink-3); }
.tl-n { margin-top: 4px; padding: 8px 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); font-size: 14px; color: var(--ink-2); }

/* Fortschrittsleiste im Antrag */
.phases { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.phase { font: 600 11.5px var(--font-head); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.phase i { display: block; height: 5px; border-radius: 2px; background: var(--surface-3); margin-bottom: 5px; }
.phase.done { color: var(--ok); } .phase.done i { background: var(--ok); }
.phase.cur { color: var(--accent); } .phase.cur i { background: var(--accent); }
.phase.bad { color: var(--bad); } .phase.bad i { background: var(--bad); }

/* ---------- Aufrufanzeige (LED) ---------- */
.board {
  background: var(--board-bg); color: var(--led); border: 1px solid var(--board-line); border-radius: 4px;
  padding: 14px 18px; font-family: var(--font-led); letter-spacing: .12em; text-transform: uppercase;
  box-shadow: inset 0 0 0 3px #12161C, inset 0 0 50px rgba(255,176,0,.05);
}
.board .lab { font: 500 12px var(--font-mono); letter-spacing: .16em; color: #B98A1E; opacity: .85; }
.board .big { font-size: 46px; line-height: 1.05; font-weight: 700; text-shadow: 0 0 12px rgba(255,176,0,.55); }
.board .mid { font-size: 26px; line-height: 1.1; font-weight: 600; text-shadow: 0 0 10px rgba(255,176,0,.45); }
.board .dim { color: var(--led-dim); text-shadow: none; }
.board-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
.board-grid > div { padding: 2px 18px; border-left: 1px solid var(--board-line); }
.board-grid > div:first-child { padding-left: 0; border-left: 0; }
.board-sub { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--board-line); font: 500 13px var(--font-ui); letter-spacing: .02em; text-transform: none; color: #D6B35E; }
.board-sub b { color: var(--led); }

/* Wartenummer */
.ticket { position: relative; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 16px 18px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 18px; align-items: center; }
.ticket::before, .ticket::after { content: ""; position: absolute; left: 118px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line-strong); }
.ticket::before { top: -8px; clip-path: inset(50% 0 0 0); }
.ticket::after { bottom: -8px; clip-path: inset(0 0 50% 0); }
.ticket .tn { font: 700 40px/1 var(--font-led); letter-spacing: .06em; padding-right: 18px; border-right: 2px dashed var(--line-strong); color: var(--ink); }

/* ---------- Termine: Tage und Slots ---------- */
.daystrip { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.day { appearance: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 8px 4px; text-align: center; display: flex; flex-direction: column; gap: 1px; align-items: center; }
.day .dn { font: 600 12px var(--font-head); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.day .dd { font: 600 18px var(--font-head); }
.day .dc { font: 500 11.5px var(--font-mono); color: var(--ink-3); }
.day:hover:not(:disabled) { border-color: var(--accent); }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.day[aria-pressed="true"] .dn, .day[aria-pressed="true"] .dc { color: var(--accent-ink); opacity: .9; }
.day:disabled { opacity: .5; background: var(--surface-2); cursor: not-allowed; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.slot { appearance: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; text-align: left; }
.slot .st { font: 600 17px var(--font-mono); letter-spacing: .02em; }
.slot .sm { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 5px; }
.slot .pips { display: inline-flex; gap: 3px; }
.slot .pips i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.slot .pips i.off { background: var(--surface-3); border: 1px solid var(--line-strong); }
.slot:hover:not(:disabled) { border-color: var(--accent); }
.slot[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.slot[aria-pressed="true"] .sm { color: var(--accent-ink); opacity: .9; }
.slot[aria-pressed="true"] .pips i { background: var(--accent-ink); }
.slot:disabled { opacity: .5; background: var(--surface-2); cursor: not-allowed; }
.slot .src { font: 600 10.5px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }

/* Beamten-Anzeige */
.duty { display: flex; gap: 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); }
.duty.on { border-color: var(--ok); background: var(--ok-soft); }
.duty.off { border-color: var(--warn); background: var(--warn-soft); }
.duty .big { font: 700 26px/1 var(--font-led); min-width: 34px; text-align: center; }
.duty.on .big { color: var(--ok); }
.duty.off .big { color: var(--warn); }

/* ---------- Checkliste (Beamte) ---------- */
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.checklist li { border-bottom: 1px solid var(--line); }
.checklist li:last-child { border-bottom: 0; }
.checklist label { display: flex; gap: 12px; padding: 10px 4px; cursor: pointer; align-items: flex-start; }
.checklist input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ok); flex: none; }
.checklist .ci-note { font-size: 12.5px; color: var(--ink-3); }

/* ---------- Stempel und Urkunde ---------- */
.stamp { display: inline-block; padding: 5px 16px 4px; border: 3px double currentColor; border-radius: 4px; transform: rotate(-5deg); font: 700 22px/1 var(--font-head); letter-spacing: .16em; text-transform: uppercase; opacity: .92; mix-blend-mode: multiply; }
.stamp.ok { color: #1B7A47; }
.stamp.bad { color: #B3261E; }
.stamp.blue { color: #1F4FA3; }
.stamp.warn { color: #9A5B00; }
:root[data-theme="dark"] .stamp { mix-blend-mode: normal; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stamp { mix-blend-mode: normal; } }
@keyframes stampIn { 0% { transform: rotate(-5deg) scale(1.9); opacity: 0; } 60% { transform: rotate(-5deg) scale(.96); opacity: 1; } 100% { transform: rotate(-5deg) scale(1); opacity: .92; } }
.stamp.anim { animation: stampIn .38s cubic-bezier(.2,.8,.3,1) both; }

.cert {
  background: var(--paper); color: var(--paper-ink); border: 1px solid var(--paper-line); outline: 5px double #20496F; outline-offset: -14px;
  padding: 38px 44px 30px; font-family: var(--font-serif); position: relative; text-align: center; border-radius: 2px;
}
.cert .c-top { font: 600 12px var(--font-head); letter-spacing: .32em; text-transform: uppercase; color: #3A4A5E; }
.cert .c-title { font: 600 34px/1.1 var(--font-serif); letter-spacing: .18em; text-transform: uppercase; margin: 10px 0 4px; }
.cert .c-sub { font-style: italic; color: #4A596C; }
.cert .c-name { font: 600 28px/1.2 var(--font-serif); margin: 20px 0 6px; }
.cert .c-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 26px; text-align: left; margin: 20px auto 0; max-width: 520px; font-family: var(--font-ui); font-size: 14px; }
.cert .c-grid b { display: block; font: 600 10.5px var(--font-head); letter-spacing: .12em; text-transform: uppercase; color: #5A6A7E; }
.cert .c-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-top: 26px; font-family: var(--font-ui); font-size: 12.5px; color: #4A596C; text-align: left; }
.cert .c-sign { border-top: 1px solid #6B7A8E; padding-top: 4px; min-width: 190px; }
.cert .c-sign i { display: block; font: italic 500 22px var(--font-serif); color: #1F3B73; margin-bottom: 4px; transform: rotate(-2deg); transform-origin: left bottom; }
.cert .c-stamp { position: absolute; right: 54px; bottom: 74px; }
.cert .seal { width: 64px; height: 64px; color: #20496F; margin: 0 auto 6px; display: block; }

/* ---------- Leerzustand ---------- */
.empty { padding: 34px 20px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty .ico { width: 34px; height: 34px; color: var(--ink-3); }
.empty h3 { color: var(--ink); }
.empty p { max-width: 52ch; }

/* ---------- KPI ---------- */
.kpi { padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; gap: 3px; }
.kpi .kl { font: 600 12px var(--font-head); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.kpi .kv2 { font: 600 34px/1.05 var(--font-head); font-variant-numeric: tabular-nums; }
.kpi .ks { font-size: 12.5px; color: var(--ink-3); }

/* ---------- Modal und Toast ---------- */
.modal-ov { position: fixed; inset: 0; z-index: 60; background: rgba(6,12,20,.62); display: grid; place-items: center; padding: max(18px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.modal { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); width: min(620px, 100%); max-height: calc(100vh - 36px); display: flex; flex-direction: column; }
.modal.wide { width: min(820px, 100%); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-h h2 { font-size: 19px; flex: 1; }
.modal-b { padding: 18px; overflow-y: auto; }
.modal-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; background: var(--surface-2); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 70; display: flex; flex-direction: column; gap: 8px; width: min(380px, calc(100vw - 32px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; background: var(--chrome); color: var(--chrome-ink); border-radius: var(--radius); box-shadow: var(--shadow-pop); border-left: 4px solid var(--accent); font-size: 14px; animation: toastIn .18s ease-out both; }
.toast.ok { border-left-color: #3DBE7B; }
.toast.bad { border-left-color: #FF6B5E; }
.toast.warn { border-left-color: var(--led); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Konzept-Seite ---------- */
.lane-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.lane-wrap svg { display: block; min-width: 880px; width: 100%; height: auto; }
.lane-wrap text { font-family: var(--font-ui); fill: var(--ink); }
.lane-wrap .lane.a { fill: var(--surface-2); }
.lane-wrap .lane.b { fill: var(--surface); }
.lane-wrap .lt { font: 600 15px var(--font-head); letter-spacing: .06em; text-transform: uppercase; fill: var(--ink-2); }
.lane-wrap .t1 { font: 600 13.5px var(--font-ui); }
.lane-wrap .t2 { font: 400 11.5px var(--font-ui); fill: var(--ink-3); }
.lane-wrap .t3 { font: 500 11.5px var(--font-ui); fill: var(--ink-2); }
.lane-wrap .nd { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; }
.lane-wrap .nd-g.off .nd { stroke: var(--accent); stroke-width: 1.8; }
.lane-wrap .nd-g.key .nd { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.lane-wrap .nd-g.ooc .nd { stroke: var(--warn); stroke-dasharray: 5 3; stroke-width: 1.6; fill: var(--warn-soft); }
.lane-wrap .ln { fill: none; stroke: var(--ink-2); stroke-width: 1.5; }
.lane-wrap .ln.dash { stroke-dasharray: 5 4; }
.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.rule { padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.rule h3 { font-size: 16.5px; }
.rule p { font-size: 14px; color: var(--ink-2); }
.rule .rn { font: 600 12px var(--font-mono); color: var(--accent); letter-spacing: .06em; }
.decisions { display: grid; grid-template-columns: 1fr; gap: 0; }
.decisions > div { display: grid; grid-template-columns: 32px minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.4fr); gap: 14px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: start; font-size: 14px; }
.decisions > div:last-child { border-bottom: 0; }
.decisions .dh { font: 600 11.5px var(--font-head); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); background: var(--surface-2); }

/* ---------- Auswahl: Mitgründer ---------- */
.person { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font: 700 13px var(--font-head); letter-spacing: .03em; }
.person .pn { font-weight: 600; }
.person .pm { font-size: 12.5px; color: var(--ink-3); }
.share { width: 84px; }

/* ---------- Responsiv ---------- */
@media (max-width: 1100px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .sticky { position: static; }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rules { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .win-body { grid-template-columns: minmax(0, 1fr); }
  .rail { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; gap: 4px; }
  .rail h4, .rail-foot { display: none; }
  .rail-item { width: auto; white-space: nowrap; flex: none; }
  .main { padding: 16px 14px 24px; }
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .daystrip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .cert { padding: 28px 20px 24px; }
  .cert .c-stamp { position: static; margin-top: 14px; }
  .decisions > div { grid-template-columns: 24px minmax(0, 1fr); }
  .decisions > div > :nth-child(n+3) { grid-column: 2; }
  .board-grid { grid-template-columns: minmax(0, 1fr); }
  .board-grid > div { padding: 8px 0; border-left: 0; border-top: 1px solid var(--board-line); }
  .board-grid > div:first-child { border-top: 0; }
}
@media (max-width: 600px) {
  h1 { font-size: 24px; }
  .win-title .where { display: none; }
  .win-title .who { white-space: nowrap; }
  .g2, .g3, .g4, .rules 
  .pv-ctl { width: 100%; }
  .cert .c-grid { grid-template-columns: minmax(0, 1fr); }
  .cert .c-title { font-size: 26px; letter-spacing: .1em; }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .kv dd { margin-bottom: 8px; }
  .person { grid-template-columns: 36px minmax(0, 1fr); }
  .person > :last-child { grid-column: 1 / -1; }
  .ticket { grid-template-columns: minmax(0, 1fr); }
  .ticket .tn { border-right: 0; border-bottom: 2px dashed var(--line-strong); padding: 0 0 10px; }
  .ticket::before, .ticket::after { display: none; }
}
@media (max-width: 700px) {
  .step:not(.cur) .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

<body>
<div id="root"></div>
<script>
/* js/util.js */
/* IC-Behördenportal · Grundfunktionen
   Alles läuft ohne Build-Schritt und ohne externe Bibliotheken (NUI-tauglich). */
(function () {
  'use strict';
  const IC = (window.IC = window.IC || {});

  /* ---------- Sicheres HTML-Templating ----------
     Jeder interpolierte Wert wird escaped, außer er stammt aus html`` oder raw(). */
  class Safe {
    constructor(s) { this.s = s; }
    toString() { return this.s; }
  }
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ESC[c]);
  function part(v) {
    if (v == null || v === false || v === true) return '';
    if (v instanceof Safe) return v.s;
    if (Array.isArray(v)) return v.map(part).join('');
    return esc(v);
  }
  function html(strings, ...vals) {
    let out = strings[0];
    for (let i = 0; i < vals.length; i++) out += part(vals[i]) + strings[i + 1];
    return new Safe(out);
  }
  const raw = (s) => new Safe(String(s));

  /* ---------- Zeit und Zahlen ---------- */
  const MIN = 60000, HOUR = 3600000, DAY = 86400000;
  /* Die Vorschau kann die Uhr vorspulen (Termine erreichen, Fristen ablaufen lassen). Im Spiel bleibt der Offset 0. */
  const clock = { offset: 0 };
  const now = () => Date.now() + clock.offset;
  const nfMoney = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 });
  const money = (n) => '$' + nfMoney.format(Math.round(n || 0));
  const pad = (n) => String(n).padStart(2, '0');
  const ftime = (ts) => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const WDL = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  const fdate = (ts) => { const d = new Date(ts); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear(); };
  const fday = (ts) => { const d = new Date(ts); return WD[d.getDay()] + ', ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.'; };
  const fdaylong = (ts) => { const d = new Date(ts); return WDL[d.getDay()] + ', ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear(); };
  const fdt = (ts) => fdate(ts) + ' · ' + ftime(ts);
  const startOfDay = (ts) => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
  function rel(ts, ref) {
    ref = ref || now();
    const d = ts - ref, a = Math.abs(d);
    let t;
    if (a < MIN) t = 'jetzt';
    else if (a < HOUR) t = Math.round(a / MIN) + ' Min.';
    else if (a < DAY) t = Math.round(a / HOUR) + ' Std.';
    else t = Math.round(a / DAY) + ' Tg.';
    if (t === 'jetzt') return t;
    return d >= 0 ? 'in ' + t : 'vor ' + t;
  }
  function dur(ms) {
    const a = Math.abs(ms);
    if (a < HOUR) return Math.max(1, Math.round(a / MIN)) + ' Min.';
    if (a < DAY) return Math.round(a / HOUR) + ' Std.';
    return Math.round(a / DAY) + ' Tg.';
  }
  const siteLabel = (p) => (!p ? '–' : p.mode === 'mobil' ? 'Ohne festen Standort' : (p.label || '–'));
  const initials = (name) => String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((s) => s[0].toUpperCase()).join('');
  const plural = (n, one, many) => (n === 1 ? one : many);
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

  /* ---------- Pfadzugriff (data-bind="wiz.name") ---------- */
  function getPath(obj, path) {
    return String(path).split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
  }
  function setPath(obj, path, val) {
    const keys = String(path).split('.');
    let o = obj;
    for (let i = 0; i < keys.length - 1; i++) {
      if (o[keys[i]] == null || typeof o[keys[i]] !== 'object') o[keys[i]] = {};
      o = o[keys[i]];
    }
    o[keys[keys.length - 1]] = val;
  }

  /* ---------- Icons (Strichsymbole, 24er Raster) ---------- */
  const ICONS = {
    building: '<path d="M4 21V5l8-3 8 3v16"/><path d="M9 21v-5h6v5"/><path d="M8 9h2M14 9h2M8 13h2M14 13h2"/>',
    doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/>',
    users: '<circle cx="9" cy="8" r="3"/><path d="M3 20v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14a4 4 0 0 1 4 4v2"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    coin: '<circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1.1 0-2.1-.6-2.5-1.5M12 6v2M12 16v2"/>',
    pin: '<path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/>',
    bell: '<path d="M6 17v-6a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>',
    alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/>',
    stamp: '<rect x="4" y="17" width="16" height="3"/><path d="M7 17c0-4 2-4 2-7a3 3 0 1 1 6 0c0 3 2 3 2 7"/>',
    list: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    back: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    minus: '<path d="M5 12h14"/>',
    ticket: '<path d="M3 8a2 2 0 0 1 0 0V6h18v2a2 2 0 0 0 0 8v2H3v-2a2 2 0 0 0 0-8z"/><path d="M14 6v2M14 11v2M14 16v2"/>',
    folder: '<path d="M3 6h6l2 2h10v11H3z"/>',
    flag: '<path d="M5 21V4M5 5h12l-2 4 2 4H5"/>',
    eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
    book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',
    chart: '<path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3"/>',
    key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
    home: '<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
    refresh: '<path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/>',
    moon: '<path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
    chev: '<path d="M9 6l6 6-6 6"/>',
    play: '<path d="M7 4l13 8-13 8z"/>',
    pause: '<path d="M8 5v14M16 5v14"/>',
    phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
    scale: '<path d="M12 4v16M7 20h10M4 7h16"/><path d="M4 7l-2.5 6h5zM20 7l-2.5 6h5z"/>',
    badge: '<circle cx="12" cy="9" r="5"/><path d="M8.5 13L7 21l5-3 5 3-1.5-8"/>',
    tool: '<path d="M14 6a4 4 0 0 0 5 5l-9 9a2.1 2.1 0 0 1-3-3l9-9a4 4 0 0 0-2-2z"/>',
    layers: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 7l9 6 9-6"/>',
  };
  function ico(name, cls) {
    const body = ICONS[name] || ICONS.info;
    return raw('<svg class="ico' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + body + '</svg>');
  }

  /* ---------- DOM-Helfer ---------- */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* Speicher gesperrt, egal */ } };

  /* ---------- Namensregeln (identisch zum Server) ---------- */
  const UMLAUT = { 'ä': 'ae', 'ö': 'oe', 'ü': 'ue', 'ß': 'ss', 'é': 'e', 'è': 'e', 'á': 'a', 'à': 'a', 'ó': 'o', 'ñ': 'n', 'ç': 'c' };
  const LEET = { '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't', '@': 'a', '$': 's' };
  const FORM_SUFFIX = /\b(gmbh|gbr|ug|ag|e\.?\s?v\.?|ev|ohg|kg|eg|stiftung)\b\.?\s*$/i;
  function normName(name) {
    let s = String(name || '').toLowerCase().trim();
    s = s.replace(FORM_SUFFIX, '').trim();
    s = s.replace(/[äöüßéèáàóñç]/g, (c) => UMLAUT[c]);
    s = s.replace(/[013457@$]/g, (c) => LEET[c]);
    return s.replace(/[^a-z]/g, '');
  }
  function lev(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[b.length];
  }

  Object.assign(IC, {
    Safe, html, raw, esc, MIN, HOUR, DAY, clock, now, money, pad, ftime, fdate, fday, fdaylong, fdt, startOfDay, rel, dur,
    siteLabel, initials, plural, clamp, clone, sleep, debounce, getPath, setPath, ICONS, ico, $, $$, lsGet, lsSet, normName, lev,
  });
})();

/* js/labels.js */
/* IC-Behördenportal · Beschriftungen und Statusmodelle (nur Anzeige, die Regeln liegen auf dem Server) */
(function () {

  const IC = window.IC;

  /* Antragsstatus: label, chip-Art, aktuelle Phase (0..4), negativ = beendet ohne Eintragung */
  const APP = {

  const OPEN_APP = ['eingereicht', 'nachbesserung', 'vorpruefung_ok', 'termin_gebucht', 'termin_laeuft', 'staff_pruefung', 'einspruch'];
  const PHASES = ['Einreichung', 'Vorprüfung', 'Termin', 'Entscheidung', 'Eintragung'];

  const APPT = {

  const ORG = {

    probezeit: { label: 'Probezeit',   kind: 'info' },
    ruhend:    { label: 'Ruhend',      kind: 'warn' },
    gesperrt:  { label: 'Gesperrt',    kind: 'bad' },
    aufgeloest:{ label: 'Aufgelöst',   kind: '' },
  };

  const DECISION = {
    genehmigt: { label: 'Genehmigt',               kind: 'ok',   stamp: 'ok',   word: 'Genehmigt' },
    auflagen:  { label: 'Genehmigt mit Auflagen',  kind: 'warn', stamp: 'warn', word: 'Mit Auflagen' },
    vertagt:   { label: 'Vertagt (Nachbesserung)', kind: 'warn', stamp: 'blue', word: 'Vertagt' },
    abgelehnt: { label: 'Abgelehnt',               kind: 'bad',  stamp: 'bad',  word: 'Abgelehnt' },
  };

  const RANK = {
    anwaerter:      { label: 'Anwärter',        level: 0 },
    sachbearbeiter: { label: 'Sachbearbeiter',  level: 1 },
    amtsleiter:     { label: 'Amtsleiter',      level: 2 },

  };

  const MEMBER_ROLE = {
    inhaber: 'Inhaber', geschaeftsfuehrer: 'Geschäftsführer', gesellschafter: 'Gesellschafter',
    vorsitz: 'Vorsitz', stellv: 'Stellv. Vorsitz', kasse: 'Kassenführung', mitglied: 'Mitglied',
  };

  const SANCTION = {
    verwarnung: 'Verwarnung', bussgeld: 'Bußgeld', auflage: 'Neue Auflage', untersagung: 'Befristete Gewerbeuntersagung', entzug: 'Entzug der Eintragung',

  IC.L = { APP, OPEN_APP, PHASES, APPT, ORG, DECISION, RANK, MEMBER_ROLE, SANCTION };
})();

/* js/ui.js */
/* IC-Behördenportal · Wiederverwendbare Oberflächenbausteine */
(function () {
  'use strict';
  const IC = window.IC;
  const { html, raw, ico } = IC;
  const L = IC.L;
  const c = (IC.c = {});

  /* ---------- Kleinteile ---------- */
  c.chip = (text, kind, icon) => html`<span class="chip ${kind || ''}">${icon ? ico(icon) : ''}${text}</span>`;
  c.appChip = (status) => { const s = L.APP[status] || { label: status, kind: '' }; return c.chip(s.label, s.kind); };
  c.apptChip = (status) => { const s = L.APPT[status] || { label: status, kind: '' }; return c.chip(s.label, s.kind); };
  c.orgChip = (status) => { const s = L.ORG[status] || { label: status, kind: '' }; return c.chip(s.label, s.kind); };
  c.tag = (t) => html`<span class="tag">${t}</span>`;
  c.badge = (n, kind) => html`<span class="badge ${kind || ''}">${n}</span>`;
  c.avatar = (name) => html`<span class="avatar" aria-hidden="true">${IC.initials(name)}</span>`;

  c.callout = (kind, title, body, icon, actions) => {
    const dflt = { info: 'info', ok: 'check', warn: 'alert', bad: 'alert' }[kind] || 'info';
    return html`<div class="callout ${kind}">${ico(icon || dflt)}<div class="grow"><div class="t">${title}</div>${body ? html`<div>${body}</div>` : ''}${actions ? html`<div class="btn-row" style="margin-top:8px">${actions}</div>` : ''}</div></div>`;
  };

  c.sheet = (title, body, o) => {
    o = o || {};
    return html`<section class="sheet"${o.id ? raw(' id="' + o.id + '"') : ''}>
      <div class="sheet-h">${o.icon ? ico(o.icon) : ''}<h3>${title}</h3><span class="sp"></span>${o.actions || ''}</div>
      <div class="sheet-b${o.flush ? ' flush' : ''}">${body}</div>
      ${o.footer ? html`<div class="sheet-f">${o.footer}</div>` : ''}
    </section>`;
  };

  c.empty = (icon, title, text, action) => html`<div class="empty">${ico(icon)}<h3>${title}</h3>${text ? html`<p>${text}</p>` : ''}${action || ''}</div>`;

  c.kv = (pairs) => html`<dl class="kv">${pairs.filter(Boolean).map((p) => html`<dt>${p[0]}</dt><dd>${p[1]}</dd>`)}</dl>`;

  c.meter = (used, cap) => {
    const pct = cap ? Math.min(100, Math.round((used / cap) * 100)) : 100;
    const cls = used >= cap ? 'full' : used / cap >= 0.75 ? 'warn' : '';
    return html`<div class="meter ${cls}" role="img" aria-label="${used} von ${cap} belegt"><i style="width:${pct}%"></i></div>`;
  };

  c.stamp = (kind, word, anim) => html`<span class="stamp ${kind}${anim ? ' anim' : ''}">${word}</span>`;

  c.person = (p, right, meta) => html`<div class="person">${c.avatar(p.name)}<div class="grow"><div class="pn">${p.name}</div><div class="pm">${meta || ''}</div></div><div>${right || ''}</div></div>`;

  /* ---------- Zeitleiste und Phasen ---------- */
  const TL = {
    eingereicht: ['doc', ''], vorpruefung_ok: ['check', 'ok'], nachbesserung: ['edit', 'warn'], termin_gebucht: ['calendar', ''],
    termin_laeuft: ['users', ''], staff_pruefung: ['shield', ''], genehmigt: ['check', 'ok'], abgelehnt: ['x', 'bad'],
    einspruch: ['scale', 'warn'], zurueckgezogen: ['x', ''], abgelaufen: ['clock', ''],
  };
  c.timeline = (events, terminal) => {
    const list = events.slice().sort((a, b) => a.ts - b.ts);
    return html`<ol class="timeline">${list.map((e, i) => {
      const t = TL[e.status] || ['info', ''];
      const cur = i === list.length - 1 && !terminal ? ' cur' : '';
      return html`<li class="tl-item ${t[1]}${cur}"><span class="tl-dot">${ico(t[0])}</span><div>
        <div class="tl-t">${e.text}</div>
        <div class="tl-m">${e.actor} · ${IC.fdt(e.ts)}</div>
        ${e.note ? html`<div class="tl-n">${e.note}</div>` : ''}
      </div></li>`;
    })}</ol>`;
  };

  c.phases = (app) => {
    const st = L.APP[app.status] || { cur: 0 };
    return html`<div class="phases" role="img" aria-label="Fortschritt: ${(L.APP[app.status] || {}).label || ''}">${L.PHASES.map((name, i) => {
      let cls = '';
      if (st.neg && i === st.cur) cls = st.kind === 'bad' ? 'bad' : '';
      else if (i < st.cur) cls = 'done';
      else if (i === st.cur) cls = 'cur';
      return html`<div class="phase ${cls}"><i></i>${name}</div>`;
    })}</div>`;
  };

  /* ---------- Gewerbeschein / Urkunde ---------- */
  function checksum(str) {
    let h = 7;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 1679616;

        <div><b>${isOrg ? 'Prüfung bis' : 'Gültig bis'}</b>${IC.fdate(e.validUntil)}</div>

  /* ---------- Toast ---------- */
  IC.toast = function (text, kind) {
    let wrap = document.getElementById('toasts');
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.id = 'toasts';
      wrap.className = 'toasts';
      wrap.setAttribute('role', 'status');
      wrap.setAttribute('aria-live', 'polite');
      document.body.appendChild(wrap);
    }
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.innerHTML = String(html`${ico(kind === 'ok' ? 'check' : kind === 'bad' || kind === 'warn' ? 'alert' : 'info')}<div>${text}</div>`);
    wrap.appendChild(el);
    while (wrap.children.length > 4) wrap.removeChild(wrap.firstChild);
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, kind === 'bad' ? 7000 : 4800);
  };

  const modal = (IC.modal = { cur: null, resolve: null });
  modal.open = function (o) {
    modal.close(true);
    const ov = document.createElement('div');
    ov.className = 'modal-ov';
    ov.id = 'modal-ov';
    ov.innerHTML = String(html`<div class="modal${o.wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-title">

      <div class="modal-b" id="modal-b">${o.body}</div>
      ${o.footer ? html`<div class="modal-f" id="modal-f">${o.footer}</div>` : ''}
    </div>`);
    document.body.appendChild(ov);
    modal.cur = o;
    const focusEl = ov.querySelector('[autofocus]') || ov.querySelector('textarea, input, select, .btn.primary, .btn');
    if (focusEl) setTimeout(() => focusEl.focus(), 30);
    if (o.onOpen) o.onOpen(ov);
  };
  modal.close = function (silent) {
    const ov = document.getElementById('modal-ov');
    if (ov && ov.parentNode) ov.parentNode.removeChild(ov);
    const cur = modal.cur, res = modal.resolve;
    modal.cur = null; modal.resolve = null;
    if (!silent && cur && cur.onClose) cur.onClose();
    if (res) res(false);
  };
  IC.confirm = function (o) {
    return new Promise((resolve) => {
      modal.open({
        title: o.title, icon: o.icon || 'alert',
        body: html`<div class="stack sm"><p>${o.text}</p>${o.extra || ''}</div>`,
        footer: html`<button class="btn" data-act="modal-close">${o.cancel || 'Abbrechen'}</button><button class="btn ${o.danger ? 'danger solid' : 'primary'}" data-act="modal-yes">${o.yes || 'Bestätigen'}</button>`,
      });
      modal.resolve = resolve;
    });
  };
  modal.yes = function () { const res = modal.resolve; modal.resolve = null; modal.close(true); if (res) res(true); };

  /* ---------- Formularhilfen ---------- */
  c.field = (id, label, control, o) => {
    o = o || {};
    return html`<div class="field"><label for="${id}">${label}${o.req ? html` <span class="muted">(Pflicht)</span>` : ''}</label>${control}${o.hint ? html`<div class="hint">${o.hint}</div>` : ''}${o.msg || ''}</div>`;

  c.counter = (len, min) => html`<div class="counter ${len >= min ? 'ok' : ''}">${len} / mind. ${min} Zeichen</div>`;
})();

/* js/mock.js */
/* IC-Behördenportal · Mock-Backend (nur für die Vorschau im Browser)
   Bildet die Regeln aus docs/KONZEPT.md nach. Im Spiel ersetzt der Server dieses Modul vollständig. */
(function () {
  'use strict';
  const IC = window.IC;
  const L = IC.L, cfg = IC.mockConfig, R = cfg.rules;
  const { MIN, HOUR, DAY } = IC;
  const now = () => IC.now();

  let s = IC.mockSeed();

  /* ---------- Helfer ---------- */
  const form = (k) => cfg.legalForms.find((f) => f.key === k);
  const branchOf = (k) => cfg.branches.find((b) => b.key === k);
  const typeOf = (k) => cfg.appointmentTypes.find((t) => t.key === k);
  const lvl = (rank) => L.RANK[rank].level;
  const ok = (o) => Object.assign({ ok: true }, o || {});
  const fail = (error, o) => Object.assign({ ok: false, error }, o || {});
  const pad4 = (n) => String(n).padStart(4, '0');
  const nextNo = (key) => s.seq[key]++;
  const isOpenApp = (a) => L.OPEN_APP.includes(a.status);
  const appById = (id) => s.applications.find((a) => a.id === id);
  const apptById = (id) => s.appointments.find((a) => a.id === id);
  const entById = (id) => s.entities.find((e) => e.id === id);
  const OPEN_APPT = ['gebucht', 'eingecheckt', 'aufgerufen', 'laeuft'];
  const audit = (actor, kind, action, target, detail) => s.audit.unshift({ ts: now(), actor, kind, action, target, detail });
  const notice = (text, kind) => s.notices.push({ id: ++s.noticeSeq, ts: now(), text, kind: kind || 'info' });
  const lastTs = (a) => (a.events.length ? a.events[a.events.length - 1].ts : a.createdAt);
  const pushEvent = (a, status, actor, actorKind, text, note) => a.events.push({ ts: now(), status, actor, actorKind, text, note: note || null });
  const mine = (a) => a.applicant.charId === s.me.charId || a.founders.some((f) => f.charId === s.me.charId);
  const stripOoc = (a) => { const c = IC.clone(a); delete c.ooc; return c; };
  const delay = () => IC.sleep(60 + Math.random() * 90);

  function withSuffix(name, f) {
    const suf = f && f.suffix;
    if (!suf) return name;
    const n = name.trim();
    return n.toLowerCase().endsWith(suf.toLowerCase()) ? n : n + ' ' + suf;
  }

  /* ---------- Dienst und Verfügbarkeit ---------- */
  function dutyList() {
    const list = cfg.officials.slice(0, s.officialsOthers).map((o, i) => Object.assign({}, o, { desk: i + 1 }));
    if (s.meOfficial.state === 'on') list.push(Object.assign({}, s.meOfficial));
    return list;
  }
  function eligibleOfficials(type) { return dutyList().filter((o) => lvl(o.rank) >= lvl(type.minRank)); }
  const eligibleCount = (type) => eligibleOfficials(type).length;
  function officialById(id) {
    if (id === s.meOfficial.id) return s.meOfficial;
    return cfg.officials.find((o) => o.id === id);
  }

  /* ---------- Voraussetzungen ---------- */
  function activeStrikes() {
    return s.me.strikes.filter((ts) => now() - ts < R.strikeDays * DAY);
  }
  function banUntil() {
    const a = activeStrikes();
    if (a.length < R.strikeLimit) return null;
    const until = Math.max.apply(null, a) + R.banDays * DAY;
    return until > now() ? until : null;
  }
  function eligibility(p, kind, isMe, excludeAppId) {
    const open = s.applications.filter((a) => isOpenApp(a) && a.applicant.charId === p.charId && a.id !== excludeAppId).length;
    const checks = [
      { key: 'id', ok: !!p.hasId, text: 'Gültiger Personalausweis' },
      { key: 'age', ok: p.age >= R.minAge, text: 'Mindestalter ' + R.minAge + ' Jahre (IC)' },
      { key: 'play', ok: p.playHours >= R.minPlayHours, text: 'Mindestens ' + R.minPlayHours + ' Stunden Spielzeit mit diesem Charakter' },
    ];
    if (isMe) {
      const b = banUntil();
      checks.push({ key: 'ban', ok: !b, text: b ? 'Terminsperre bis ' + IC.fdt(b) : 'Keine Terminsperre' });
      checks.push({ key: 'apps', ok: open < R.maxOpenApplications, text: 'Offene Anträge: ' + open + ' von ' + R.maxOpenApplications });
      if (kind === 'fraktion') {
        const n = s.entities.filter((e) => e.myOwn && e.kind === 'fraktion' && e.status !== 'aufgeloest').length;
        checks.push({ key: 'orgs', ok: n < R.maxOrgs, text: 'Organisationen als Gründer: ' + n + ' von ' + R.maxOrgs });
      } else {
        const n = s.entities.filter((e) => e.myOwn && e.kind === 'unternehmen' && e.status !== 'aufgeloest').length;
        checks.push({ key: 'companies', ok: n < R.maxCompanies, text: 'Aktive Unternehmen als Inhaber: ' + n + ' von ' + R.maxCompanies });
      }
    }
    return { ok: checks.every((c) => c.ok), checks };
  }

  /* ---------- Namensprüfung ---------- */
  function nameCheck(nameIn, legalForm, ignoreAppId) {
    const raw = String(nameIn || '').trim();
    const issues = [];
    const err = (code, text) => issues.push({ level: 'error', code, text });
    const warn = (code, text) => issues.push({ level: 'warn', code, text });
    if (raw.length < 3) err('short', 'Der Name braucht mindestens 3 Zeichen.');
    if (raw.length > 40) err('long', 'Der Name darf höchstens 40 Zeichen lang sein.');
    if (raw && !/^[A-Za-zÄÖÜäöüß0-9 &'.\-]+$/.test(raw)) err('chars', "Erlaubt sind Buchstaben, Ziffern, Leerzeichen und die Zeichen & ' . -");
    const n = IC.normName(raw);
    if (raw.length >= 3 && n.length < 3) err('short', 'Der Name enthält zu wenige Buchstaben.');
    if (n.length >= 3) {
      s.staff.blacklist.forEach((b) => {
        const bn = IC.normName(b.term);
        if (bn && n.indexOf(bn) !== -1) err('blacklist', 'Der Begriff „' + b.term + '“ ist gesperrt (' + b.reason + ').');
      });
      s.entities.forEach((e) => {
        if (e.status === 'aufgeloest') return;
        const en = IC.normName(e.name);
        if (en === n) err('taken', 'Der Name ist bereits im Register eingetragen (' + e.regNo + ').');
        else if (IC.lev(n, en) <= 1) err('similar', 'Zu ähnlich zu „' + e.name + '“ (' + e.regNo + '). Verwechslungsgefahr.');
        else if (IC.lev(n, en) === 2) warn('similar', 'Ähnlich zu „' + e.name + '“. Die Beamten prüfen die Verwechslungsgefahr.');
      });
      s.applications.forEach((a) => {
        if (!isOpenApp(a) || a.id === ignoreAppId) return;
        const an = IC.normName(a.name);
        if (an === n) err('reserved', 'Der Name ist für einen laufenden Antrag reserviert (' + a.caseNo + ').');
        else if (IC.lev(n, an) <= 1) err('similar', 'Zu ähnlich zu einem laufenden Antrag („' + a.name + '“).');
      });
    }
    const display = raw ? withSuffix(raw, form(legalForm)) : '';
    return { ok: !issues.some((i) => i.level === 'error'), normalized: n, display, issues };
  }

  /* ---------- Gebühren ---------- */
  function feesOf(legalForm, branch) {
    const f = form(legalForm);
    const b = branch ? branchOf(branch) : null;
    const k = b ? b.factor : 1;
    const apply = Math.round(f.feeApply * k), register = Math.round(f.feeRegister * k), capital = f.capital;
    return { apply, register, capital, payNow: apply + register + capital, refundable: register + capital };
  }
  const staffGateNeeded = (a) => {
    const b = a.branch ? branchOf(a.branch) : null;
    return !!((b && b.staffGate) || (a.ooc && a.ooc.category === 'untergrund'));
  };
  function branchUsed(key) {
    return s.entities.filter((e) => e.branch === key && e.status !== 'aufgeloest').length
      + s.applications.filter((a) => a.branch === key && ['staff_pruefung'].includes(a.status)).length;
  }
  const branchCap = (b) => (s.staff.capOverrides[b.key] != null ? s.staff.capOverrides[b.key] : b.cap);
  function propertyTaken(id) {
    const p = cfg.properties.find((x) => x.id === id);
    if (!p || p.status !== 'frei') return true;
    return s.applications.some((a) => isOpenApp(a) && a.property && a.property.id === id) || s.entities.some((e) => e.propertyId === id && e.status !== 'aufgeloest');
  }

  /* ---------- Eintragung ---------- */
  function registerEntity(a, via) {
    const f = form(a.legalForm);
    s.seq.reg[f.register] = (s.seq.reg[f.register] || 0) + 1;
    const regNo = f.register + ' ' + pad4(s.seq.reg[f.register]);
    const conds = (a.decision && a.decision.conditions) || [];
    const ent = {
      id: 'E-' + nextNo('entity'), kind: a.kind, regNo, name: a.name, legalForm: a.legalForm, branch: a.branch,
      status: conds.length ? 'probezeit' : 'aktiv', hq: IC.siteLabel(a.property), propertyId: a.property ? a.property.id : null,
      owner: a.founders[0].name, signedBy: via || (a.decision && a.decision.by) || 'Registerführung', founded: now(), validUntil: now() + R.certDays * DAY, memberCount: a.founders.length,
      members: a.founders.map((x) => ({ name: x.name, role: x.role, share: x.share })),
      conditions: conds.map((text) => ({ id: 'C-' + nextNo('cond'), text, due: now() + 14 * DAY, done: false })),
      legacy: false, myOwn: a.founders.some((x) => x.charId === s.me.charId), applicationId: a.id,
      ooc: a.ooc ? Object.assign({}, a.ooc) : null,
    };
    s.entities.push(ent);
    s.treasury += a.fees.register;
    a.status = 'genehmigt';
    a.entityId = ent.id;
    pushEvent(a, 'genehmigt', via || 'System', via ? 'staff' : 'system', 'Eintragung vollzogen', 'Registernummer ' + regNo + '. Der Gewerbeschein wurde ausgestellt.');
    audit('System', 'system', 'Eintragung', regNo, ent.name + ' eingetragen');
    if (a.ooc && a.ooc.category === 'untergrund') s.staff.undergroundCap.used++;
    if (ent.myOwn) notice('„' + ent.name + '“ ist eingetragen. Registernummer ' + regNo + '.', 'ok');
    return ent;
  }
  function refund(a) {
    if (!a.fees || !a.fees.paid) return 0;
    const back = a.fees.register + a.fees.capital;
    if (a.applicant.charId === s.me.charId) s.me.bank += back;
    a.fees.refunded = back;
    return back;
  }

  /* ---------- Zeitliche Übergänge (Ausfälle, Fristen) ---------- */
  function tick() {
    const t = now();
    s.appointments.forEach((ap) => {
      if (['gebucht', 'eingecheckt'].indexOf(ap.status) === -1) return;
      if (t <= ap.start + R.checkinAfter * MIN) return;
      if (eligibleCount(typeOf(ap.typeId)) > 0) return;
      ap.status = 'beamter_ausfall';
      const a = ap.applicationId ? appById(ap.applicationId) : null;
      if (a && a.status === 'termin_gebucht') {
        a.status = a.restoreStatus || 'vorpruefung_ok';
        a.priority = true;
        pushEvent(a, a.status, 'System', 'system', 'Termin ausgefallen: kein Beamter im Dienst', 'Ein Ersatztermin kann mit Vorrang gebucht werden.');
      }
      audit('System', 'system', 'Beamten-Ausfall', ap.id, 'Kein Beamter zum Terminbeginn im Dienst, kein Strike');
      if (ap.booker === s.me.charId) notice('Ihr Termin um ' + IC.ftime(ap.start) + ' Uhr ist ausgefallen, weil kein Beamter im Dienst war. Sie erhalten Vorrang bei einem Ersatztermin.', 'warn');
    });
    s.applications.forEach((a) => {
      if (a.status === 'nachbesserung' && t > lastTs(a) + R.fixDays * DAY) {
        refund(a);
        a.status = 'abgelaufen'; pushEvent(a, 'abgelaufen', 'System', 'system', 'Frist zur Nachbesserung abgelaufen', 'Verwahrte Beträge wurden erstattet, die Antragsgebühr nicht.');
      } else if (a.status === 'vorpruefung_ok' && t > (a.vorpruefungAt || lastTs(a)) + R.bookDays * DAY) {
        refund(a);
        a.status = 'abgelaufen'; pushEvent(a, 'abgelaufen', 'System', 'system', 'Kein Termin innerhalb von ' + R.bookDays + ' Tagen gebucht', 'Verwahrte Beträge wurden erstattet, die Antragsgebühr nicht.');
      }
    });
  }

  /* ---------- Slots ---------- */
  function slotsFor(type, dayOffset, excludeApptId) {
    const t0 = now();
    const dayStart = IC.startOfDay(t0 + dayOffset * DAY);
    const dayEnd = IC.startOfDay(dayStart + 30 * HOUR);
    const step = R.slotStep * MIN, len = type.minutes * MIN, lead = R.leadMinutes * MIN;
    const liveOff = eligibleOfficials(type);
    const out = [];
    for (let st = dayStart; st < dayEnd; st += step) {
      if (st < t0 + lead) continue;
      const set = {};
      let live = false;
      if (st <= t0 + R.liveHorizon * MIN) liveOff.forEach((o) => { set[o.id] = 1; live = true; });
      s.officeHours.forEach((h) => {
        const o = officialById(h.officialId);
        if (!o || lvl(o.rank) < lvl(type.minRank)) return;
        if (h.types && h.types.indexOf(type.key) === -1) return;
        if (h.start <= st && st + len <= h.end) set[h.officialId] = 1;
      });
      const cap = Object.keys(set).length;
      if (!cap) continue;
      let booked = 0;
      s.appointments.forEach((ap) => {
        if (OPEN_APPT.indexOf(ap.status) === -1 || ap.id === excludeApptId) return;
        if (ap.start < st + len && ap.start + ap.minutes * MIN > st) booked++;
      });
      out.push({ start: st, end: st + len, cap, booked, free: Math.max(0, cap - booked), source: live ? 'live' : 'plan' });
    }
    return out;
  }

  function nextFree() {
    const type = typeOf('beratung');
    for (let d = 0; d <= R.bookAheadDays; d++) {
      const f = slotsFor(type, d).find((x) => x.free > 0);
      if (f) return f.start;
    }
    return null;
  }

  /* ---------- Antworten für die Oberfläche ---------- */
  function publicEntity(e) {
    return { id: e.id, regNo: e.regNo, name: e.name, kind: e.kind, legalForm: e.legalForm, branch: e.branch, status: e.status, hq: e.hq, owner: e.owner, founded: e.founded, memberCount: e.memberCount };
  }
  function viewAppt(ap) {
    const type = typeOf(ap.typeId);
    return Object.assign({}, ap, { typeLabel: type.label, end: ap.start + ap.minutes * MIN });
  }

  function bootstrap(p) {
    tick();
    const app = (p && p.app) || 'gewerbeamt';
    const t = now();
    const duty = dutyList();
    const branches = cfg.branches.map((b) => Object.assign({}, b, { cap: branchCap(b), used: branchUsed(b.key) }));
    const out = {
      ok: true, now: t,
      config: Object.assign({}, cfg, { branches }),
      me: Object.assign({}, s.me, { banUntil: banUntil(), activeStrikes: activeStrikes().length }),
      duty: { count: duty.length, officials: duty.map((o) => ({ id: o.id, name: o.name, rank: o.rank, desk: o.desk })), nextFree: nextFree(), othersSetting: s.officialsOthers },
      board: { calling: s.calling && t - s.calling.at < 10 * MIN ? s.calling : null, waiting: s.queue.length },
      myApplications: s.applications.filter(mine).map((a) => IC.clone(a)).sort((a, b) => lastTs(b) - lastTs(a)),
      myEntities: s.entities.filter((e) => e.myOwn).map((e) => IC.clone(e)),
      myAppointments: s.appointments.filter((a) => a.booker === s.me.charId || a.attendees.some((x) => x.charId === s.me.charId)).map(viewAppt).sort((a, b) => a.start - b.start),
      myTicket: s.myTicket ? Object.assign({}, s.myTicket, { position: s.queue.findIndex((q) => q.no === s.myTicket.no) + 1, called: !!(s.calling && s.calling.no === s.myTicket.no) }) : null,
      nearby: s.nearby.map((x) => Object.assign({}, x, { elig: eligibility(x, 'unternehmen', false) })),
      properties: cfg.properties.map((x) => Object.assign({}, x, { taken: propertyTaken(x.id) })),
      eligibility: { unternehmen: eligibility(s.me, 'unternehmen', true), fraktion: eligibility(s.me, 'fraktion', true) },
      notices: s.notices.slice(-6),
      settings: { undergroundViaPortal: s.staff.settings.undergroundViaPortal },
    };
    if (app === 'beamte') {
      const meO = s.meOfficial;
      const conflicts = (a) => (a.conflicts || []).indexOf(meO.id) !== -1;
      out.official = Object.assign({}, meO, { onDuty: meO.state === 'on', level: lvl(meO.rank) });
      out.officialApps = s.applications.map(stripOoc).filter((a) => !conflicts(a)).sort((a, b) => lastTs(b) - lastTs(a));
      out.officialAppts = s.appointments.map(viewAppt).sort((a, b) => a.start - b.start);
      out.queue = s.queue.slice();
      out.hours = s.officeHours.map((h) => Object.assign({}, h, { official: (officialById(h.officialId) || {}).name, mine: h.officialId === meO.id })).sort((a, b) => a.start - b.start);
      out.register = s.entities.map((e) => { const c = IC.clone(e); delete c.ooc; return c; });
      out.coworkers = duty.filter((o) => o.id !== meO.id);
    }
    if (app === 'staff') out.staff = staffOverview();
    return out;
  }

  function staffOverview() {
    const t = now();
    const apps = s.applications;
    const decided = apps.filter((a) => ['genehmigt', 'abgelehnt'].indexOf(a.status) !== -1);
    const rejected = decided.filter((a) => a.status === 'abgelehnt').length;
    const escalations = apps.filter((a) => a.status === 'vorpruefung_ok' && t - (a.vorpruefungAt || lastTs(a)) > R.escalateHours * HOUR);
    const gate = apps.filter((a) => a.status === 'staff_pruefung');
    const finished = s.appointments.filter((a) => ['abgeschlossen', 'nicht_erschienen', 'beamter_ausfall'].indexOf(a.status) !== -1);
    const noShow = finished.filter((a) => a.status === 'nicht_erschienen').length;
    const outage = finished.filter((a) => a.status === 'beamter_ausfall').length;
    const caps = cfg.branches.map((b) => ({ key: b.key, label: b.label, used: branchUsed(b.key), cap: branchCap(b) }));
    return {
      kpi: {
        open: apps.filter(isOpenApp).length,
        gate: gate.length,
        escalations: escalations.length,
        onDuty: dutyList().length,
        treasury: s.treasury,
        rejectionRate: decided.length ? Math.round((rejected / decided.length) * 100) : 18,
        noShowRate: finished.length ? Math.round((noShow / finished.length) * 100) : 8,
        outageRate: finished.length ? Math.round((outage / finished.length) * 100) : 3,
        throughputDays: 4.8,
        availabilityHours: 5.2,
      },
      gate: gate.map((a) => IC.clone(a)),
      escalations: escalations.map((a) => stripOoc(a)),
      caps, undergroundCap: s.staff.undergroundCap,
      blacklist: s.staff.blacklist.slice(),
      settings: Object.assign({}, s.staff.settings),
      audit: s.audit.slice(0, 80),
      applicationsAll: apps.map(stripOoc),
    };
  }

  /* ---------- Handler ---------- */
  const H = {};

  H.bootstrap = (p) => bootstrap(p);

  H.nameCheck = (p) => Object.assign({ ok: true }, nameCheck(p.name, p.legalForm, p.ignoreAppId));

  H.appSave = (p) => {
    const d = p.draft;
    let a = d.id ? appById(d.id) : null;
    if (!a) {
