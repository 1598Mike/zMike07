    const w = W();
    return w.ooc.category === 'untergrund'
      ? c.callout('warn', 'Untergrund-Gruppierung', 'Sie melden IC eine legale Hülle an (zum Beispiel einen Verein). Die Freischaltung der Fraktionsmechaniken erfolgt erst nach einer Schlussprüfung durch den Staff und hängt von freien Plätzen ab.')
      : html``;
  };

  function wizDone(w) {
    const dn = w.done;
    return html`<div class="stack lg">
      <div class="sheet"><div class="sheet-b" style="text-align:center;padding:38px 20px">
        ${c.stamp('blue', 'Eingereicht', true)}
        <h2 style="margin-top:22px">Antrag ${dn.caseNo} ist eingegangen</h2>
        <p class="muted" style="margin-top:6px">Der Name „${dn.name}“ ist ${S.d.config.rules.nameReserveDays} Tage für Sie reserviert. ${dn.paid ? money(dn.paid) + ' wurden von Ihrem Konto abgebucht.' : 'Es wurden keine weiteren Gebühren erhoben.'}</p>
      </div></div>
      ${c.sheet('Wie geht es weiter?', html`<ol class="timeline">
        <li class="tl-item cur"><span class="tl-dot">${ico('doc')}</span><div><div class="tl-t">Vorprüfung durch die Beamten</div><div class="tl-m">Ziel: innerhalb von 48 Stunden. Sie werden benachrichtigt.</div></div></li>
        <li class="tl-item todo"><span class="tl-dot">${ico('calendar')}</span><div><div class="tl-t">Vorstellungstermin im Bürgeramt buchen</div><div class="tl-m">Nur möglich, wenn Beamte im Dienst sind oder Sprechzeiten bestehen.</div></div></li>
        <li class="tl-item todo"><span class="tl-dot">${ico('users')}</span><div><div class="tl-t">Termin wahrnehmen und vorstellen</div><div class="tl-m">Alle Pflichtteilnehmer müssen anwesend sein.</div></div></li>
        <li class="tl-item todo"><span class="tl-dot">${ico('stamp')}</span><div><div class="tl-t">Entscheidung und Eintragung</div><div class="tl-m">Bei Genehmigung erhalten Sie Registernummer und Gewerbeschein.</div></div></li>
      </ol>`, { icon: 'list' })}
      <div class="btn-row"><button class="btn primary" data-act="app-open" data-id="${dn.id}">Antrag ansehen</button><button class="btn" data-act="wiz-restart">Weiteren Antrag stellen</button><button class="btn ghost" data-act="view" data-view="home">Zur Startseite</button></div>
    </div>`;
  }

  function wizard() {
    const w = W();
    if (w.done) return html`<div class="page-head"><div><div class="crumbs">Gewerbeamt · Gründung</div><h1>Antrag eingereicht</h1></div></div>${wizDone(w)}`;
    const labels = STEPS[w.kind || 'unternehmen'];
    const body = [stepArt, stepName, stepFounders, stepSite, stepConcept, stepReview][w.step](w);
    return html`
      <div class="page-head"><div><div class="crumbs">Gewerbeamt · Gründung${w.resubmit ? ' · Nachbesserung' : ''}</div><h1>${w.kind === 'fraktion' ? 'Organisation gründen' : w.kind === 'unternehmen' ? 'Unternehmen gründen' : 'Gründung starten'}</h1>
        <p class="sub">${w.resubmit ? 'Bitte überarbeiten Sie den Antrag entsprechend dem Hinweis der Beamten und reichen Sie ihn erneut ein.' : 'In sechs Schritten zum Antrag. Alle Eingaben werden sofort geprüft. Sie können jederzeit einen Entwurf speichern.'}</p></div></div>
      ${w.resubmit && S.ui.wizRemark ? c.callout('warn', 'Hinweis der Beamten', S.ui.wizRemark) : ''}
      <nav class="stepper" aria-label="Schritte">${labels.map((l, i) => html`${i ? html`<span class="step-link ${i <= w.step ? 'done' : ''}"></span>` : ''}<button class="step ${i < w.step ? 'done' : i === w.step ? 'cur' : ''}" data-act="wiz-goto" data-step="${i}" ${i > w.maxStep ? raw('disabled') : ''} ${i === w.step ? raw('aria-current="step"') : ''}><span class="sn">${i < w.step ? ico('check') : i + 1}</span><span class="hide-sm">${l}</span></button>`)}</nav>
      <div class="split">
        <div class="stack">
          ${c.sheet((w.step + 1) + '. ' + labels[w.step], html`<div class="stack">${body}</div>`, { icon: ['building', 'edit', 'users', 'pin', 'doc', 'stamp'][w.step] })}
          <div class="stack sm" data-partial="wiz-nav">${IC.partials['wiz-nav']()}</div>
        </div>
        <aside class="sticky" data-partial="wiz-side">${IC.partials['wiz-side']()}</aside>
      </div>`;
  }

  /* ----- Aktionen des Wizards ----- */
  const lightRefresh = () => IC.refresh('wiz-side', 'wiz-nav', 'wiz-share', 'wiz-c1');
  const nameTimer = { t: null };
  function runNameCheck() {
    const w = W();
    const key = w.name.trim() + '|' + w.legalForm;
    if (w.name.trim().length < 3) { w.nameResult = null; w.nameFor = null; IC.refresh('wiz-name', 'wiz-side', 'wiz-nav'); return; }
    IC.api('nameCheck', { name: w.name.trim(), legalForm: w.legalForm, ignoreAppId: w.id }).then((r) => {
      const cur = W();
      if (cur !== w || cur.name.trim() + '|' + cur.legalForm !== key) return;
      cur.nameResult = r; cur.nameFor = key;
      IC.refresh('wiz-name', 'wiz-side', 'wiz-nav');
    });
  }
  function evenShares(w) {
    if (w.kind !== 'unternehmen') return;
    const n = w.founders.length, base = Math.floor(100 / n);
    w.founders.forEach((x) => { x.share = base; });
    w.founders[0].share += 100 - base * n;
  }
  /* Fragt solange nach, bis jeder eingeladene Mitgründer geantwortet hat. Die Antwort kommt vom Server, nie aus dem Browser. */
  const pollTimer = { t: null };
  function pollFounders() {
    clearTimeout(pollTimer.t);
    const w = W();
    if (!w.founders.some((x) => x.consent === 'pending')) return;
    pollTimer.t = setTimeout(async () => {
      if (W() !== w || S.app !== 'gewerbeamt') return;
      const r = await IC.api('founderStatus', {});
      if (r && r.ok && W() === w) {
        let changed = false;
        w.founders.slice().forEach((f) => {
          const st = r.statuses[f.charId];
          if (f.consent !== 'pending') return;
          if (st === 'ok') { f.consent = 'ok'; changed = true; IC.toast(f.name + ' hat zugestimmt.', 'ok'); }
          else if (st === 'no' || st === 'expired') {
            w.founders = w.founders.filter((x) => x !== f); evenShares(w); changed = 'render';
            IC.toast(f.name + (st === 'no' ? ' hat die Einladung abgelehnt.' : ' hat nicht rechtzeitig geantwortet.'), 'warn');
          }
        });
        if (changed === 'render') IC.render(); else if (changed) IC.refresh('wiz-founders', 'wiz-side', 'wiz-nav');
      }
      pollFounders();
    }, 800);
  }

  function fixRoles(w) {
    if (w.kind !== 'unternehmen') return;
    const single = w.legalForm === 'einzel';
    w.founders.forEach((x, i) => {
      if (single) x.role = 'inhaber';
      else if (x.role === 'inhaber') x.role = i === 0 ? 'geschaeftsfuehrer' : 'gesellschafter';
    });
  }

  Object.assign(IC.act, {
    'wiz-start': (el) => { S.ui.wiz = newWiz(el.dataset.kind); S.ui.wizRemark = null; IC.view('wizard'); },
    'wiz-restart': () => { S.ui.wiz = newWiz(null); IC.view('wizard'); },
    'wiz-kind': (el) => {
      const w = W();
      if (w.kind === el.dataset.kind) return;
      const keep = { id: w.id };
      Object.assign(w, newWiz(el.dataset.kind), keep);
      IC.render();
    },
    'wiz-branch': (el) => { const w = W(); w.branch = el.dataset.key; IC.render(); },
    'wiz-form': (el) => {
      const w = W();
      w.legalForm = el.dataset.key;
      const f = formOf(w.legalForm);
      if (f.key === 'einzel') { w.founders = w.founders.slice(0, 1); w.founders[0].share = 100; }
      fixRoles(w); evenShares(w);
      w.nameResult = null; w.nameFor = null;
      IC.render();
      if (w.name.trim().length >= 3) runNameCheck();
    },
    'wiz-name-input': () => {
      const w = W();
      w.nameResult = null; w.nameFor = null;
      IC.refresh('wiz-name', 'wiz-side', 'wiz-nav');
      clearTimeout(nameTimer.t);
      nameTimer.t = setTimeout(runNameCheck, 280);
    },
    'wiz-light': lightRefresh,
    'wiz-ooc-cat': () => { IC.refresh('wiz-ooc-hint'); },
    'wiz-add-founder': async (el) => {
      const w = W();
      const p = S.d.nearby.find((x) => x.charId === el.dataset.id);
      if (!p || w.founders.some((x) => x.charId === p.charId)) return;
      const r = await IC.api('founderInvite', { charId: p.charId });
      if (!r.ok) { IC.toast(r.error || 'Die Einladung ist nicht möglich.', 'bad'); return; }
      w.founders.push({ charId: p.charId, name: p.name, role: w.kind === 'fraktion' ? 'mitglied' : 'gesellschafter', share: w.kind === 'fraktion' ? null : 0, consent: 'pending' });
      evenShares(w);
      IC.render();
      IC.toast('Einladung an ' + p.name + ' gesendet. Die Zustimmung kommt direkt vom Mitgründer.', '');
      pollFounders();
    },
    'wiz-remove-founder': (el) => {
      const w = W();
      const f = w.founders[Number(el.dataset.idx)];
      if (f && f.consent !== 'self') IC.api('founderCancel', { charId: f.charId });
      w.founders.splice(Number(el.dataset.idx), 1); evenShares(w); IC.render();
    },
    'wiz-even': () => { evenShares(W()); IC.render(); },
    'wiz-site-mode': (el) => { const w = W(); w.property = { mode: el.dataset.mode, id: null, label: '' }; IC.render(); },
    'wiz-prop': (el) => {
      const w = W();
      const p = S.d.properties.find((x) => x.id === el.dataset.id);
      w.property = { mode: 'immobilie', id: p.id, label: p.label + ', ' + p.district };
      IC.render();
    },
    'wiz-goto': (el) => { const w = W(); const n = Number(el.dataset.step); if (n <= w.maxStep) { w.step = n; IC.render(); } },
    'wiz-prev': () => { const w = W(); if (w.step > 0) { w.step--; IC.render(); } },
    'wiz-next': () => {
      const w = W();
      const iss = issues(w, w.step);
      if (iss.length) { IC.toast(iss[0], 'warn'); return; }
      w.step++; w.maxStep = Math.max(w.maxStep, w.step);
      IC.render();
      if (w.step === 1 && w.name.trim().length >= 3 && !w.nameResult) runNameCheck();
    },
    'wiz-save': async () => {
      const w = W();
      if (!w.kind) { IC.toast('Wählen Sie zuerst, was Sie gründen möchten.', 'warn'); return; }
      const r = await IC.run('appSave', { draft: draftOf(w) }, { ok: 'Entwurf gespeichert. Sie finden ihn unter „Meine Anträge“.', noReload: true });
      if (r.ok) { w.id = r.id; await IC.reload(); }
    },
    'wiz-submit': async () => {
      const w = W();
      const fe = fees(w);
      const pay = w.resubmit ? 0 : fe.payNow;
      const yes = await IC.confirm({
        title: 'Antrag verbindlich einreichen?', icon: 'stamp', yes: pay ? money(pay) + ' bezahlen und einreichen' : 'Erneut einreichen',
        text: pay ? 'Es werden ' + money(pay) + ' von Ihrem Konto abgebucht. Die Antragsgebühr von ' + money(fe.apply) + ' wird nicht erstattet. ' + money(fe.refundable) + ' erhalten Sie zurück, wenn der Antrag abgelehnt oder zurückgezogen wird.' : 'Der Antrag geht erneut zur Vorprüfung. Es entstehen keine weiteren Gebühren.',
      });
      if (!yes) return;
      w.errors = [];
      S.busy = true;
      const r = await IC.api('appSubmit', { draft: draftOf(w) });
      S.busy = false;
      if (!r.ok) {
        w.errors = r.errors || [{ text: r.error }];
        IC.toast(r.error || 'Das hat nicht geklappt.', 'bad');
        IC.refresh('wiz-nav');
        return;
      }
      w.done = { id: r.id, caseNo: r.caseNo, name: r.name, paid: r.paid };
      await IC.reload();
    },
    'wiz-edit': async (el) => {
      const a = S.d.myApplications.find((x) => x.id === el.dataset.id);
      if (!a) return;
      const w = newWiz(a.kind);
      const f = formOf(a.legalForm);
      Object.assign(w, {
        id: a.id, legalForm: a.legalForm, branch: a.branch, name: rawName(a.name || '', f), founders: IC.clone(a.founders).map((x) => Object.assign(x, { consent: x.charId === S.d.me.charId ? 'self' : 'ok' })),
        property: a.property ? IC.clone(a.property) : w.property, concept: a.concept ? IC.clone(a.concept) : w.concept, statute: a.statute ? IC.clone(a.statute) : w.statute, ooc: a.ooc ? IC.clone(a.ooc) : w.ooc,
        resubmit: a.status === 'nachbesserung', maxStep: 5, step: 0,
      });
      S.ui.wiz = w;
      S.ui.wizRemark = a.status === 'nachbesserung' ? a.remark : null;
      IC.view('wizard');
      runNameCheck();
    },
  });

  /* ====================================================================
     Meine Anträge
     ==================================================================== */
  function appDetail(a) {
    const d = S.d;
    const dec = a.decision;
    const canObject = a.status === 'abgelehnt' && a.objectionUntil > IC.now();
    const f = formOf(a.legalForm), b = a.branch ? branchOf(a.branch) : null;
    return html`<div class="stack">
      <div class="spread"><div><h2>${a.name || 'Entwurf'}</h2><div class="row sm" style="margin-top:6px">${a.caseNo ? c.tag(a.caseNo) : ''}${c.appChip(a.status)}${a.priority ? c.chip('Vorrang', 'info') : ''}</div></div></div>
      ${a.status !== 'entwurf' ? c.phases(a) : ''}
      ${a.status === 'nachbesserung' ? c.callout('warn', 'Nachbesserung erforderlich', a.remark, 'edit', html`<button class="btn sm primary" data-act="wiz-edit" data-id="${a.id}">Antrag bearbeiten</button>`) : ''}
      ${a.status === 'vorpruefung_ok' ? c.callout('ok', 'Vorprüfung bestanden', 'Buchen Sie jetzt Ihren Vorstellungstermin im Bürgeramt.', 'calendar', html`<button class="btn sm primary" data-act="app-book" data-id="${a.id}">Termin buchen</button>`) : ''}
      ${dec ? html`<div class="sheet"><div class="sheet-b"><div class="row top" style="gap:20px"><div class="grow">
          <h4>Bescheid</h4><p style="margin-top:6px">${dec.reason || 'Ohne Begründung genehmigt.'}</p>

      ${c.sheet('Angaben', c.kv([

      <div class="btn-row">${a.status === 'entwurf' ? html`<button class="btn primary" data-act="wiz-edit" data-id="${a.id}">Entwurf fortsetzen</button><button class="btn danger" data-act="app-withdraw" data-id="${a.id}">Entwurf löschen</button>` : ''}

        <div class="btn-row"><button class="btn primary" data-act="wiz-start" data-kind="unternehmen">${ico('plus')}Unternehmen</button><button class="btn" data-act="wiz-start" data-kind="fraktion">${ico('plus')}Organisation</button></div></div>
      ${list.length ? html`<div class="split" style="grid-template-columns:340px minmax(0,1fr)">

  Object.assign(IC.act, {

    'app-withdraw': async (el) => {
      const a = S.d.myApplications.find((x) => x.id === el.dataset.id);

        text: draft ? 'Der Entwurf wird endgültig gelöscht.' : 'Der Antrag wird beendet, der Name wird frei. Die Antragsgebühr' + (a.fees ? ' von ' + money(a.fees.apply) : '') + ' wird nicht erstattet' + (back ? ', ' + money(back) + ' erhalten Sie zurück.' : '.') });

      if (res.ok) { S.ui.regRows = res.rows; IC.refresh('reg-rows'); }

  /* ====================================================================
     Gebühren und Regeln

  function feesView() {

      ${c.sheet('Rechtsformen und Gebühren', html`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Rechtsform</th><th class="right">Mind. Gründer</th><th class="right">Antrag</th><th class="right">Eintragung</th><th class="right">Kapital</th><th>Register</th></tr></thead><tbody>${cfg().legalForms.map((f) => html`<tr><td><div class="strong">${f.label}</div><div class="sub">${f.kind === 'fraktion' ? 'Organisation' : 'Unternehmen'}</div></td><td class="right num">${f.minFounders}</td><td class="right num">${money(f.feeApply)}</td><td class="right num">${money(f.feeRegister)}</td><td class="right num">${f.capital ? money(f.capital) : '–'}</td><td>${c.tag(f.register)}</td></tr>`)}</tbody></table></div>`, { icon: 'coin', flush: true })}
      ${c.sheet('Branchen', html`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Branche</th><th>Standort</th><th>Zulassung</th><th>Prüfung</th><th class="right">Faktor</th><th>Plätze</th></tr></thead><tbody>${cfg().branches.map((b) => html`<tr><td><div class="strong">${b.label}</div><div class="sub">${b.desc}</div></td><td>${b.needsProperty ? 'Pflicht' : 'Optional'}</td><td>${b.authority || '–'}</td><td>${b.staffGate ? 'Schlussprüfung' : '–'}</td><td class="right num">×${String(b.factor).replace('.', ',')}</td><td style="min-width:150px">${c.meter(b.used, b.cap)}<span class="xs muted">${b.cap - b.used > 0 ? (b.cap - b.used) + ' von ' + b.cap + ' frei' : 'ausgelastet'}</span></td></tr>`)}</tbody></table></div>`, { icon: 'list', flush: true })}
      <div class="grid g2">

        ${c.sheet('Voraussetzungen und Grenzen', c.kv([

          ['Organisationen', 'höchstens ' + R.maxOrgs + ' als Gründer'], ['Offene Termine', 'höchstens ' + R.maxOpenAppointments],
          ['Strikes', R.strikeLimit + ' innerhalb von ' + R.strikeDays + ' Tagen führen zu ' + R.banDays + ' Tagen Sperre'],

})();

/* js/view-buerger.js */
/* IC-Behördenportal · Bürgeramt (Sicht der Bürger): Termine, Check-in, Wartenummer */
(function () {
  'use strict';
  const IC = window.IC;
  const { html, raw, ico, money } = IC;
  const c = IC.c, L = IC.L, S = IC.S;
  const cfg = () => S.d.config;
  const typeOf = (k) => cfg().appointmentTypes.find((t) => t.key === k);
  const pressed = (cond) => raw('aria-pressed="' + (cond ? 'true' : 'false') + '"');
  const OPEN = ['gebucht', 'eingecheckt', 'aufgerufen', 'laeuft'];

  const B = () => S.ui.book || (S.ui.book = { typeId: null, applicationId: null, entityId: null, day: 0, slot: null, attendees: null, note: '', done: null, slotsData: null, rescheduleId: null, dayTouched: false });

  /* ---------- Verfügbarkeit einer Terminart für den Bürger ---------- */
  function typeAvail(t) {
    const d = S.d;
    if (d.me.banUntil) return { ok: false, reason: 'Terminsperre bis ' + IC.fdt(d.me.banUntil) + '.' };
    if (t.needs === 'application') {
      const apps = d.myApplications.filter((a) => t.forStatus.indexOf(a.status) !== -1 && (!t.appKind || a.kind === t.appKind));
      if (!apps.length) {
        const booked = d.myApplications.some((a) => a.status === 'termin_gebucht' && (!t.appKind || a.kind === t.appKind));
        return { ok: false, reason: t.key === 'einspruch' ? 'Nur nach eingelegtem Einspruch.' : booked ? 'Für Ihren Antrag ist bereits ein Termin gebucht.' : 'Voraussetzung: bestandene Vorprüfung Ihres Antrags.' };
      }
      return { ok: true, apps };
    }
    if (t.needs === 'entity') {
      const ents = d.myEntities.filter((e) => e.status !== 'aufgeloest' && (t.entityNeeds !== 'conditions' || e.conditions.some((x) => !x.done)));
      if (!ents.length) return { ok: false, reason: t.entityNeeds === 'conditions' ? 'Nur mit offenen Auflagen.' : 'Voraussetzung: eine Eintragung.' };
      return { ok: true, ents };
    }
    return { ok: true };
  }

  function mandatory(app) {
    if (!app) return [S.d.me.charId];
    return app.founders.filter((f) => f.role === 'geschaeftsfuehrer' || f.role === 'inhaber' || f.role === 'vorsitz' || (f.share || 0) >= 25 || app.kind === 'fraktion').map((f) => f.charId);
  }

  const dayLabel = (ts) => {
    const off = Math.round((IC.startOfDay(ts) - IC.startOfDay(IC.now())) / IC.DAY);
    return off === 0 ? 'Heute' : off === 1 ? 'Morgen' : IC.fday(ts).split(',')[0];
  };

  /* ====================================================================
     Termin buchen
     ==================================================================== */
  IC.partials['book-slots'] = function () {
    const b = B(), d = S.d;
    if (!b.typeId) return html`<div class="hint">Wählen Sie zuerst eine Terminart.</div>`;
    const sd = b.slotsData;
    if (!sd) return html`<div class="hint">${ico('clock')} Termine werden geladen …</div>`;
    const t = typeOf(b.typeId);
    const anyFree = sd.days.some((x) => x.free > 0);
    const banner = d.duty.count
      ? (sd.eligible
        ? html`<div class="duty on"><span class="big">${String(d.duty.count).padStart(2, '0')}</span><div><div class="strong">${d.duty.count} ${IC.plural(d.duty.count, 'Beamter', 'Beamte')} im Dienst</div><div class="small">Live-Termine gibt es für die nächsten ${cfg().rules.liveHorizon} Minuten. Spätere Termine nur in veröffentlichten Sprechzeiten.</div></div></div>`
        : html`<div class="duty off"><span class="big">${String(d.duty.count).padStart(2, '0')}</span><div><div class="strong">Niemand mit der nötigen Befugnis im Dienst</div><div class="small">Für „${t.label}“ ist mindestens der Rang ${L.RANK[t.minRank].label} nötig. Buchbar sind nur veröffentlichte Sprechzeiten.</div></div></div>`)
      : html`<div class="duty off"><span class="big">00</span><div><div class="strong">Zurzeit ist kein Beamter im Dienst</div><div class="small">Live-Termine sind nicht möglich. Buchbar sind nur veröffentlichte Sprechzeiten.</div></div></div>`;
    const notify = !d.duty.count ? html`<label class="check"><input id="notify-chk" type="checkbox" data-act="notify-toggle" ${d.me.notifyOnDuty ? raw('checked') : ''}><span>Benachrichtigen, sobald ein Beamter im Dienst ist <span class="muted small">(höchstens eine Nachricht pro 30 Minuten)</span></span></label>` : '';
    if (!anyFree) {
      return html`<div class="stack">${banner}${c.callout('warn', 'Zurzeit ist kein Termin buchbar', 'Es ist kein Beamter im Dienst und keine Sprechzeit veröffentlicht. Ihr Antrag bleibt gültig, solange die Frist von ' + cfg().rules.bookDays + ' Tagen nach der Vorprüfung läuft.', 'clock')}${notify}</div>`;
    }
    const day = sd.days.find((x) => x.offset === sd.dayOffset);
    return html`<div class="stack">
      ${banner}${notify}
      <div class="daystrip" role="group" aria-label="Tag wählen">${sd.days.map((x) => html`<button class="day" data-act="book-day" data-off="${x.offset}" ${pressed(x.offset === sd.dayOffset)}><span class="dn">${dayLabel(x.ts)}</span><span class="dd">${new Date(x.ts).getDate()}.</span><span class="dc">${x.free ? x.free + ' frei' : '–'}</span></button>`)}</div>
      ${sd.slots.length ? html`<div class="slots" role="group" aria-label="Uhrzeit wählen">${sd.slots.map((sl) => html`<button class="slot" data-act="book-slot" data-start="${sl.start}" ${pressed(b.slot === sl.start)} ${sl.free ? '' : raw('disabled')}>
        <span class="st">${IC.ftime(sl.start)}</span>
        <span class="sm"><span class="pips" aria-hidden="true">${Array.from({ length: Math.min(4, sl.cap) }, (_, i) => html`<i class="${i < sl.free ? '' : 'off'}"></i>`)}</span>${sl.free ? sl.free + ' frei' : 'belegt'}</span>
        <span class="src">${sl.source === 'live' ? 'Live' : 'Sprechzeit'} · ${t.minutes} Min</span></button>`)}</div>`
        : c.empty('calendar', 'Kein Termin an diesem Tag', day && day.total ? 'Alle Termine an diesem Tag sind vergeben. Wählen Sie einen anderen Tag.' : 'An diesem Tag hat kein Beamter Sprechzeit. Wählen Sie einen anderen Tag.')}
    </div>`;
  };

  IC.partials['book-final'] = function () {
    const b = B(), d = S.d;
    const t = b.typeId ? typeOf(b.typeId) : null;
    if (!t) return html``;
    const app = b.applicationId ? d.myApplications.find((a) => a.id === b.applicationId) : null;
    const ent = b.entityId ? d.myEntities.find((e) => e.id === b.entityId) : null;
    const must = mandatory(app);
    const people = app ? app.founders : [{ charId: d.me.charId, name: d.me.name }];
    const att = b.attendees || must;
    const missingVorgang = (t.needs === 'application' && !app) || (t.needs === 'entity' && !ent);
    const ready = b.slot && !missingVorgang && must.every((m) => att.indexOf(m) !== -1);
    const when = b.slot ? IC.fday(b.slot) + ' · ' + IC.ftime(b.slot) + '–' + IC.ftime(b.slot + t.minutes * IC.MIN) + ' Uhr' : 'noch nicht gewählt';
    return html`<div class="stack">
      ${t.needs === 'application' ? html`<div class="stack sm"><h4>Teilnehmer</h4><p class="small muted">Pflichtteilnehmer müssen zum Termin eingecheckt sein, sonst kann er nicht beginnen.</p>
        ${people.map((p) => html`<label class="check person" style="grid-template-columns:20px 36px minmax(0,1fr) auto;cursor:${must.indexOf(p.charId) !== -1 ? 'default' : 'pointer'}"><input type="checkbox" data-act="book-attendee" data-id="${p.charId}" ${att.indexOf(p.charId) !== -1 ? raw('checked') : ''} ${must.indexOf(p.charId) !== -1 ? raw('disabled') : ''}>${c.avatar(p.name)}<span class="grow"><span class="pn">${p.name}</span><span class="pm" style="display:block">${L.MEMBER_ROLE[p.role] || ''}</span></span>${must.indexOf(p.charId) !== -1 ? c.chip('Pflicht', 'warn') : c.chip('freiwillig', '')}</label>`)}</div>` : ''}
      ${c.field('book-note', 'Anmerkung für die Beamten', html`<input id="book-note" type="text" maxlength="200" data-bind="ui.book.note" value="${b.note}" placeholder="Optional, zum Beispiel was Sie mitbringen">`)}
      <div class="sheet"><div class="sheet-b"><dl class="kv"><dt>Termin</dt><dd>${t.label}</dd><dt>Zeit</dt><dd>${when}</dd>${app ? html`<dt>Antrag</dt><dd>${app.name} ${c.tag(app.caseNo)}</dd>` : ''}${ent ? html`<dt>Eintragung</dt><dd>${ent.name} ${c.tag(ent.regNo)}</dd>` : ''}</dl></div>
        <div class="sheet-f"><button class="btn primary lg" data-act="book-submit" ${ready ? '' : raw('disabled')}>${ico('calendar')}${b.rescheduleId ? 'Verbindlich verschieben' : 'Verbindlich buchen'}</button></div></div>
    </div>`;
  };

  function loadSlots() {
    const b = B();
    if (!b.typeId) return Promise.resolve();
    return IC.api('slotsList', { typeId: b.typeId, dayOffset: b.day, excludeApptId: b.rescheduleId }).then((r) => {
      if (!r.ok) { IC.toast(r.error, 'bad'); return; }
      b.slotsData = r;
      if (!b.dayTouched && r.slots.every((x) => x.free === 0)) {
        const first = r.days.find((x) => x.free > 0);
        if (first && first.offset !== b.day) { b.day = first.offset; return loadSlots(); }
      }
      b.day = r.dayOffset;
      IC.refresh('book-slots', 'book-final');
    });
  }

  function bookingCard(b) {
    const d = S.d;
    const ap = d.myAppointments.find((x) => x.id === b.done.id) || {};
    const t = typeOf(ap.typeId || b.typeId);
    return html`<div class="stack lg">
      <div class="sheet"><div class="sheet-b" style="text-align:center;padding:32px 20px">${c.stamp('ok', 'Gebucht', true)}<h2 style="margin-top:20px">Ihr Termin ist gebucht</h2><p class="muted" style="margin-top:6px">${t.label} · ${ap.start ? IC.fdaylong(ap.start) + ', ' + IC.ftime(ap.start) + ' Uhr' : ''}</p></div></div>
      <div class="ticket"><div class="tn">${b.done.id}</div><div><div class="strong">Terminkarte</div><div class="small muted">Einchecken am Empfang ab ${ap.start ? IC.ftime(ap.start - cfg().rules.checkinBefore * IC.MIN) : ''} Uhr. Bitte erscheinen Sie pünktlich: ${cfg().rules.checkinAfter} Minuten nach Beginn gilt der Termin als versäumt.</div></div></div>
      ${t.key.indexOf('vorstellung') === 0 ? c.callout('info', 'So bereiten Sie sich vor', 'Stellen Sie in drei bis fünf Minuten Ihr Konzept vor: Geschäftsidee, Zielgruppe, Standort, Personal. Bringen Sie Ausweis und, falls verlangt, Mietvertrag und Zulassung der Fachbehörde mit.', 'book') : ''}
      <div class="btn-row"><button class="btn primary" data-act="view" data-view="appts">Meine Termine</button><button class="btn" data-act="book-again">Weiteren Termin buchen</button></div>
    </div>`;
  }

  function book() {
    const d = S.d, b = B();
    if (b.done) return html`<div class="page-head"><div><div class="crumbs">Bürgeramt · Termine</div><h1>Termin gebucht</h1></div></div>${bookingCard(b)}`;
    if (b.typeId && !b.slotsData) IC.after(() => loadSlots());
    const t = b.typeId ? typeOf(b.typeId) : null;
    const av = t ? typeAvail(t) : null;
    const openAppts = d.myAppointments.filter((a) => OPEN.indexOf(a.status) !== -1).length;
    return html`
      <div class="page-head"><div><div class="crumbs">Bürgeramt · Termine</div><h1>${b.rescheduleId ? 'Termin verschieben' : 'Termin buchen'}</h1><p class="sub">Termine gibt es nur, wenn Beamte im Dienst sind oder Sprechzeiten veröffentlicht haben.</p></div></div>
      ${c.board(d)}
      ${d.me.banUntil ? c.callout('bad', 'Terminsperre', 'Wegen versäumter Termine sind Sie bis ' + IC.fdt(d.me.banUntil) + ' für Buchungen gesperrt.', 'lock') : ''}
      ${!d.me.banUntil && openAppts >= cfg().rules.maxOpenAppointments && !b.rescheduleId ? c.callout('warn', 'Grenze offener Termine erreicht', 'Sie haben ' + openAppts + ' offene Termine. Sagen Sie einen ab, um einen neuen zu buchen.', 'calendar') : ''}
      ${b.rescheduleId ? c.callout('info', 'Verschieben', 'Der bisherige Termin wird erst mit der Neubuchung freigegeben.', 'refresh') : ''}
      ${c.sheet('Terminart', html`<div class="grid g3">${cfg().appointmentTypes.map((tp) => {
        const a = typeAvail(tp);
        return html`<button class="pick" data-act="book-type" data-key="${tp.key}" ${pressed(b.typeId === tp.key)} ${a.ok && !b.rescheduleId ? '' : (b.rescheduleId && b.typeId === tp.key ? '' : raw('disabled'))}>
          <span class="pk-t">${tp.label}</span><span class="pk-d">${a.ok ? tp.desc : a.reason}</span>
          <span class="pk-m">${c.chip(tp.minutes + ' Min', '', 'clock')}${c.chip('ab ' + L.RANK[tp.minRank].label, '', 'badge')}</span></button>`;
      })}</div>`, { icon: 'list', id: 'sh-type' })}
      ${t && (t.needs === 'application' || t.needs === 'entity') ? c.sheet(t.needs === 'application' ? 'Antrag wählen' : 'Eintragung wählen', html`<div class="grid g2">${(t.needs === 'application' ? av.apps : av.ents).map((x) => html`<button class="pick" data-act="book-vorgang" data-id="${x.id}" ${pressed((t.needs === 'application' ? b.applicationId : b.entityId) === x.id)} ${b.rescheduleId ? raw('disabled') : ''}>
        <span class="pk-t">${x.name}</span><span class="pk-m">${t.needs === 'application' ? html`${c.appChip(x.status)}${c.tag(x.caseNo)}` : html`${c.orgChip(x.status)}${c.tag(x.regNo)}`}</span></button>`)}</div>`, { icon: t.needs === 'application' ? 'doc' : 'folder' }) : ''}
      ${t ? c.sheet('Datum und Uhrzeit', html`<div data-partial="book-slots">${IC.partials['book-slots']()}</div>`, { icon: 'calendar' }) : ''}
      ${t ? c.sheet('Teilnehmer und Buchung', html`<div data-partial="book-final">${IC.partials['book-final']()}</div>`, { icon: 'users' }) : ''}`;
  }

  /* ====================================================================
     Meine Termine
     ==================================================================== */
  function checkinState(ap) {
    const R = cfg().rules, now = IC.now();
    const me = ap.attendees.find((x) => x.charId === S.d.me.charId);
    if (!me) return { can: false, text: '' };
    if (me.checkedIn) return { can: false, done: true, text: 'Sie sind eingecheckt und warten im Wartebereich.' };
    if (['gebucht', 'eingecheckt'].indexOf(ap.status) === -1) return { can: false, text: '' };
    if (now < ap.start - R.checkinBefore * IC.MIN) return { can: false, text: 'Einchecken ab ' + IC.ftime(ap.start - R.checkinBefore * IC.MIN) + ' Uhr.' };
    if (now > ap.start + R.checkinAfter * IC.MIN) return { can: false, text: 'Das Check-in-Fenster ist geschlossen.' };
    return { can: true, text: 'Check-in ist jetzt möglich.' };
  }

  function apptCard(ap) {
    const t = typeOf(ap.typeId);
    const ci = checkinState(ap);
    const app = ap.applicationId ? S.d.myApplications.find((a) => a.id === ap.applicationId) : null;
    const ent = ap.entityId ? S.d.myEntities.find((e) => e.id === ap.entityId) : null;
    const open = OPEN.indexOf(ap.status) !== -1;
    return html`<article class="sheet"><div class="sheet-h">${ico('calendar')}<h3>${ap.id}</h3><span class="sp"></span>${c.apptChip(ap.status)}</div>
      <div class="sheet-b stack">
        <div><h2>${t.label}</h2><p class="muted" style="margin-top:2px">${IC.fdaylong(ap.start)}, ${IC.ftime(ap.start)}–${IC.ftime(ap.end)} Uhr${open ? html` · <b>${IC.rel(ap.start)}</b>` : ''}</p></div>
        ${c.kv([app ? ['Antrag', html`${app.name} ${c.tag(app.caseNo)}`] : null, ent ? ['Eintragung', html`${ent.name} ${c.tag(ent.regNo)}`] : null, ['Teilnehmer', ap.attendees.map((x) => html`<span class="chip ${x.checkedIn ? 'ok' : ''}" style="margin:0 4px 4px 0">${x.checkedIn ? ico('check') : ''}${x.name}${x.mandatory ? ' · Pflicht' : ''}</span>`)], ap.note ? ['Anmerkung', ap.note] : null, ['Beamter', ap.official ? ap.official.name : 'wird zugewiesen']])}
        ${ci.text ? c.callout(ci.done ? 'ok' : ci.can ? 'info' : '', ci.done ? 'Eingecheckt' : ci.can ? 'Einchecken möglich' : 'Check-in', ci.text, ci.done ? 'check' : 'clock') : ''}
        ${ap.status === 'aufgerufen' ? c.callout('warn', 'Sie werden aufgerufen', 'Bitte gehen Sie zum Schalter des Beamten.', 'bell') : ''}
        ${ap.status === 'beamter_ausfall' ? c.callout('warn', 'Termin ausgefallen', 'Es war kein Beamter im Dienst. Das ist kein Versäumnis Ihrerseits, es gibt keinen Strike. Buchen Sie einen Ersatztermin, Sie werden bevorzugt behandelt.', 'alert') : ''}
        ${ap.status === 'nicht_erschienen' ? c.callout('bad', 'Nicht erschienen', 'Dieser Termin wurde als versäumt gewertet und zählt als Strike.', 'x') : ''}
      </div>
      ${open && ap.status !== 'laeuft' ? html`<div class="sheet-f">${ci.can ? html`<button class="btn primary" data-act="appt-checkin" data-id="${ap.id}">${ico('check')}Einchecken</button>` : ''}<button class="btn" data-act="appt-resched" data-id="${ap.id}">Verschieben</button><button class="btn danger" data-act="appt-cancel" data-id="${ap.id}">Absagen</button></div>` : ''}
      ${ap.status === 'beamter_ausfall' && app ? html`<div class="sheet-f"><button class="btn primary" data-act="app-book" data-id="${app.id}">Ersatztermin buchen</button></div>` : ''}
    </article>`;
  }

  function appts() {
    const d = S.d;
    const open = d.myAppointments.filter((a) => OPEN.indexOf(a.status) !== -1);
    const past = d.myAppointments.filter((a) => OPEN.indexOf(a.status) === -1).sort((a, b) => b.start - a.start);
    return html`
      <div class="page-head"><div><div class="crumbs">Bürgeramt · Termine</div><h1>Meine Termine</h1><p class="sub">Einchecken ist ${cfg().rules.checkinBefore} Minuten vor bis ${cfg().rules.checkinAfter} Minuten nach Terminbeginn möglich. Absagen bis ${cfg().rules.cancelFreeMinutes} Minuten vorher sind folgenlos.</p></div>
        <button class="btn primary" data-act="book-fresh">${ico('plus')}Termin buchen</button></div>
      ${c.board(d)}
      ${d.me.activeStrikes ? c.callout('warn', d.me.activeStrikes + ' ' + IC.plural(d.me.activeStrikes, 'Strike', 'Strikes') + ' aktiv', 'Bei ' + cfg().rules.strikeLimit + ' Strikes innerhalb von ' + cfg().rules.strikeDays + ' Tagen sind Sie ' + cfg().rules.banDays + ' Tage für Termine gesperrt.', 'alert') : ''}
      ${open.length ? html`<div class="grid g2">${open.map(apptCard)}</div>` : c.sheet('Offene Termine', c.empty('calendar', 'Keine offenen Termine', 'Buchen Sie einen Vorstellungstermin, sobald Ihre Vorprüfung bestanden ist.', html`<button class="btn primary" data-act="book-fresh">Termin buchen</button>`))}
      ${past.length ? c.sheet('Vergangene Termine', html`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Termin</th><th>Zeit</th><th>Status</th></tr></thead><tbody>${past.map((a) => html`<tr><td><div class="strong">${typeOf(a.typeId).label}</div><div class="sub">${a.id}</div></td><td>${IC.fdt(a.start)}</td><td>${c.apptChip(a.status)}</td></tr>`)}</tbody></table></div>`, { icon: 'clock', flush: true }) : ''}`;
  }

  /* ====================================================================
     Wartenummer
     ==================================================================== */
  function queue() {
    const d = S.d;
    const tk = d.myTicket;
    S.ui.qtype = S.ui.qtype || 'beratung';
    const opts = cfg().appointmentTypes.filter((t) => t.key === 'beratung');
    return html`
      <div class="page-head"><div><div class="crumbs">Bürgeramt · Spontan</div><h1>Wartenummer</h1><p class="sub">Ohne Termin vorbeigekommen? Mit einer Wartenummer werden Sie der Reihe nach aufgerufen, solange ein Beamter im Dienst ist. Für eine Vorstellung buchen Sie einen Live-Termin.</p></div></div>
      ${c.board(d)}
      ${tk ? html`<div class="stack">
          ${tk.called ? c.callout('warn', 'Sie werden aufgerufen', 'Ihre Nummer ' + tk.no + ' wird an Schalter ' + d.board.calling.desk + ' bedient. Bitte dorthin gehen.', 'bell') : ''}
          <div class="ticket"><div class="tn">${tk.no}</div><div><div class="strong">Ihre Wartenummer</div><div class="small muted">${typeOf(tk.typeId).label} · ${tk.called ? 'wird aufgerufen' : 'Position ' + tk.position + ' in der Schlange, geschätzt ' + Math.max(3, Math.round((tk.position * 8) / Math.max(1, d.duty.count))) + ' Minuten'}</div></div></div>
          <div class="btn-row"><button class="btn danger" data-act="queue-leave">Nummer abgeben</button></div></div>`
        : c.sheet('Nummer ziehen', html`<div class="stack">
          ${d.duty.count ? '' : c.callout('warn', 'Zurzeit ist kein Beamter im Dienst', 'Eine Wartenummer ist nicht möglich. Buchen Sie einen Termin in einer Sprechzeit oder lassen Sie sich benachrichtigen.', 'clock', html`<button class="btn sm" data-act="view" data-view="book">Zur Terminbuchung</button>`)}
          ${c.field('q-type', 'Anliegen', html`<select id="q-type" data-bind="ui.qtype">${opts.map((t) => html`<option value="${t.key}" ${S.ui.qtype === t.key ? raw('selected') : ''}>${t.label}</option>`)}</select>`)}
          <div class="btn-row"><button class="btn primary lg" data-act="queue-take" ${d.duty.count ? '' : raw('disabled')}>${ico('ticket')}Wartenummer ziehen</button></div></div>`, { icon: 'ticket' })}`;
  }

  /* ====================================================================
     Aktionen
     ==================================================================== */
  Object.assign(IC.act, {
    'book-fresh': () => { S.ui.book = null; IC.view('book'); },
    'book-again': () => { S.ui.book = null; IC.view('book'); },
    'book-type': (el) => {
      const b = B();
      const t = typeOf(el.dataset.key);
      const av = typeAvail(t);
      b.typeId = t.key; b.slot = null; b.slotsData = null; b.day = 0; b.dayTouched = false;
      b.applicationId = t.needs === 'application' && av.apps.length === 1 ? av.apps[0].id : null;
      b.entityId = t.needs === 'entity' && av.ents.length === 1 ? av.ents[0].id : null;
      b.attendees = null;
      IC.render();
    },
    'book-vorgang': (el) => {
      const b = B(), t = typeOf(b.typeId);
      if (t.needs === 'application') { b.applicationId = el.dataset.id; b.attendees = null; } else b.entityId = el.dataset.id;
      IC.render();
    },
    'book-day': (el) => { const b = B(); b.day = Number(el.dataset.off); b.dayTouched = true; b.slot = null; IC.api('slotsList', { typeId: b.typeId, dayOffset: b.day, excludeApptId: b.rescheduleId }).then((r) => { if (r.ok) { b.slotsData = r; IC.refresh('book-slots', 'book-final'); } }); },
    'book-slot': (el) => { const b = B(); b.slot = Number(el.dataset.start); IC.refresh('book-slots', 'book-final'); },
    'book-attendee': (el) => {
      const b = B();
      const app = b.applicationId ? S.d.myApplications.find((a) => a.id === b.applicationId) : null;
      const cur = (b.attendees || mandatory(app)).slice();
      const i = cur.indexOf(el.dataset.id);
      if (i === -1) cur.push(el.dataset.id); else cur.splice(i, 1);
      b.attendees = cur;
      IC.refresh('book-final');
    },
    'book-submit': async () => {
      const b = B();
      const app = b.applicationId ? S.d.myApplications.find((a) => a.id === b.applicationId) : null;
      const r = await IC.run('apptBook', {
        typeId: b.typeId, start: b.slot, applicationId: b.applicationId, entityId: b.entityId, attendees: b.attendees || mandatory(app), note: b.note,
        rescheduleId: b.rescheduleId, rescheduleAppId: app ? app.id : null,
      }, { noReload: true });
      if (!r.ok) { b.slotsData = null; await loadSlots(); return; }
      b.done = { id: r.id };
      await IC.reload();
    },
    'notify-toggle': async (el) => {
      const r = await IC.api('notifyOnDuty', { enabled: el.checked });
      if (r.ok) { S.d.me.notifyOnDuty = r.enabled; IC.toast(r.enabled ? 'Sie werden benachrichtigt, sobald ein Beamter im Dienst ist.' : 'Benachrichtigung ausgeschaltet.', 'ok'); }
    },
    'appt-checkin': async (el) => { await IC.run('apptCheckin', { id: el.dataset.id }, { ok: (r) => (r.allIn ? 'Eingecheckt. Alle Pflichtteilnehmer sind da' + (r.othersIn ? ' (in der Vorschau treffen Ihre Mitgründer gemeinsam mit Ihnen ein)' : '') + ', bitte warten Sie auf den Aufruf.' : 'Eingecheckt. Es fehlen noch Pflichtteilnehmer.') }); },
    'appt-cancel': async (el) => {
      const ap = S.d.myAppointments.find((x) => x.id === el.dataset.id);
      const late = ap.start - IC.now() < cfg().rules.cancelFreeMinutes * IC.MIN;
      const yes = await IC.confirm({ title: 'Termin absagen?', danger: true, yes: 'Termin absagen',
        text: 'Der Termin am ' + IC.fday(ap.start) + ' um ' + IC.ftime(ap.start) + ' Uhr wird abgesagt.',
        extra: late ? c.callout('warn', 'Kurzfristige Absage', 'Es sind weniger als ' + cfg().rules.cancelFreeMinutes + ' Minuten bis zum Termin. Das zählt als Strike.') : '' });
      if (yes) await IC.run('apptCancel', { id: ap.id }, { ok: (r) => (r.strike ? 'Termin abgesagt. Die kurzfristige Absage zählt als Strike.' : 'Termin abgesagt.') });
    },
    'appt-resched': (el) => {
      const ap = S.d.myAppointments.find((x) => x.id === el.dataset.id);
      S.ui.book = { typeId: ap.typeId, applicationId: ap.applicationId, entityId: ap.entityId, day: 0, slot: null, attendees: ap.attendees.map((x) => x.charId), note: ap.note || '', done: null, slotsData: null, rescheduleId: ap.id, dayTouched: false };
      IC.view('book');
    },
    'queue-take': async () => {
      const r = await IC.run('queueTake', { typeId: S.ui.qtype }, { ok: (x) => 'Ihre Wartenummer: ' + x.no + '. Position ' + x.position + ', etwa ' + x.etaMin + ' Minuten.' });
    },
    'queue-leave': async () => { await IC.run('queueLeave', {}, { ok: 'Wartenummer abgegeben.' }); },
  });

  IC.registerApp('buergeramt', {
    title: 'Bürgeramt', icon: 'calendar', def: 'book',
    where: () => S.d.config.city + (S.env.nui ? '' : ' · Rathaus · Empfang'),
    nav: () => {
      const n = S.d.myAppointments.filter((a) => OPEN.indexOf(a.status) !== -1).length;
      return [
        { id: 'book', label: 'Termin buchen', icon: 'plus' },
        { id: 'appts', label: 'Meine Termine', icon: 'calendar', badge: n || null },
        { id: 'queue', label: 'Wartenummer', icon: 'ticket', badge: S.d.myTicket ? S.d.myTicket.no : null },
      ];
    },
    railFoot: () => html`Termine gibt es nur, wenn Beamte im Dienst sind oder Sprechzeiten bestehen.`,
    views: { book, appts, queue },
  });
})();

/* js/view-beamte.js */
/* IC-Behördenportal · Beamten-Tablet: Termine führen, Vorprüfung, Sprechzeiten, Register */
(function () {
  'use strict';
  const IC = window.IC;
  const { html, raw, ico, money } = IC;
  const c = IC.c, L = IC.L, S = IC.S;
  const cfg = () => S.d.config;
  const typeOf = (k) => cfg().appointmentTypes.find((t) => t.key === k);
  const formOf = (k) => cfg().legalForms.find((f) => f.key === k);
  const branchOf = (k) => cfg().branches.find((b) => b.key === k);
  const O = () => S.d.official;
  const lvl = (r) => L.RANK[r].level;
  const pressed = (cond) => raw('aria-pressed="' + (cond ? 'true' : 'false') + '"');
  const OPEN = ['gebucht', 'eingecheckt', 'aufgerufen', 'laeuft'];
  const apptOf = (id) => S.d.officialAppts.find((a) => a.id === id);
  const appOf = (id) => S.d.officialApps.find((a) => a.id === id);
  const sameDay = (a, b) => IC.startOfDay(a) === IC.startOfDay(b);

  const QUESTIONS = {
    unternehmen: ['Was ist Ihre Geschäftsidee in einem Satz?', 'Wer sind Ihre Kunden, und warum kommen sie zu Ihnen?', 'Wie viele Mitarbeiter planen Sie, und wer führt das Tagesgeschäft?', 'Wie sieht der Standort aus, und liegt ein Mietvertrag vor?', 'Wie sind die Anteile verteilt, und wer vertritt das Unternehmen?', 'Was passiert bei Streit unter den Gesellschaftern?', 'Welche Zulassungen anderer Behörden benötigen Sie?', 'Wie sichern Sie Kasse und Ware?'],
    fraktion: ['Was ist der Zweck der Organisation?', 'Wie wird man Mitglied, und wer entscheidet darüber?', 'Wer sitzt im Vorstand, und wie wird gewählt?', 'Wo treffen Sie sich, und wie oft?', 'Wie finanziert sich die Organisation?', 'Wie gehen Sie mit Konflikten unter Mitgliedern um?'],
  };

  /* ====================================================================
     Dienstleiste
     ==================================================================== */
  function dutyBar() {
    const o = O(), d = S.d;
    S.ui.deskSel = S.ui.deskSel || o.desk;
    return html`<div class="sheet"><div class="sheet-b stack sm">
      <div class="spread">
        <div class="row">
          <div class="seg" role="group" aria-label="Dienststatus">${[['on', 'Im Dienst'], ['pause', 'Pause'], ['off', 'Außer Dienst']].map((x) => html`<button data-act="duty-set" data-state="${x[0]}" ${pressed(o.state === x[0])}>${x[1]}</button>`)}</div>
          <div class="row sm"><label class="lbl" for="duty-desk">Schalter</label><select id="duty-desk" style="width:auto" data-bind="ui.deskSel" data-after="duty-desk">${[1, 2, 3, 4].map((n) => html`<option value="${n}" ${Number(S.ui.deskSel) === n ? raw('selected') : ''}>${n}</option>`)}</select></div>
        </div>
        <div class="row sm"><span class="lbl">Kollegen im Dienst</span>${d.coworkers.length ? d.coworkers.map((x) => c.chip(x.name + ' · ' + L.RANK[x.rank].label + ' · Schalter ' + x.desk, 'ok')) : html`<span class="muted small">niemand</span>`}</div>
      </div>
      ${o.state !== 'on' ? c.callout('warn', 'Sie sind nicht im Dienst', 'Bürger können keine Live-Termine bei Ihnen buchen, und Sie können keine Entscheidungen treffen. Treten Sie den Dienst an, um zu arbeiten.', 'clock', html`<button class="btn sm primary" data-act="duty-set" data-state="on">Dienst antreten</button>`) : ''}
    </div></div>`;
  }

  function who(a) { return a.applicant ? a.applicant.name : ''; }

  /* ====================================================================
     Heute
     ==================================================================== */
  function apptRow(ap) {
    const o = O(), t = typeOf(ap.typeId);
    const app = ap.applicationId ? S.d.officialApps.find((a) => a.id === ap.applicationId) : null;
    const ent = ap.entityId ? S.d.register.find((e) => e.id === ap.entityId) : null;
    const rankOk = lvl(o.rank) >= lvl(t.minRank);
    const miss = ap.attendees.filter((x) => x.mandatory && !x.checkedIn);
    const lateAt = ap.start + cfg().rules.checkinAfter * IC.MIN;
    const canNoShow = IC.now() >= lateAt;
    return html`<article class="sheet"><div class="sheet-h">${ico('clock')}<h3>${IC.ftime(ap.start)}–${IC.ftime(ap.end)}</h3><span class="sp"></span>${c.apptChip(ap.status)}</div>
      <div class="sheet-b stack sm">
        <div class="spread"><div><div class="strong" style="font-size:17px">${t.label}</div><div class="small muted">${app ? app.name + ' · ' : ent ? ent.name + ' · ' : ''}${app ? app.caseNo : ap.id}${ap.status === 'gebucht' || ap.status === 'eingecheckt' ? ' · ' + IC.rel(ap.start) : ''}</div></div>${rankOk ? '' : c.chip('ab ' + L.RANK[t.minRank].label, 'warn', 'badge')}</div>
        <div class="row sm">${ap.attendees.map((x) => html`<span class="chip ${x.checkedIn ? 'ok' : ''}">${x.checkedIn ? ico('check') : ico('clock')}${x.name}${x.mandatory ? ' · Pflicht' : ''}</span>`)}</div>
        ${miss.length && ap.status !== 'laeuft' && OPEN.indexOf(ap.status) !== -1 ? html`<div class="small muted">Wartet auf ${miss.map((m) => m.name).join(', ')}.</div>` : ''}
        ${ap.note ? html`<div class="small"><span class="muted">Anmerkung:</span> ${ap.note}</div>` : ''}
      </div>
      ${OPEN.indexOf(ap.status) !== -1 ? html`<div class="sheet-f">
        ${ap.status === 'laeuft' ? html`<button class="btn primary" data-act="term-open" data-id="${ap.id}">${ico('play')}Termin fortsetzen</button>` : html`
          <button class="btn" data-act="appt-call" data-id="${ap.id}" ${o.state === 'on' && ap.status !== 'aufgerufen' ? '' : raw('disabled')}>${ico('bell')}Aufrufen</button>
          <button class="btn primary" data-act="appt-start" data-id="${ap.id}" ${o.state === 'on' && rankOk && !miss.length ? '' : raw('disabled')} title="${miss.length ? 'Pflichtteilnehmer fehlen noch' : ''}">${ico('play')}Termin starten</button>
          <button class="btn danger" data-act="appt-noshow" data-id="${ap.id}" ${o.state === 'on' && canNoShow ? '' : raw('disabled')} title="${canNoShow ? '' : 'Erst ab ' + IC.ftime(lateAt) + ' Uhr'}">Nicht erschienen</button>`}
      </div>` : ''}
    </article>`;
  }

  function today() {
    const d = S.d, o = O();
    const list = d.officialAppts;
    const open = list.filter((a) => OPEN.indexOf(a.status) !== -1);
    const done = list.filter((a) => OPEN.indexOf(a.status) === -1 && sameDay(a.start, IC.now()));
    return html`
      <div class="page-head"><div><div class="crumbs">Beamten-Tablet · Heute</div><h1>Termine und Warteraum</h1><p class="sub">Aufrufen, Termin starten, Checkliste abarbeiten und entscheiden.</p></div></div>
      ${dutyBar()}
      <div class="split" style="grid-template-columns:minmax(0,1fr) 340px">
        <div class="stack">
          ${open.length ? open.map(apptRow) : c.sheet('Offene Termine', c.empty('calendar', 'Keine offenen Termine', 'Sobald Bürger Termine buchen, erscheinen sie hier.'))}
          ${done.length ? c.sheet('Erledigt heute', html`<div class="tbl-wrap"><table class="tbl"><tbody>${done.map((a) => html`<tr><td class="num">${IC.ftime(a.start)}</td><td>${typeOf(a.typeId).label}</td><td>${a.bookerName}</td><td>${c.apptChip(a.status)}</td></tr>`)}</tbody></table></div>`, { icon: 'check', flush: true }) : ''}
        </div>
        <aside class="stack">
          ${c.sheet('Aufrufanzeige', html`<div class="board"><div class="lab">Aufruf</div><div class="big num">${d.board.calling ? d.board.calling.no : '---'}</div><div class="lab">${d.board.calling ? 'Schalter ' + d.board.calling.desk : 'kein Aufruf'}</div></div>`, { icon: 'bell' })}
          ${c.sheet('Warteschlange', d.queue.length ? html`<div class="stack sm">${d.queue.map((q, i) => html`<div class="spread"><span><span class="tag">${q.no}</span> ${q.who}</span><span class="muted small">${IC.rel(q.at)}</span></div>`)}</div>` : html`<p class="small muted">Niemand wartet.</p>`, { icon: 'ticket', footer: html`<button class="btn primary" data-act="queue-next" ${o.state === 'on' && d.queue.length ? '' : raw('disabled')}>Nächste Nummer aufrufen</button>` })}
        </aside>
      </div>`;
  }

  /* ====================================================================
     Termin führen
     ==================================================================== */
  const T = () => S.ui.term;
  IC.partials['term-check'] = function () {
    const t = T(), ap = apptOf(t.id), type = typeOf(ap.typeId);
    const list = cfg().checklists[type.key] || [];
    const done = list.filter((i) => t.checklist[i.key]).length;
    const must = list.filter((i) => !i.optional);
    const need = must.filter((i) => !t.checklist[i.key]).length;
    return html`<div class="spread" style="margin-bottom:6px"><span class="chip ${need ? 'warn' : 'ok'}">${done} von ${list.length} erledigt</span><span class="small muted">${need ? need + ' Pflichtpunkte offen' : 'Alle Pflichtpunkte erfüllt'}</span></div>
      <ul class="checklist">${list.map((i) => html`<li><label><input type="checkbox" data-act="chk-toggle" data-key="${i.key}" ${t.checklist[i.key] ? raw('checked') : ''}><span><span>${i.text}</span>${i.note ? html`<span class="ci-note" style="display:block">${i.note}</span>` : ''}</span></label></li>`)}</ul>`;
  };

  function decisionButtons(type) {
    if (type.key === 'beratung') return [['genehmigt', 'Beratung abschließen', 'ok']];
    if (type.key === 'aenderung') return [['genehmigt', 'Änderung beurkunden', 'ok'], ['abgelehnt', 'Änderung ablehnen', 'danger']];
    if (type.key === 'nachkontrolle') return [['genehmigt', 'Auflagen als erfüllt bestätigen', 'ok'], ['vertagt', 'Nicht erfüllt, vertagen', '']];
    if (type.key === 'einspruch') return [['genehmigt', 'Einspruch stattgeben', 'ok'], ['abgelehnt', 'Einspruch zurückweisen', 'danger']];
    return [['genehmigt', 'Genehmigen', 'ok'], ['auflagen', 'Mit Auflagen genehmigen', ''], ['vertagt', 'Vertagen (Nachbesserung)', ''], ['abgelehnt', 'Ablehnen', 'danger']];
  }

  function termResult(t) {
    const r = t.result;
    const dec = L.DECISION[r.decision];
    const msg = {
      eingetragen: 'Die Eintragung wurde vollzogen' + (r.regNo ? ': ' + r.regNo : '') + '. Der Gewerbeschein wurde ausgestellt, der Gründer ist benachrichtigt.',
      staff: 'Die Genehmigung ist erteilt. Die Eintragung folgt nach der Schlussprüfung durch die Registerführung.',
      vertagt: 'Der Gründer erhält Ihre Begründung und kann nachbessern. Ein Folgetermin wird bevorzugt vergeben.',
      abgelehnt: 'Der Gründer erhält den Bescheid mit Ihrer Begründung und kann ' + cfg().rules.objectionHours + ' Stunden lang Einspruch einlegen.',
      geaendert: 'Die Änderung wurde beurkundet.', erfuellt: 'Die Auflagen gelten als erfüllt.', offen: 'Die Auflagen bleiben offen, der Gründer wird erinnert.', beratung: 'Die Beratung ist abgeschlossen.',
    }[r.outcome] || 'Der Termin ist abgeschlossen.';
    return html`<div class="page-head"><div><div class="crumbs">Beamten-Tablet · Termin</div><h1>Bescheid erteilt</h1></div></div>
      <div class="sheet"><div class="sheet-b" style="text-align:center;padding:38px 20px">${c.stamp(dec.stamp, dec.word, true)}
        <h2 style="margin-top:22px">${dec.label}</h2><p class="muted" style="margin-top:6px;max-width:60ch;margin-inline:auto">${msg}</p>
        ${r.caseNo ? html`<p style="margin-top:10px">${c.tag(r.caseNo)}</p>` : ''}</div></div>
      <div class="btn-row"><button class="btn primary" data-act="term-close">Zurück zu Heute</button></div>`;
  }

  function term() {
    const t = T();
    if (!t) return today();
    if (t.result) return termResult(t);
    const ap = apptOf(t.id);
    if (!ap) { S.ui.term = null; return today(); }
    const type = typeOf(ap.typeId);
    const app = ap.applicationId ? appOf(ap.applicationId) : null;
    const ent = ap.entityId ? S.d.register.find((e) => e.id === ap.entityId) : null;
    const f = app ? formOf(app.legalForm) : null, b = app && app.branch ? branchOf(app.branch) : null;
    const qs = QUESTIONS[app && app.kind === 'fraktion' ? 'fraktion' : 'unternehmen'];
    return html`
      <div class="page-head"><div><div class="crumbs">Beamten-Tablet · Termin läuft seit ${IC.ftime(ap.startedAt || ap.start)} Uhr</div><h1>${type.label}</h1>
        <div class="row sm" style="margin-top:6px">${app ? c.tag(app.caseNo) : c.tag(ap.id)}${c.apptChip(ap.status)}${app ? c.appChip(app.status) : ''}</div></div>
        <button class="btn" data-act="term-close">Zurück zu Heute</button></div>
      <div class="split" style="grid-template-columns:minmax(0,1fr) 380px">
        <div class="stack">
          ${app ? c.sheet('Antrag', html`<div class="stack">
            ${c.kv([['Name', app.name], [app.kind === 'fraktion' ? 'Art' : 'Rechtsform', f ? f.label : '–'], b ? ['Branche', html`${b.label} ${b.needsProperty ? c.chip('Standort Pflicht', '', 'pin') : ''} ${b.authority ? c.chip('Zulassung: ' + b.authority, 'warn', 'badge') : ''}`] : null, ['Standort', IC.siteLabel(app.property)], ['Gebühren', app.fees ? html`${c.chip('Antrag ' + money(app.fees.apply) + ' bezahlt', 'ok', 'check')} ${c.chip('Eintragung ' + money(app.fees.register) + ' hinterlegt', 'ok', 'check')} ${app.fees.capital ? c.chip('Kapital ' + money(app.fees.capital) + ' hinterlegt', 'ok', 'check') : ''}` : '–']])}
            <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Gründer</th><th>Rolle</th><th class="right">Anteil</th><th>Anwesend</th></tr></thead><tbody>${app.founders.map((fd) => { const at = ap.attendees.find((x) => x.charId === fd.charId); return html`<tr><td class="strong">${fd.name}</td><td>${L.MEMBER_ROLE[fd.role]}</td><td class="right num">${fd.share != null ? fd.share + ' %' : '–'}</td><td>${at ? (at.checkedIn ? c.chip('ja', 'ok', 'check') : c.chip('nein', 'bad')) : c.chip('nicht eingeladen', '')}</td></tr>`; })}</tbody></table></div>
          </div>`, { icon: 'doc' }) : ent ? c.sheet('Eintragung', c.kv([['Name', ent.name], ['Nr.', ent.regNo], ['Status', c.orgChip(ent.status)], ['Sitz', ent.hq], ent.pendingChange ? ['Beantragte Änderung', (ent.pendingChange.type === 'name' ? 'Neuer Name: ' : 'Neuer Sitz: ') + ent.pendingChange.value] : null, ['Offene Auflagen', ent.conditions.filter((x) => !x.done).length ? html`<ul style="margin:0;padding-left:18px">${ent.conditions.filter((x) => !x.done).map((x) => html`<li>${x.text}</li>`)}</ul>` : 'keine']]), { icon: 'folder' }) : ''}
          ${app && app.kind === 'unternehmen' && app.concept ? c.sheet('Vorgestelltes Konzept', c.kv([['Geschäftsidee', app.concept.idea], ['Zielgruppe', app.concept.audience || '–'], ['Angebot', app.concept.offer || '–'], ['Personal', app.concept.staff || '–'], ['Öffnungszeiten', app.concept.hours || '–']]), { icon: 'book' }) : ''}
          ${app && app.kind === 'fraktion' && app.statute ? c.sheet('Zweck und Satzung', c.kv([['Zweck', app.statute.purpose], ['Ziele', app.statute.goals || '–'], ['Aufnahme', app.statute.admission || '–']]), { icon: 'book' }) : ''}
          ${app ? c.sheet('Fragenkatalog', html`<ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">${qs.map((q) => html`<li>${q}</li>`)}</ul>`, { icon: 'info' }) : ''}
        </div>
        <aside class="stack sticky">
          ${c.sheet('Checkliste', html`<div data-partial="term-check">${IC.partials['term-check']()}</div>`, { icon: 'list' })}
          ${c.sheet('Notizen', html`<textarea id="term-notes" data-bind="ui.term.notes" placeholder="Eigene Notizen zum Termin (nur für Sie sichtbar)">${t.notes}</textarea>`, { icon: 'edit' })}
          ${c.sheet('Entscheidung', html`<div class="stack sm">${decisionButtons(type).map((x) => html`<button class="btn ${x[2] === 'ok' ? 'ok' : x[2]} lg" data-act="dec-open" data-dec="${x[0]}">${x[1]}</button>`)}</div>`, { icon: 'stamp', footer: html`<span class="small muted">Jede Entscheidung außer „Genehmigen“ braucht eine Begründung. Sie wird im Bescheid angezeigt.</span>` })}
        </aside>
      </div>`;
  }

  IC.partials['dec-conds'] = function () {
    const t = T();
    return html`<div class="stack sm">
      <div class="row sm">${cfg().conditionPresets.map((p) => html`<button class="chip ${t.conds.indexOf(p) !== -1 ? 'solid' : ''}" style="cursor:pointer" data-act="dec-cond-preset" data-text="${p}">${t.conds.indexOf(p) !== -1 ? ico('check') : ico('plus')}${p}</button>`)}</div>
      <div class="row"><input id="dec-cond-in" type="text" class="grow" style="min-width:200px" data-bind="ui.term.condIn" placeholder="Eigene Auflage hinzufügen" value="${t.condIn}"><button class="btn sm" data-act="dec-cond-add">Hinzufügen</button></div>
      ${t.conds.filter((x) => cfg().conditionPresets.indexOf(x) === -1).map((x) => html`<div class="spread"><span>${x}</span><button class="btn sm ghost" data-act="dec-cond-del" data-text="${x}">${ico('x')}</button></div>`)}
    </div>`;
  };

  function decisionModal(dec) {
    const t = T(), ap = apptOf(t.id), type = typeOf(ap.typeId);
    t.dec = dec; t.reason = ''; t.conds = []; t.condIn = '';
    const label = decisionButtons(type).find((x) => x[0] === dec)[1];
    const app = ap.applicationId ? appOf(ap.applicationId) : null;
    const presets = cfg().reasonPresets[dec] || [];
    const needReason = dec !== 'genehmigt';
    const info = {
      genehmigt: type.key === 'vorstellung_unternehmen' || type.key === 'vorstellung_fraktion' ? 'Der Antrag wird genehmigt. Das System trägt das Unternehmen ein, vergibt die Registernummer und stellt den Gewerbeschein aus.' : 'Der Vorgang wird bestätigt.',
      auflagen: 'Die Eintragung erfolgt mit Auflagen. Eine Probezeit beginnt, die Nachkontrolle wird terminiert.',
      vertagt: 'Der Gründer bekommt Ihre Begründung und kann nachbessern. Ein Folgetermin wird bevorzugt vergeben.',
      abgelehnt: 'Der Gründer erhält einen Bescheid mit Ihrer Begründung und kann ' + cfg().rules.objectionHours + ' Stunden lang Einspruch einlegen.' + (app && app.fees ? ' ' + money(app.fees.register + app.fees.capital) + ' werden erstattet, die Antragsgebühr nicht.' : ''),
    }[dec];
    IC.modal.open({
      title: label, icon: 'stamp', wide: true,
      body: html`<div class="stack">
        ${c.callout(dec === 'abgelehnt' ? 'bad' : dec === 'genehmigt' ? 'ok' : 'warn', 'Folgen dieser Entscheidung', info)}
        ${dec === 'auflagen' ? c.field('dec-cond-in', 'Auflagen', html`<div data-partial="dec-conds">${IC.partials['dec-conds']()}</div>`, { req: true }) : ''}
        ${c.field('dec-reason', 'Begründung' + (needReason ? '' : ' (optional)'), html`<textarea id="dec-reason" data-bind="ui.term.reason" placeholder="Was war ausschlaggebend? Der Gründer liest diesen Text im Bescheid."></textarea>`, { req: needReason })}
        ${presets.length ? html`<div class="stack sm"><span class="lbl">Bausteine</span><div class="row sm">${presets.map((p, i) => html`<button class="btn sm" data-act="dec-preset" data-dec="${dec}" data-i="${i}">${p}</button>`)}</div></div>` : ''}
      </div>`,
      footer: html`<button class="btn" data-act="modal-close">Abbrechen</button><button class="btn ${dec === 'abgelehnt' ? 'danger solid' : 'primary'}" data-act="dec-confirm">${ico('stamp')}Entscheidung verbindlich treffen</button>`,
    });
  }

  /* ====================================================================
     Vorprüfung
     ==================================================================== */
  function reviews() {
    const d = S.d;
    const wait = d.officialApps.filter((a) => a.status === 'eingereicht').sort((a, b) => a.submittedAt - b.submittedAt);
    const other = d.officialApps.filter((a) => L.OPEN_APP.indexOf(a.status) !== -1 && a.status !== 'eingereicht');
    return html`
      <div class="page-head"><div><div class="crumbs">Beamten-Tablet · Vorprüfung</div><h1>Anträge zur Vorprüfung</h1><p class="sub">Prüfen Sie Vollständigkeit und Plausibilität. Das Ziel ist eine Bearbeitung binnen 48 Stunden.</p></div></div>
      ${dutyBar()}
      ${c.sheet('Wartet auf Vorprüfung', wait.length ? html`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Aktenzeichen</th><th>Name</th><th>Art</th><th>Antragsteller</th><th>Eingang</th><th></th></tr></thead><tbody>${wait.map((a) => {
        const f = formOf(a.legalForm), age = IC.now() - a.submittedAt, late = age > 48 * IC.HOUR;
        return html`<tr><td>${c.tag(a.caseNo)}</td><td><div class="strong">${a.name}</div><div class="sub">${a.branch ? branchOf(a.branch).label : 'Organisation'}</div></td><td>${f.label}</td><td>${who(a)}</td><td>${IC.dur(age)}${late ? html` ${c.chip('überfällig', 'bad')}` : ''}</td><td class="act"><button class="btn sm primary" data-act="rev-open" data-id="${a.id}">Prüfen</button></td></tr>`;
      })}</tbody></table></div>` : c.empty('check', 'Alles abgearbeitet', 'Es wartet kein Antrag auf die Vorprüfung.'), { icon: 'doc', flush: !!wait.length })}
      ${other.length ? c.sheet('Weitere laufende Anträge', html`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Aktenzeichen</th><th>Name</th><th>Antragsteller</th><th>Status</th></tr></thead><tbody>${other.map((a) => html`<tr><td>${c.tag(a.caseNo)}</td><td class="strong">${a.name}</td><td>${who(a)}</td><td>${c.appChip(a.status)}</td></tr>`)}</tbody></table></div>`, { icon: 'list', flush: true }) : ''}`;
